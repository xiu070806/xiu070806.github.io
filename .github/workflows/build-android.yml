name: Build CabCalc Android V50.14 - FINAL COMPLETE UI STACK + 390 WIDTH SCALE + GPS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare required native resources
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          XML
          test -s android-native/file_paths.xml
          echo "Required FileProvider resource: OK"
      - name: Write canonical native invoice share bridge
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/TaximetNativeShare.java <<'JAVA'
          package com.xiu070806.taximetpro;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import androidx.annotation.Keep;
          import java.io.File;
          import java.io.FileOutputStream;

          @Keep
          public final class TaximetNativeShare {
              private final Activity activity;
              private final WebView webView;
              private FileOutputStream pendingOut;
              private File pendingFile;
              private String pendingMime;
              private String pendingTitle;
              private String pendingText;

              public TaximetNativeShare(Activity activity, WebView webView) { this.activity = activity; this.webView = webView; }

              @JavascriptInterface
              public synchronized String beginShareBase64(String fileName, String mime, String title, String text) {
                  try {
                      cancelPending();
                      File dir = new File(activity.getCacheDir(), "taximet-share");
                      if (!dir.exists() && !dir.mkdirs()) throw new IllegalStateException("Không tạo được thư mục chia sẻ");
                      String safe = (fileName == null ? "cabcalc-invoice" : fileName).replaceAll("[^a-zA-Z0-9._-]", "_");
                      pendingFile = new File(dir, safe);
                      pendingOut = new FileOutputStream(pendingFile, false);
                      pendingMime = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime;
                      pendingTitle = title == null ? "CabCalc" : title;
                      pendingText = text == null ? "Hóa đơn CabCalc" : text;
                      return "SHARE_READY";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String appendShareBase64(String base64) {
                  try {
                      if (pendingOut == null) throw new IllegalStateException("Chưa khởi tạo tệp chia sẻ");
                      if (base64 == null || base64.isEmpty()) return "CHUNK_OK";
                      pendingOut.write(Base64.decode(base64, Base64.DEFAULT));
                      return "CHUNK_OK";
                  } catch (Exception e) { return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String finishShareBase64() {
                  try {
                      if (pendingOut == null || pendingFile == null) throw new IllegalStateException("Tệp chia sẻ chưa hoàn tất");
                      pendingOut.flush(); pendingOut.close(); pendingOut = null;
                      File file = pendingFile;
                      String mime = pendingMime, title = pendingTitle, text = pendingText;
                      pendingFile = null; pendingMime = pendingTitle = pendingText = null;
                      final Uri uri = FileProvider.getUriForFile(activity, activity.getPackageName() + ".fileprovider", file);
                      activity.runOnUiThread(() -> openShare(uri, mime, title, text));
                      return "SHARE_STARTED";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized void cancelShareBase64() { cancelPending(); }

              @JavascriptInterface
              public synchronized String shareBase64(final String base64, final String fileName, final String mime,
                                      final String title, final String text) {
                  try {
                      String r=beginShareBase64(fileName,mime,title,text); if (r.startsWith("ERROR:")) return r;
                      r=appendShareBase64(base64); if (r.startsWith("ERROR:")) { cancelPending(); return r; }
                      return finishShareBase64();
                  } catch(Exception e) { cancelPending(); return "ERROR:"+e.getClass().getSimpleName()+":"+String.valueOf(e.getMessage()); }
              }

              private void openShare(final Uri uri, final String mime, final String title, final String text) {
                  try {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType(mime);
                      send.putExtra(Intent.EXTRA_STREAM, uri);
                      send.putExtra(Intent.EXTRA_TEXT, text);
                      send.putExtra(Intent.EXTRA_TITLE, title);
                      send.setClipData(ClipData.newRawUri("CabCalc", uri));
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent chooser = Intent.createChooser(send, "Chia sẻ hóa đơn CabCalc");
                      chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      activity.startActivity(chooser);
                  } catch (Exception e) {
                      android.util.Log.e("CabCalcShare", "Unable to open Android share sheet", e);
                      if (webView != null) {
                          String msg = e.getClass().getSimpleName() + ": " + String.valueOf(e.getMessage());
                          final String js = "window.dispatchEvent(new CustomEvent('taximetNativeShareError',{detail:" + org.json.JSONObject.quote(msg) + "}));";
                          webView.post(() -> webView.evaluateJavascript(js, null));
                      }
                  }
              }

              private synchronized void cancelPending() {
                  try { if (pendingOut != null) pendingOut.close(); } catch (Exception ignored) {}
                  pendingOut = null; pendingFile = null; pendingMime = pendingTitle = pendingText = null;
              }
          }
          JAVA
          test -s android-native/TaximetNativeShare.java
      - name: Normalize native Java imports (self-healing preflight)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-native/TaximetLocationPlugin.java")
          s=p.read_text(errors="replace")
          if "getActivity()" in s and "import android.app.Activity;" not in s:
              lines=s.splitlines()
              pkg=next((i for i,x in enumerate(lines) if x.startswith("package ")),0)
              lines.insert(pkg+1,"import android.app.Activity;")
              p.write_text("\n".join(lines)+"\n")
              print("Inserted missing android.app.Activity import")
          # Hard assertions for native source used by the build.
          s=p.read_text(errors="replace")
          assert "import android.app.Activity;" in s if "getActivity()" in s else True
          assert "@CapacitorPlugin(name = \"TaximetLocation\")" in s
          print("Native Java import preflight OK")
          PY
      - name: Normalize GPS distance constants (self-healing preflight)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android-native/TaximetLocationService.java")
          s=p.read_text(errors="replace")

          # The previous YML assumed MAX_TRIP_SPEED_MPS already existed.
          # This build must also work when the checked-in service is an older
          # distance-engine variant with neither constant.
          constants = [
              ("MAX_TRIP_SPEED_MPS", "private static final double MAX_TRIP_SPEED_MPS = 50.0;"),
              ("MIN_CONFIDENT_SPEED_MPS", "private static final double MIN_CONFIDENT_SPEED_MPS = 0.8;"),
          ]

          missing = [(name, line) for name, line in constants if line not in s]
          if missing:
              anchor = "public class TaximetLocationService extends Service {"
              if anchor not in s:
                  raise SystemExit("Cannot normalize GPS constants: TaximetLocationService class marker missing")
              block = "".join("\n    " + line for _, line in missing)
              s = s.replace(anchor, anchor + block, 1)
              p.write_text(s)
              print("Inserted missing GPS constants: " + ", ".join(name for name, _ in missing))
          else:
              print("GPS distance constants already present")

          # Hard assertion: the exact constants required by the final verifier
          # must exist before that verifier runs.
          s=p.read_text(errors="replace")
          for name, line in constants:
              if line not in s:
                  raise SystemExit(f"GPS constant normalization failed: {name}")
          PY

      - name: Verify sources (deterministic Python)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          errors=[]
          files={k:Path(k).read_text(errors="replace") for k in [
            "android-native/MainActivity.java","android-native/TaximetLocationPlugin.java",
            "android-native/TaximetLocationService.java","android-native/TaximetNativeShare.java",
            "android-native/file_paths.xml","native-web-android/index.html"]}
          checks={
            "android-native/MainActivity.java":["ACCESS_BACKGROUND_LOCATION","REQ_BACKGROUND_LOCATION","startForegroundService"],
            "android-native/TaximetLocationPlugin.java":["setTripActive","getTripStats","shareFile","@CapacitorPlugin(name = \"TaximetLocation\")"],
            "android-native/TaximetLocationService.java":["tripActive","tripDistanceM","requestLocationUpdates","START_STICKY","HandlerThread","MAX_TRIP_GAP_MS","MAX_TRIP_SPEED_MPS","MIN_CONFIDENT_SPEED_MPS","Collections.sort"],
            "android-native/TaximetNativeShare.java":["beginShareBase64","appendShareBase64","finishShareBase64","shareBase64","FileProvider","ACTION_SEND","runOnUiThread"],
            "android-native/file_paths.xml":["<paths","cache-path"],
            "native-web-android/index.html":["androidShareBlob","exportInvoicePNG","exportInvoicePDF","exportDebtPNG","exportDebtPDF","nativeTripCall(\"startTrip\"","nativeTripCall(\"resumeTrip\",{})","nativeTripCall(\"pauseTrip\",{})","nativeTripCall(\"finishTrip\",{})"]}
          for fn,toks in checks.items():
            for t in toks:
              if t not in files[fn]: errors.append(f"{fn}: missing {t}")
          # Deterministic Java preflight for the exact compiler failure seen in FIX6.
          plugin_java=files["android-native/TaximetLocationPlugin.java"]
          if "getActivity()" in plugin_java and "import android.app.Activity;" not in plugin_java:
            errors.append("TaximetLocationPlugin.java: getActivity() uses Activity but android.app.Activity import is missing")
          for java_fn in ["android-native/MainActivity.java","android-native/TaximetLocationPlugin.java","android-native/TaximetLocationService.java","android-native/TaximetNativeShare.java"]:
            src=files[java_fn]
            if src.count("{")!=src.count("}"): errors.append(f"{java_fn}: unbalanced braces")

          h=files["native-web-android/index.html"]
          for t in ["CabCalc","Smart Ride, Smart Fare","paymentStateForTrip","paymentStateLabel","paymentStateClass","paymentStateColor","Tìm thấy chuyến chưa hoàn tất","TIẾP TỤC CHUYẾN","HÓA ĐƠN DỊCH VỤ","brand-calc","gps-ok .brand-calc","gps-bad .brand-calc","--cabcalc-ui-scale","width/REF","overflow:hidden!important","#revenue.screen.active","#debt.screen.active","#settings.screen.active","cabcalc-final-main-fit","-webkit-line-clamp:2","#clock.screen.active>#tripButtons","height:122px!important","cabcalc-main-interface-fixed-stack-v2","cabcalc-final-single-canvas-v3","bottom:82px!important","z-index:120!important","height:76px!important","--cabcalc-ui-scale"]:
            if t not in h: errors.append(f"index.html: missing FINAL UI marker {t}")
          if "for EVcar" in h or "TAXIMET PRO" in h: errors.append("visible legacy branding remains")
          # FINAL UI contract: no viewport-width clamp/reflow rules may override the 390px reference layout.
          if "@media (max-width:360px)" in h or "@media(max-width:360px)" in h: errors.append("legacy narrow-phone reflow rule remains")
          if re.search(r"(?:^|[;{])[^{}]*clamp\(", h): errors.append("CSS clamp remains; final layout must scale as one block")
          if re.search(r"(?:innerHeight|clientHeight)\s*/\s*390", h): errors.append("height participates in autofit scale")
          if "width:390px!important" not in h or "transform:translateX(-50%) scale(var(--cabcalc-ui-scale))" not in h or "width/REF" not in h: errors.append("390px width-only transformed reference shell missing")
          if "#clock.screen.active" not in h or "touch-action:none!important" not in h: errors.append("main screen scroll lock missing")
          if "#revenue.screen.active,#debt.screen.active,#settings.screen.active" not in h or "overflow-y:auto!important" not in h: errors.append("functional tab scroll container missing")
          # Main layout must not let variable-length address text push Start behind the fixed bottom nav.
          if "cabcalc-final-main-fit" not in h or "height:122px!important" not in h or "-webkit-line-clamp:2" not in h: errors.append("main route card fixed-height fit contract missing")
          if "#clock.screen.active>#tripButtons" not in h or "cabcalc-main-interface-fixed-stack-v2" not in h or "bottom:82px!important" not in h or "z-index:120!important" not in h: errors.append("Start-above-navigation stack contract missing")
          if "gps-ok .brand-card" in h and not re.search(r"#appHeader\.gps-ok \.brand-card[^{}]*\{[^}]*background:transparent!important",h,re.S):
            errors.append("header GPS state still changes header surface")
          # Invoice PNG/PDF on Android must route through the native share bridge.
          for fn in ["exportInvoicePNG","exportInvoicePDF","exportDebtPNG","exportDebtPDF"]:
            p=h.find("async function "+fn)
            q=h.find("\nasync function ",p+10) if p>=0 else -1
            chunk=h[p:q if q>0 else len(h)]
            if "androidShareBlob" not in chunk: errors.append(f"{fn}: missing Android native share route")
            if "beginShareBase64" not in h or "appendShareBase64" not in h or "finishShareBase64" not in h: errors.append("index.html: chunked native share bridge missing")
          # Native distance must be applied independently of the web GPS quality gate.
          op=h.find("function onPosition(pos){")
          nd=h.find("const nativeDistance=Number(pos?.distanceM);",op)
          gate=h.find("if(!acceptable",op)
          if op<0 or nd<0 or gate<0 or nd>gate: errors.append("native distance is not consumed before web GPS gate")
          # START order and final FINISH freeze order.
          st=h.find('async function startTrip(){'); sr=h.find('await nativeTripCall("startTrip",{tripId:active.id});',st); sg=h.find('await startGps();',st)
          if not (st>=0 and sr>=0 and sg>=0 and sr<sg): errors.append("START order invalid")
          ft=h.find('async function finishTrip(){'); ff=h.find('await nativeTripCall("finishTrip",{});',ft); fr=h.find('await reverseGeocode',ft); fs=h.find('applyNativeDistance(st)',ft)
          if not (ft>=0 and ff>=0 and fr>=0 and ff<fr and fs>ff): errors.append("FINISH does not freeze/read native distance before invoice")
          # Width-only scale must not contain height-derived scale formulas.
          if re.search(r"innerHeight[^;]*[/*]\s*390|clientHeight[^;]*[/*]\s*390",h): errors.append("autofit scale uses height")
          if errors:
            print("SOURCE VERIFICATION FAILED")
            print("\n".join("- "+e for e in errors))
            raise SystemExit(1)
          print("Source verification OK: FINAL COMPLETE UI + native invoice share + background GPS distance")
          PY
      - name: Verify inline JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          h=Path("native-web-android/index.html").read_text(errors="replace")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",h,re.S|re.I)
          checked=0
          for body in scripts:
              if not body.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False) as f:
                  f.write(body); name=f.name
              r=subprocess.run(["node","--check",name],text=True,capture_output=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
              checked+=1
          print(f"Inline JavaScript syntax OK: {checked} scripts")
          PY
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8
      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir -p www
          cp native-web-android/index.html www/index.html
      - name: Normalize Capacitor config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("capacitor.config.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({"appId":"com.xiu070806.taximetpro","appName":"CabCalc","webDir":"www","bundledWebRuntime":False})
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Create Android project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
      - name: Force Android ID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path("android/app/build.gradle"),Path("android/app/build.gradle.kts")]:
              if not p.exists(): continue
              s=p.read_text()
              if p.suffix==".kts":
                  s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.xiu070806.taximetpro"',s)
              else:
                  s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s+"[^"]+"','namespace "com.xiu070806.taximetpro"',s)
              p.write_text(s)
          PY
      - name: Install native sources
        run: |
          set -euo pipefail
          P=android/app/src/main/java/com/xiu070806/taximetpro
          mkdir -p "$P"
          cp android-native/*.java "$P/"
          mkdir -p android/app/src/main/res/xml
          cp android-native/file_paths.xml android/app/src/main/res/xml/taximet_file_paths.xml
      - name: Configure Android manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          perms=["ACCESS_COARSE_LOCATION","ACCESS_FINE_LOCATION","ACCESS_BACKGROUND_LOCATION","FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION","POST_NOTIFICATIONS"]
          for x in perms: s=re.sub(r"\s*<uses-permission android:name=\"android.permission."+x+r"\"\s*/>","",s)
          pos=s.find(">",s.find("<manifest"))+1
          s=s[:pos]+"\n"+"".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms)+s[pos:]
          s=re.sub(r'<activity[^>]*android:name="[^"]*MainActivity"[^>]*>.*?</activity>',"",s,flags=re.S)
          activity="""
          <activity android:name="com.xiu070806.taximetpro.MainActivity" android:exported="true" android:launchMode="singleTask" android:theme="@style/AppTheme">
              <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
          </activity>
          """
          service="""<service android:name="com.xiu070806.taximetpro.TaximetLocationService" android:exported="false" android:foregroundServiceType="location" android:stopWithTask="false" />"""
          provider="""<provider android:name="androidx.core.content.FileProvider" android:authorities="com.xiu070806.taximetpro.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/taximet_file_paths" /></provider>"""
          s=s.replace("</application>",activity+service+provider+"\n</application>")
          p.write_text(s)
          PY
      - name: Add Google location dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle") if Path("android/app/build.gradle").exists() else Path("android/app/build.gradle.kts")
          s=p.read_text()
          dep='implementation("com.google.android.gms:play-services-location:21.3.0")' if p.suffix==".kts" else 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if "play-services-location:21.3.0" not in s: s=s.replace("dependencies {","dependencies {\n    "+dep,1)
          p.write_text(s)
          PY
      - name: Generate launcher icon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          img=Image.open("assets/app-icon/icon-512.png").convert("RGBA"); assert Path("assets/app-icon/icon-1024.png").exists(); root=Path("android/app/src/main/res")
          sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True); im=img.resize((size,size),Image.Resampling.LANCZOS); im.save(d/"ic_launcher.png"); im.save(d/"ic_launcher_round.png")
          for p in root.rglob("ic_launcher*.xml"):
              if "mipmap-anydpi" in str(p): p.unlink()
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          s=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/ic_launcher"',s); s=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',s)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Verify final APK (deterministic)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile, re
          apks=list(Path("android/app/build/outputs/apk/debug").glob("*.apk"))
          if not apks: raise SystemExit("No debug APK produced")
          apk=apks[0]
          if apk.stat().st_size<=0: raise SystemExit("APK is empty")
          with zipfile.ZipFile(apk) as z:
            names=set(z.namelist())
            for n in ["assets/capacitor.plugins.json","res/xml/taximet_file_paths.xml"]:
              if not any(x==n or x.endswith("/"+n) for x in names): raise SystemExit(f"Missing APK resource: {n}")
            dex=b"".join(z.read(n) for n in names if re.fullmatch(r"classes(?:\d+)?\.dex",n))
            for token in [b"TaximetLocationService",b"tripDistanceM",b"TaximetNativeShare",b"beginShareBase64",b"appendShareBase64",b"finishShareBase64",b"shareBase64"]:
              if token not in dex: raise SystemExit(f"Missing native marker: {token.decode()}")
            plugins=z.read("assets/capacitor.plugins.json").decode("utf-8","replace")
            for token in ["@capacitor/share","@capacitor/filesystem"]:
              if token not in plugins: raise SystemExit(f"Missing plugin: {token}")
          print(f"APK verification OK: {apk} ({apk.stat().st_size} bytes)")
          PY
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.14-Android-FINAL-UI-GPS
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
