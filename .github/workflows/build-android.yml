name: CabCalc Android V50.18 - History Revenue Weekly + Canonical Native GPS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare required native resources
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          XML
          test -s android-native/file_paths.xml
          echo "Required FileProvider resource: OK"
      - name: Write canonical native invoice share bridge
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/TaximetNativeShare.java <<'JAVA'
          package com.xiu070806.taximetpro;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import androidx.annotation.Keep;
          import java.io.File;
          import java.io.FileOutputStream;

          @Keep
          public final class TaximetNativeShare {
              private final Activity activity;
              private final WebView webView;
              private FileOutputStream pendingOut;
              private File pendingFile;
              private String pendingMime;
              private String pendingTitle;
              private String pendingText;

              public TaximetNativeShare(Activity activity, WebView webView) { this.activity = activity; this.webView = webView; }

              @JavascriptInterface
              public synchronized String beginShareBase64(String fileName, String mime, String title, String text) {
                  try {
                      cancelPending();
                      File dir = new File(activity.getCacheDir(), "taximet-share");
                      if (!dir.exists() && !dir.mkdirs()) throw new IllegalStateException("Không tạo được thư mục chia sẻ");
                      String safe = (fileName == null ? "cabcalc-invoice" : fileName).replaceAll("[^a-zA-Z0-9._-]", "_");
                      pendingFile = new File(dir, safe);
                      pendingOut = new FileOutputStream(pendingFile, false);
                      pendingMime = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime;
                      pendingTitle = title == null ? "CabCalc" : title;
                      pendingText = text == null ? "Hóa đơn CabCalc" : text;
                      return "SHARE_READY";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String appendShareBase64(String base64) {
                  try {
                      if (pendingOut == null) throw new IllegalStateException("Chưa khởi tạo tệp chia sẻ");
                      if (base64 == null || base64.isEmpty()) return "CHUNK_OK";
                      pendingOut.write(Base64.decode(base64, Base64.DEFAULT));
                      return "CHUNK_OK";
                  } catch (Exception e) { return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String finishShareBase64() {
                  try {
                      if (pendingOut == null || pendingFile == null) throw new IllegalStateException("Tệp chia sẻ chưa hoàn tất");
                      pendingOut.flush(); pendingOut.close(); pendingOut = null;
                      File file = pendingFile;
                      String mime = pendingMime, title = pendingTitle, text = pendingText;
                      pendingFile = null; pendingMime = pendingTitle = pendingText = null;
                      final Uri uri = FileProvider.getUriForFile(activity, activity.getPackageName() + ".fileprovider", file);
                      activity.runOnUiThread(() -> openShare(uri, mime, title, text));
                      return "SHARE_STARTED";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized void cancelShareBase64() { cancelPending(); }

              @JavascriptInterface
              public synchronized String shareBase64(final String base64, final String fileName, final String mime,
                                      final String title, final String text) {
                  try {
                      String r=beginShareBase64(fileName,mime,title,text); if (r.startsWith("ERROR:")) return r;
                      r=appendShareBase64(base64); if (r.startsWith("ERROR:")) { cancelPending(); return r; }
                      return finishShareBase64();
                  } catch(Exception e) { cancelPending(); return "ERROR:"+e.getClass().getSimpleName()+":"+String.valueOf(e.getMessage()); }
              }

              private void openShare(final Uri uri, final String mime, final String title, final String text) {
                  try {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType(mime);
                      send.putExtra(Intent.EXTRA_STREAM, uri);
                      send.putExtra(Intent.EXTRA_TEXT, text);
                      send.putExtra(Intent.EXTRA_TITLE, title);
                      send.setClipData(ClipData.newRawUri("CabCalc", uri));
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent chooser = Intent.createChooser(send, "Chia sẻ hóa đơn CabCalc");
                      chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      activity.startActivity(chooser);
                  } catch (Exception e) {
                      android.util.Log.e("CabCalcShare", "Unable to open Android share sheet", e);
                      if (webView != null) {
                          String msg = e.getClass().getSimpleName() + ": " + String.valueOf(e.getMessage());
                          final String js = "window.dispatchEvent(new CustomEvent('taximetNativeShareError',{detail:" + org.json.JSONObject.quote(msg) + "}));";
                          webView.post(() -> webView.evaluateJavascript(js, null));
                      }
                  }
              }

              private synchronized void cancelPending() {
                  try { if (pendingOut != null) pendingOut.close(); } catch (Exception ignored) {}
                  pendingOut = null; pendingFile = null; pendingMime = pendingTitle = pendingText = null;
              }
          }
          JAVA
          test -s android-native/TaximetNativeShare.java
      - name: Normalize native Java imports (self-healing preflight)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-native/TaximetLocationPlugin.java")
          s=p.read_text(errors="replace")
          if "getActivity()" in s and "import android.app.Activity;" not in s:
              lines=s.splitlines()
              pkg=next((i for i,x in enumerate(lines) if x.startswith("package ")),0)
              lines.insert(pkg+1,"import android.app.Activity;")
              p.write_text("\n".join(lines)+"\n")
              print("Inserted missing android.app.Activity import")
          # Hard assertions for native source used by the build.
          s=p.read_text(errors="replace")
          assert "import android.app.Activity;" in s if "getActivity()" in s else True
          assert "@CapacitorPlugin(name = \"TaximetLocation\")" in s
          print("Native Java import preflight OK")
          PY
      - name: Install canonical Android GPS distance engine sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationService.java").write_bytes(base64.b64decode(""))
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          PY
          echo "Canonical Android GPS distance engine sources installed"

      - name: Install canonical Android GPS bridge and Activity
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          Path("android-native/MainActivity.java").write_bytes(base64.b64decode(""))
          print("Canonical Android GPS bridge + Activity installed")
          PY3

      - name: Install canonical Android trip lifecycle bridge
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          PY2
          python3 - <<'PY2'
          from pathlib import Path
          import re
          s=Path("android-native/TaximetLocationPlugin.java").read_text(errors="replace")
          required=["startTrip","pauseTrip","resumeTrip","finishTrip","clearFinishedTrip","setTripActive","getTripStats"]
          for m in required: assert len(re.findall(r"public void "+re.escape(m)+r"\(PluginCall call\)",s))==1, m
          assert re.search(r"private void putTripDistanceM\(SharedPreferences\.Editor e, double d\)",s)
          assert re.search(r"private boolean hasFineLocationPermission\(\)",s)
          assert "public class TaximetLocationPlugin extends Plugin" in s
          assert "public class TaximetLocationService extends Service" not in s
          assert s.count("{")==s.count("}")
          print("Canonical Android trip lifecycle plugin installed")
          PY2
      - name: Install current CabCalc v50.17/v50.18 UI (single clean merge)
        run: |
          set -euo pipefail
          mkdir -p native-web-android
          python3 - <<'PYUI'
          import base64
          from pathlib import Path
          data=base64.b64decode("")
          p=Path("native-web-android/index.html")
          p.write_bytes(data)
          if p.stat().st_size != 193127: raise SystemExit("Reference IPA UI size mismatch")
          print(f"Installed reference IPA UI: {p.stat().st_size} bytes")
          PYUI

      - name: Verify source contract (IPA UI + native Android GPS)
        run: |
          set -euo pipefail
          python3 - <<'PYVERIFY'
          from pathlib import Path
          import re
          files={k:Path(k).read_text(errors="replace") for k in [
            "android-native/MainActivity.java","android-native/TaximetLocationPlugin.java",
            "android-native/TaximetLocationService.java","android-native/TaximetNativeShare.java",
            "android-native/file_paths.xml","native-web-android/index.html"]}
          checks={
            "android-native/MainActivity.java":["ACCESS_BACKGROUND_LOCATION","REQ_BACKGROUND_LOCATION","startForegroundService"],
            "android-native/TaximetLocationPlugin.java":["setTripActive","startTrip","pauseTrip","resumeTrip","finishTrip","clearFinishedTrip","getTripStats","@CapacitorPlugin(name = \"TaximetLocation\")"],
            "android-native/TaximetLocationService.java":["tripActive","tripDistanceM","requestLocationUpdates","START_STICKY","HandlerThread","MAX_TRIP_GAP_MS","MAX_TRIP_SPEED_MPS","KEY_TRIP_DISTANCE_BITS","KEY_NEEDS_ANCHOR","Collections.sort"],
            "android-native/TaximetNativeShare.java":["beginShareBase64","appendShareBase64","finishShareBase64","shareBase64","FileProvider","ACTION_SEND"],
            "android-native/file_paths.xml":["<paths","cache-path"],
            "native-web-android/index.html":["nativeTaximetGps","nativeTripCall(\"startTrip\"","nativeTripCall(\"resumeTrip\",{})","nativeTripCall(\"pauseTrip\",{})","nativeTripCall(\"finishTrip\",{})","<nav class=\"bottom\">","PHỤ PHÍ & GIẢM","cabcalc-native-android-gps-poll-v2"]
          }
          for f,needles in checks.items():
              for n in needles:
                  if n not in files[f]: raise SystemExit(f"{f}: missing {n}")
          h=files["native-web-android/index.html"]
          if re.search(r"navigator\.geolocation|\bwatchPosition\b|\bgetCurrentPosition\b|\bclearWatch\b",h):
              raise SystemExit("index.html: browser GPS API remains")
          if len(re.findall(r'<style\b',h,re.I)) < 1: raise SystemExit("index.html: no styles")
          if len(re.findall(r'<script\b',h,re.I)) < 1: raise SystemExit("index.html: no scripts")
          print("SOURCE CONTRACT OK: IPA reference UI + canonical native Android GPS")
          PYVERIFY

      - name: Verify inline JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          h=Path("native-web-android/index.html").read_text(errors="replace")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",h,re.S|re.I)
          checked=0
          for body in scripts:
              if not body.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False) as f:
                  f.write(body); name=f.name
              r=subprocess.run(["node","--check",name],text=True,capture_output=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
              checked+=1
          print(f"Inline JavaScript syntax OK: {checked} scripts")
          PY
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          # Pin the complete Capacitor family before dependency resolution.
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/ios@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8
          npm install
          npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/ios @capacitor/share @capacitor/filesystem --depth=0

      - name: Audit current Android UI + native bridge compatibility
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          h=Path("native-web-android/index.html").read_text(errors="replace")
          expected_sha="9a636cf245be4226802579365e3a4965edd905d329a6aecf9bc0352db1261549"
          actual_sha=hashlib.sha256(h.encode()).hexdigest()
          assert actual_sha==expected_sha, f"HTML SHA drift: {actual_sha} != {expected_sha}"
          required=[
            "revenue-mode-tabs","revenueWeekStrip","revenueDailyList","historyModePanel",
            "expandedRevenueDays","finishedAt","TỔNG DOANH THU · BAO GỒM CÔNG NỢ",
            "TIỀN MẶT","CHUYỂN KHOẢN","CÔNG NỢ","androidShareBlob",
            "isNativeAndroidTaximet","nativeTaximetGps","nativeTripCall(\"startTrip\"",
          ]
          missing=[x for x in required if x not in h]
          if missing: raise SystemExit("UI CONTRACT MISSING "+repr(missing))
          forbidden=["navigator.geolocation","watchPosition","getCurrentPosition","clearWatch","haversineM","computeRoutes","routes.googleapis.com"]
          bad=[x for x in forbidden if x in h]
          if bad: raise SystemExit("BROWSER GPS/DISTANCE ENGINE PRESENT "+repr(bad))
          names=[]
          for line in h.splitlines():
            st=line.strip()
            if st.startswith("function "):
              token=st[len("function "):].split("(",1)[0].strip()
              if token: names.append(token)
          dup=sorted({x for x in names if names.count(x)>1})
          if dup: raise SystemExit("DUPLICATE JS FUNCTIONS "+repr(dup))
          if h.count("</html>")!=1 or h.split("</html>",1)[1].strip(): raise SystemExit("INVALID HTML")
          print("Android UI contract: PASS",len(h.encode()),"bytes",actual_sha)
          PY
          test -s android-native/TaximetNativeShare.java
          grep -q 'addJavascriptInterface(new TaximetNativeShare' android-native/MainActivity.java
          grep -q '@CapacitorPlugin(name = "TaximetLocation")' android-native/TaximetLocationPlugin.java
          grep -q 'play-services-location:21.3.0' android-native/TaximetLocationService.java || true
      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir -p www/vendor
          cp native-web-android/index.html www/index.html
          # Load the browser-side invoice engines locally inside the APK.
          python3 - <<'PY3'
          from pathlib import Path
          import re
          p=Path("www/index.html")
          h=p.read_text(errors="replace")
          h=re.sub(r'<script[^>]+src=["\'](?:\./)?vendor/html2canvas\.min\.js["\'][^>]*></script>\s*', '', h, flags=re.I)
          h=re.sub(r'<script[^>]+src=["\'](?:\./)?vendor/jspdf\.umd\.min\.js["\'][^>]*></script>\s*', '', h, flags=re.I)
          tags="""<script src="./vendor/html2canvas.min.js"></script>
          <script src="./vendor/jspdf.umd.min.js"></script>
          """
          if '</head>' not in h: raise SystemExit('www/index.html: </head> missing')
          h=h.replace('</head>',tags+'</head>',1)
          p.write_text(h)
          PY3
          # Invoice export is implemented by the web layer and requires the
          # exact local browser-side engines referenced by index.html.
          # Keep them inside the APK; do not depend on an online CDN at runtime.
          npm install --no-save --save-exact html2canvas@1.4.1 jspdf@2.5.2
          cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          test -s www/vendor/html2canvas.min.js
          test -s www/vendor/jspdf.umd.min.js
      - name: Verify invoice export engines (robust PDF route)
        run: |
          set -euo pipefail
          test -s www/vendor/html2canvas.min.js
          test -s www/vendor/jspdf.umd.min.js
          grep -q '<script src="./vendor/html2canvas.min.js"></script>' www/index.html
          grep -q '<script src="./vendor/jspdf.umd.min.js"></script>' www/index.html
          grep -q 'window.jspdf' www/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path("www/index.html").read_text(errors="replace")
          fns=["exportInvoicePNG","exportInvoicePDF","exportDebtPNG","exportDebtPDF"]
          for fn in fns:
              a=h.find("async function "+fn)
              b=h.find("async function ",a+10) if a>=0 else -1
              if a<0: raise SystemExit(f"{fn}: function missing")
              if b<0: b=len(h)
              chunk=h[a:b]
              if "androidShareBlob(" not in chunk:
                  raise SystemExit(f"{fn}: native Android share call missing")
          # PDF generation may be centralized in canvasToPagedPdfBlob().
          # Do not require exportDebtPDF() itself to contain pdf.output("blob").
          a=h.find("async function exportDebtPDF")
          b=h.find("async function ",a+10)
          chunk=h[a:len(h) if b<0 else b]
          if "canvasToPagedPdfBlob(" not in chunk and not re.search(r"pdf\s*\.\s*output\s*\(\s*[\"']blob[\"']\s*\)", chunk):
              raise SystemExit("exportDebtPDF: PDF blob generation route missing")
          if "canvasToPagedPdfBlob" in h:
              m=re.search(r"async function canvasToPagedPdfBlob\s*\([^)]*\)\s*\{",h)
              if not m: raise SystemExit("canvasToPagedPdfBlob: definition missing")
              c=h[m.start():h.find("async function ",m.end()) if h.find("async function ",m.end())>=0 else len(h)]
              if not re.search(r"pdf\s*\.\s*output\s*\(\s*[\"']blob[\"']\s*\)", c):
                  raise SystemExit("canvasToPagedPdfBlob: PDF blob output missing")
          print("Invoice export function-flow verification OK")
          PY
          echo "Invoice export engines present: html2canvas + jsPDF"
      - name: Normalize Capacitor config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("capacitor.config.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({"appId":"com.xiu070806.taximetpro","appName":"CabCalc","webDir":"www","bundledWebRuntime":False})
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Create Android project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
      - name: Force Android ID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path("android/app/build.gradle"),Path("android/app/build.gradle.kts")]:
              if not p.exists(): continue
              s=p.read_text()
              if p.suffix==".kts":
                  s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.xiu070806.taximetpro"',s)
              else:
                  s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s+"[^"]+"','namespace "com.xiu070806.taximetpro"',s)
              p.write_text(s)
          PY
      - name: Install native sources
        run: |
          set -euo pipefail
          P=android/app/src/main/java/com/xiu070806/taximetpro
          mkdir -p "$P"
          cp android-native/*.java "$P/"
          mkdir -p android/app/src/main/res/xml
          cp android-native/file_paths.xml android/app/src/main/res/xml/taximet_file_paths.xml
      - name: Audit generated native Android sources before Gradle
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[
            Path("android/app/src/main/java/com/xiu070806/taximetpro/MainActivity.java"),
            Path("android/app/src/main/java/com/xiu070806/taximetpro/TaximetLocationPlugin.java"),
            Path("android/app/src/main/java/com/xiu070806/taximetpro/TaximetLocationService.java"),
            Path("android/app/src/main/java/com/xiu070806/taximetpro/TaximetNativeShare.java")]
          for p in files:
            s=p.read_text(errors="replace")
            if s.count("{")!=s.count("}"): raise SystemExit(f"Brace mismatch: {p}")
            if not s.startswith("package com.xiu070806.taximetpro;"): raise SystemExit(f"Package mismatch: {p}")
          p=files[1]; s=p.read_text(errors="replace")
          for m in ["start","stop","startTrip","pauseTrip","resumeTrip","finishTrip","clearFinishedTrip","getTripStats","setTripActive"]:
            if len(re.findall(r"public void "+re.escape(m)+r"\(PluginCall call\)",s))!=1: raise SystemExit(f"Plugin method mismatch: {m}")
          assert "@CapacitorPlugin(name = \"TaximetLocation\")" in s
          s=files[0].read_text(errors="replace")
          assert "registerPlugin(TaximetLocationPlugin.class)" in s
          assert "addJavascriptInterface(new TaximetNativeShare" in s
          print("Native Android source audit: PASS")
          PY
      - name: Configure Android manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          perms=["ACCESS_COARSE_LOCATION","ACCESS_FINE_LOCATION","ACCESS_BACKGROUND_LOCATION","FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION","POST_NOTIFICATIONS"]
          for x in perms: s=re.sub(r"\s*<uses-permission android:name=\"android.permission."+x+r"\"\s*/>","",s)
          pos=s.find(">",s.find("<manifest"))+1
          s=s[:pos]+"\n"+"".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms)+s[pos:]
          s=re.sub(r'<activity[^>]*android:name="[^"]*MainActivity"[^>]*>.*?</activity>',"",s,flags=re.S)
          activity="""
          <activity android:name="com.xiu070806.taximetpro.MainActivity" android:exported="true" android:launchMode="singleTask" android:theme="@style/AppTheme">
              <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
          </activity>
          """
          service="""<service android:name="com.xiu070806.taximetpro.TaximetLocationService" android:exported="false" android:foregroundServiceType="location" android:stopWithTask="false" />"""
          provider="""<provider android:name="androidx.core.content.FileProvider" android:authorities="com.xiu070806.taximetpro.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/taximet_file_paths" /></provider>"""
          s=s.replace("</application>",activity+service+provider+"\n</application>")
          p.write_text(s)
          PY
      - name: Add Google location dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle") if Path("android/app/build.gradle").exists() else Path("android/app/build.gradle.kts")
          s=p.read_text()
          dep='implementation("com.google.android.gms:play-services-location:21.3.0")' if p.suffix==".kts" else 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if "play-services-location:21.3.0" not in s: s=s.replace("dependencies {","dependencies {\n    "+dep,1)
          p.write_text(s)
          PY
      - name: Generate launcher icon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          img=Image.open("assets/app-icon/icon-512.png").convert("RGBA"); assert Path("assets/app-icon/icon-1024.png").exists(); root=Path("android/app/src/main/res")
