            if len(re.findall(r"public void "+re.escape(m)+r"\s*\(\s*PluginCall\s+call\s*\)", plugin_java)) != 1:
              errors.append(f"TaximetLocationPlugin.java: {m}(PluginCall) definition missing/duplicated")
          service_java=files["android-native/TaximetLocationService.java"]
          if len(re.findall(r"MAX_TRIP_SPEED_MPS\s*=", service_java)) != 1:
            errors.append("TaximetLocationService.java: MAX_TRIP_SPEED_MPS must be defined exactly once")
          if "getCurrentLocation(Priority.PRIORITY_HIGH_ACCURACY" not in service_java:
            errors.append("TaximetLocationService.java: fresh GPS bootstrap missing")
          if "addOnFailureListener" not in service_java:
            errors.append("TaximetLocationService.java: GPS request failure reporting missing")

          main_java=files["android-native/MainActivity.java"]
          if "TaximetNativeShare" not in main_java or "addJavascriptInterface" not in main_java:
            errors.append("MainActivity.java: TaximetNativeShare is not attached to WebView")

          h=files["native-web-android/index.html"]
          if re.search(r"navigator\.geolocation|\bwatchPosition\b|\bgetCurrentPosition\b|\bclearWatch\b", h):
            errors.append("index.html: browser Web GPS API remains; native GPS must be the only source")
          if "cabcalc-final-native-gps-ui-v8" not in h:
            errors.append("index.html: final native GPS/UI contract missing")
          for sid in ["cabcalc-trip-actions-flow-v1","cabcalc-trip-actions-flow-v2","cabcalc-trip-actions-final-v3","cabcalc-unified-390-canvas-v5","cabcalc-final-native-gps-ui-v7"]:
            if re.search(r'<style\s+id=["\']'+re.escape(sid)+r'["\']',h,re.I): errors.append("index.html: legacy final UI style remains: "+sid)
          for t in ["androidShareBlob","TaximetNativeShare","CabCalc","Smart Ride, Smart Fare","paymentStateForTrip","paymentStateLabel","paymentStateClass","paymentStateColor","Tìm thấy chuyến chưa hoàn tất","TIẾP TỤC CHUYẾN","HÓA ĐƠN DỊCH VỤ","brand-calc","gps-ok .brand-calc","gps-bad .brand-calc","--cabcalc-ui-scale","width/REF","overflow:hidden!important","#revenue.screen.active","#debt.screen.active","#settings.screen.active","#clock.screen.active>#tripButtons","height:122px!important","cabcalc-final-native-gps-ui-v8","cabcalc-native-android-gps-poll-v2","--cabcalc-ui-scale"]:
            if t not in h: errors.append(f"index.html: missing FINAL UI marker {t}")
          if "for EVcar" in h or "TAXIMET PRO" in h: errors.append("visible legacy branding remains")
          # FINAL UI contract: no viewport-width clamp/reflow rules may override the 390px reference layout.
          if "@media (max-width:360px)" in h or "@media(max-width:360px)" in h: errors.append("legacy narrow-phone reflow rule remains")
          if re.search(r"(?:^|[;{])[^{}]*clamp\(", h): errors.append("CSS clamp remains; final layout must scale as one block")
          if re.search(r"(?:innerHeight|clientHeight)\s*/\s*390", h): errors.append("height participates in autofit scale")
          if "width:390px!important" not in h or "transform:translateX(-50%) scale(var(--cabcalc-ui-scale))" not in h or "width/REF" not in h: errors.append("390px width-only transformed reference shell missing")
          if "#clock.screen.active" not in h or "touch-action:none!important" not in h: errors.append("main screen scroll lock missing")
          if "#revenue.screen.active,#debt.screen.active,#settings.screen.active" not in h or "overflow-y:auto!important" not in h: errors.append("functional tab scroll container missing")
          # Unified canvas: bottom navigation is a primary row of the same 390px canvas.
          if '<nav class="bottom">' not in h: errors.append("index.html: bottom navigation missing")
          if re.search(r"#clock\.screen\.active>#tripButtons\s*\{[^}]*position:absolute!important",h,re.S): errors.append("index.html: tripButtons still absolute-positioned")
          if re.search(r"\.bottom\s*\{[^{}]*position\s*:\s*fixed\s*!important",h,re.S|re.I): errors.append("index.html: bottom navigation still viewport-fixed")
          # COMPILE28: v5 is intentionally removed during finalization; v8 is the sole final canvas contract.
          if "cabcalc-final-native-gps-ui-v8" not in h: errors.append("index.html: final unified 390px canvas missing")
          if re.search(r"(?i)bottom\s*:\s*82px\s*(?:!important\s*)?;", h): errors.append("index.html: legacy bottom declaration remains")
          if "cabcalc-native-android-gps-poll-v2" not in h: errors.append("index.html: native Android GPS poll missing")
          if re.search(r"\.bottom\s*\{[^{}]*position\s*:\s*fixed",h,re.S|re.I): errors.append("index.html: legacy fixed bottom rule remains")
          if "o.put(\"distanceM\", d);" not in plugin_java: errors.append("TaximetLocationPlugin.java: native distance alias missing")
          if re.search(r"navigator\.geolocation|\bwatchPosition\b|\bgetCurrentPosition\b|\bclearWatch\b", h): errors.append("index.html: browser GPS API remains")
          if "height:844px!important" in h or "grid-template-rows:88px 1fr 76px" in h: errors.append("index.html: rigid 844/88/76 legacy UI shell remains")

          for label in ["ĐỒNG HỒ","DOANH THU","CÔNG NỢ","CÀI ĐẶT"]:
            if label not in h: errors.append("Bottom tab missing: "+label)
          if '.putExtra("distanceM"' not in service_java: errors.append("TaximetLocationService.java: distanceM broadcast alias missing")
          if 'getTripStats' not in plugin_java: errors.append("TaximetLocationPlugin.java: getTripStats missing")
          if errors:
            print("SOURCE VERIFICATION FAILED")
            print("\n".join("- "+e for e in errors))
            raise SystemExit(1)
          print("Source verification OK: FINAL COMPLETE UI + native invoice share + background GPS distance")
          PY
      - name: Verify inline JavaScript syntax
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          h=Path("native-web-android/index.html").read_text(errors="replace")
          scripts=re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>",h,re.S|re.I)
          checked=0
          for body in scripts:
              if not body.strip(): continue
              with tempfile.NamedTemporaryFile("w",suffix=".js",delete=False) as f:
                  f.write(body); name=f.name
              r=subprocess.run(["node","--check",name],text=True,capture_output=True)
              if r.returncode:
                  print(r.stderr); raise SystemExit(1)
              checked+=1
          print(f"Inline JavaScript syntax OK: {checked} scripts")
          PY
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          # Pin the complete Capacitor family before dependency resolution.
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/ios@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8
          npm install
          npm ls @capacitor/core @capacitor/cli @capacitor/android @capacitor/ios @capacitor/share @capacitor/filesystem --depth=0

      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir -p www/vendor
          cp native-web-android/index.html www/index.html
          # Load the browser-side invoice engines locally inside the APK.
          python3 - <<'PY3'
          from pathlib import Path
          import re
          p=Path("www/index.html")
          h=p.read_text(errors="replace")
          h=re.sub(r'<script[^>]+src=["\'](?:\./)?vendor/html2canvas\.min\.js["\'][^>]*></script>\s*', '', h, flags=re.I)
          h=re.sub(r'<script[^>]+src=["\'](?:\./)?vendor/jspdf\.umd\.min\.js["\'][^>]*></script>\s*', '', h, flags=re.I)
          tags="""<script src="./vendor/html2canvas.min.js"></script>
          <script src="./vendor/jspdf.umd.min.js"></script>
          """
          if '</head>' not in h: raise SystemExit('www/index.html: </head> missing')
          h=h.replace('</head>',tags+'</head>',1)
          p.write_text(h)
          PY3
          # Invoice export is implemented by the web layer and requires the
          # exact local browser-side engines referenced by index.html.
          # Keep them inside the APK; do not depend on an online CDN at runtime.
          npm install --no-save --save-exact html2canvas@1.4.1 jspdf@2.5.2
          cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js
          test -s www/vendor/html2canvas.min.js
          test -s www/vendor/jspdf.umd.min.js
      - name: Verify invoice export engines (robust PDF route)
        run: |
          set -euo pipefail
          test -s www/vendor/html2canvas.min.js
          test -s www/vendor/jspdf.umd.min.js
          grep -q '<script src="./vendor/html2canvas.min.js"></script>' www/index.html
          grep -q '<script src="./vendor/jspdf.umd.min.js"></script>' www/index.html
          grep -q 'window.jspdf' www/index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          h=Path("www/index.html").read_text(errors="replace")
          fns=["exportInvoicePNG","exportInvoicePDF","exportDebtPNG","exportDebtPDF"]
          for fn in fns:
              a=h.find("async function "+fn)
              b=h.find("async function ",a+10) if a>=0 else -1
              if a<0: raise SystemExit(f"{fn}: function missing")
              if b<0: b=len(h)
              chunk=h[a:b]
              if "androidShareBlob(" not in chunk:
                  raise SystemExit(f"{fn}: native Android share call missing")
          # PDF generation may be centralized in canvasToPagedPdfBlob().
          # Do not require exportDebtPDF() itself to contain pdf.output("blob").
          a=h.find("async function exportDebtPDF")
          b=h.find("async function ",a+10)
          chunk=h[a:len(h) if b<0 else b]
          if "canvasToPagedPdfBlob(" not in chunk and not re.search(r"pdf\s*\.\s*output\s*\(\s*[\"']blob[\"']\s*\)", chunk):
              raise SystemExit("exportDebtPDF: PDF blob generation route missing")
          if "canvasToPagedPdfBlob" in h:
              m=re.search(r"async function canvasToPagedPdfBlob\s*\([^)]*\)\s*\{",h)
              if not m: raise SystemExit("canvasToPagedPdfBlob: definition missing")
              c=h[m.start():h.find("async function ",m.end()) if h.find("async function ",m.end())>=0 else len(h)]
              if not re.search(r"pdf\s*\.\s*output\s*\(\s*[\"']blob[\"']\s*\)", c):
                  raise SystemExit("canvasToPagedPdfBlob: PDF blob output missing")
          print("Invoice export function-flow verification OK")
          PY
          echo "Invoice export engines present: html2canvas + jsPDF"
