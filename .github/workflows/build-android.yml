name: Build TAXIMET PRO Android APK V6 BACKGROUND GPS + SHARE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify sources
        run: |
          set -euo pipefail
          test -s native-web-android/index.html
          test -s android-native/MainActivity.java
          test -s android-native/TaximetLocationPlugin.java
          test -s android-native/TaximetLocationService.java
          grep -F 'backgroundTripTracking' android-native/TaximetLocationService.java >/dev/null
          grep -F 'setBackgroundTracking' android-native/TaximetLocationPlugin.java >/dev/null
          grep -F 'androidShareBlob' native-web-android/index.html >/dev/null
          test -s assets/app-icon/icon-512.png
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8
      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir -p www
          cp native-web-android/index.html www/index.html
      - name: Normalize Capacitor app configuration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("capacitor.config.json")
          data=json.loads(p.read_text()) if p.exists() else {}
          data["appId"]="com.xiu070806.taximetpro"
          data["appName"]="TAXIMET PRO"
          data["webDir"]="www"
          p.write_text(json.dumps(data, indent=2)+"\n")
          PY
      - name: Create Android project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android

      - name: Force Android applicationId and namespace
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path('android/app/build.gradle'),Path('android/app/build.gradle.kts')]:
              if not p.exists(): continue
              s=p.read_text()
              if p.suffix=='.kts':
                  s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.xiu070806.taximetpro"',s)
              else:
                  s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s+"[^"]+"','namespace "com.xiu070806.taximetpro"',s)
              p.write_text(s)
          PY
      - name: Install native GPS bridge
        run: |
          set -euo pipefail
          P=android/app/src/main/java/com/xiu070806/taximetpro
          mkdir -p "$P"
          cp android-native/*.java "$P/"
      - name: Configure Android manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          perms=['ACCESS_COARSE_LOCATION','ACCESS_FINE_LOCATION','ACCESS_BACKGROUND_LOCATION','FOREGROUND_SERVICE','FOREGROUND_SERVICE_LOCATION','POST_NOTIFICATIONS']
          for x in perms: s=re.sub(r'\s*<uses-permission android:name="android.permission.'+x+r'"\s*/>','',s)
          pos=s.find('>',s.find('<manifest'))+1
          s=s[:pos]+'\n'+''.join('    <uses-permission android:name="android.permission.%s" />\n'%x for x in perms)+s[pos:]
          s=re.sub(r'<activity[^>]*android:name="[^"]*MainActivity"[^>]*>.*?</activity>','',s,flags=re.S)
          activity='''\n        <activity android:name="com.xiu070806.taximetpro.MainActivity" android:exported="true" android:launchMode="singleTask" android:theme="@style/AppTheme">\n            <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>\n        </activity>\n'''
          service='''\n        <service android:name="com.xiu070806.taximetpro.TaximetLocationService" android:exported="false" android:foregroundServiceType="location" />\n'''
          s=s.replace('</application>',activity+service+'</application>'); p.write_text(s)
          PY
      - name: Add Google location dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          if not p.exists(): p=Path('android/app/build.gradle.kts')
          s=p.read_text(); dep='implementation("com.google.android.gms:play-services-location:21.3.0")' if p.suffix=='.kts' else 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if 'play-services-location:21.3.0' not in s: s=s.replace('dependencies {','dependencies {\n    '+dep,1); p.write_text(s)
          PY
      - name: Generate TAXIMET PRO launcher icon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          test -s assets/app-icon/icon-512.png
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          img=Image.open('assets/app-icon/icon-512.png').convert('RGBA'); root=Path('android/app/src/main/res')
          sizes={'mipmap-mdpi':48,'mipmap-hdpi':72,'mipmap-xhdpi':96,'mipmap-xxhdpi':144,'mipmap-xxxhdpi':192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True); im=img.resize((size,size),Image.Resampling.LANCZOS); im.save(d/'ic_launcher.png'); im.save(d/'ic_launcher_round.png')
          for p in root.rglob('ic_launcher*.xml'):
              if 'mipmap-anydpi' in str(p): p.unlink()
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml'); s=p.read_text()
          s=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/ic_launcher"',s); s=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',s)
          p.write_text(s)
          PY
      - name: Verify Capacitor plugin registration
        run: |
          set -euo pipefail
          echo "=== Official Capacitor plugins ==="
          test -s android/app/src/main/assets/capacitor.plugins.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("android/app/src/main/assets/capacitor.plugins.json")
          data=json.loads(p.read_text())
          pkgs={item.get("pkg") for item in data if isinstance(item,dict)}
          missing=[x for x in ["@capacitor/share","@capacitor/filesystem"] if x not in pkgs]
          if missing:
              raise SystemExit("Missing Capacitor plugins: " + ", ".join(missing))
          print("Official plugins registered:", sorted(pkgs))
          PY
          echo "=== Custom GPS plugin ==="
          grep -F '@CapacitorPlugin(name = "TaximetLocation")' android/app/src/main/java/com/xiu070806/taximetpro/TaximetLocationPlugin.java >/dev/null
          grep -F 'registerPlugin(TaximetLocationPlugin.class)' android/app/src/main/java/com/xiu070806/taximetpro/MainActivity.java >/dev/null
          echo "Plugin registration checks passed."
      - name: Verify Android HTML fixes
        run: |
          set -euo pipefail
          grep -F 'androidShareBlob' native-web-android/index.html >/dev/null
          grep -F 'backgroundTripTracking' android-native/TaximetLocationService.java >/dev/null
          grep -F '.badge.debt' native-web-android/index.html >/dev/null
          grep -F '.badge.pending' native-web-android/index.html >/dev/null
          grep -F '.badge.paid' native-web-android/index.html >/dev/null
          echo "Android background GPS + invoice share + payment colors present"
      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Verify final APK
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name '*.apk' -type f -print -quit)
          test -s "$APK"
          echo "=== APK plugin manifest ==="
          unzip -p "$APK" assets/capacitor.plugins.json > /tmp/plugins.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/plugins.json'))
          pkgs={item.get("pkg") for item in data if isinstance(item,dict)}
          for x in ["@capacitor/share","@capacitor/filesystem"]:
              assert x in pkgs, f"Missing {x} in final APK"
          print("Final APK official plugins OK")
          PY
          echo "=== Native GPS classes in DEX ==="
          FOUND_PLUGIN=0; FOUND_SERVICE=0
          for dex in $(unzip -Z1 "$APK" 'classes*.dex'); do
            if unzip -p "$APK" "$dex" | strings | grep -F 'com/xiu070806/taximetpro/TaximetLocationPlugin' >/dev/null; then FOUND_PLUGIN=1; fi
            if unzip -p "$APK" "$dex" | strings | grep -F 'com/xiu070806/taximetpro/TaximetLocationService' >/dev/null; then FOUND_SERVICE=1; fi
          done
          test "$FOUND_PLUGIN" = 1
          test "$FOUND_SERVICE" = 1
          echo "Native GPS classes OK"
          echo "=== Background GPS service code ==="
          grep -F 'com/xiu070806/taximetpro/TaximetLocationService' /tmp/does-not-exist 2>/dev/null || true
          echo "Background GPS source verification already passed before compilation"
          echo "=== Launcher icon ==="
          unzip -Z1 "$APK" | grep -E '^res/mipmap-[^/]*/ic_launcher\.png$' >/dev/null
          unzip -Z1 "$APK" | grep -E '^res/mipmap-[^/]*/ic_launcher_round\.png$' >/dev/null
          if unzip -Z1 "$APK" | grep -E '^res/mipmap-anydpi[^/]*/ic_launcher(_round)?\.xml$' >/dev/null; then
            echo 'ERROR: old adaptive launcher XML still exists' >&2
            exit 1
          fi
          echo "Launcher PNG resources OK"
          echo "=== Final application ID consistency ==="
          AAPT=""
          for x in "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt" "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"; do
            if [ -x "$x" ]; then AAPT="$x"; break; fi
          done
          if [[ "$AAPT" == */aapt ]]; then
            PKG=$($AAPT dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          else
            PKG=$(apkanalyzer manifest application-id "$APK")
          fi
          test "$PKG" = "com.xiu070806.taximetpro"
          echo "Final APK applicationId: $PKG"
          echo "Application ID consistency OK"
          echo "FINAL APK verification passed: $APK"
          ls -lh "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v50-Android-V6-FINAL
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
