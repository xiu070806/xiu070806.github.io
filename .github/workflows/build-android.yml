          python3 - <<'PYCSS'
          from pathlib import Path
          import re

          p=Path("native-web-android/index.html")
          h=p.read_text(errors="replace")

          # Remove legacy narrow-phone media overrides without introducing
          # viewport breakpoints. The final UI remains one 390px reference
          # canvas scaled only from viewport width.
          def strip_legacy_narrow_media(css):
              pattern=re.compile(r'@media\s*\([^{}]*\)\s*\{', re.I)
              out=[]
              i=0
              while True:
                  m=pattern.search(css, i)
                  if not m:
                      out.append(css[i:])
                      break
                  a=m.start(); b=m.end()
                  out.append(css[i:a])
                  header=m.group(0)
                  depth=1; j=b
                  while j < len(css) and depth:
                      if css[j]=='{': depth+=1
                      elif css[j]=='}': depth-=1
                      j+=1
                  if not re.search(r'max-width\s*:\s*360px', header, re.I):
                      out.append(css[a:j])
                  i=j
              return ''.join(out)

          def replace_clamp(css):
              # Replace each clamp(min, preferred, max) with its preferred
              # argument, preserving nested functions in that argument.
              clamp_re=re.compile(r'clamp\s*\(', re.I)
              while True:
                  mm=clamp_re.search(css)
                  if not mm:
                      return css
                  start=mm.start()
                  op=css.find('(', start)
                  depth=1; j=op+1; commas=[]; quote=None
                  while j < len(css) and depth:
                      c=css[j]
                      if quote:
                          if c==quote and (j==0 or css[j-1] != '\\'):
                              quote=None
                      elif c in ('"', "'"):
                          quote=c
                      elif c=='(':
                          depth+=1
                      elif c==')':
                          depth-=1
                      elif c==',' and depth==1:
                          commas.append(j)
                      j+=1
                  if depth or len(commas)<2:
                      raise SystemExit('Unterminated or malformed CSS clamp()')
                  inner=css[op+1:commas[-1]]
                  first=inner.find(',')
                  if first < 0:
                      raise SystemExit('Malformed CSS clamp() arguments')
                  preferred=inner[first+1:].strip()
                  css=css[:start]+preferred+css[j:]

          def process_style(m):
              attrs, css=m.group(1), m.group(2)
              css=strip_legacy_narrow_media(css)
              css=replace_clamp(css)
              return '<style'+attrs+'>'+css+'</style>'

          h=re.sub(r'<style([^>]*)>(.*?)</style>', process_style, h, flags=re.S|re.I)
          p.write_text(h)
          print("Final CSS normalization OK: no legacy max-width:360px media and no CSS clamp()")
          PYCSS

