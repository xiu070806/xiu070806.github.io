name: Build CabCalc Android v50.15 Baseline
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Restore exact CabCalc v50.15 baseline sources
        run: |
          set -euo pipefail
          rm -rf android && mkdir -p android/cabcalc_android_v50_15
          python3 - <<'PY'
          import base64
          from pathlib import Path
          root=Path("android/cabcalc_android_v50_15")
          Path('.github/workflows/build-android.yml').parent.mkdir(parents=True,exist_ok=True)
          Path('.github/workflows/build-android.yml').write_bytes(base64.b64decode(''))
          Path('README_ANDROID_V50.15.md').parent.mkdir(parents=True,exist_ok=True)
          Path('README_ANDROID_V50.15.md').write_bytes(base64.b64decode(''))
          Path('README_ANDROID_V50.15_BASELINE.md').parent.mkdir(parents=True,exist_ok=True)
          Path('README_ANDROID_V50.15_BASELINE.md').write_bytes(base64.b64decode(''))
          Path('app/build.gradle').parent.mkdir(parents=True,exist_ok=True)
          Path('app/build.gradle').write_bytes(base64.b64decode(''))
          Path('app/proguard-rules.pro').parent.mkdir(parents=True,exist_ok=True)
          Path('app/proguard-rules.pro').write_bytes(base64.b64decode('IyBDYWJDYWxjIHY1MC4xNSDigJQgbm8gY3VzdG9tIHNocmlua2luZyBydWxlcyByZXF1aXJlZCBmb3IgZGVidWcvcmVsZWFzZSBiYXNlbGluZS4K'))
          Path('app/src/main/AndroidManifest.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/AndroidManifest.xml').write_bytes(base64.b64decode(''))
          Path('app/src/main/assets/public/index.html').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/assets/public/index.html').write_bytes(base64.b64decode(''))
          Path('app/src/main/java/com/cabcalc/app/MainActivity.java').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/java/com/cabcalc/app/MainActivity.java').write_bytes(base64.b64decode(''))
          Path('app/src/main/java/com/cabcalc/app/TaximetLocationPlugin.java').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/java/com/cabcalc/app/TaximetLocationPlugin.java').write_bytes(base64.b64decode(''))
          Path('app/src/main/java/com/cabcalc/app/TaximetLocationService.java').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/java/com/cabcalc/app/TaximetLocationService.java').write_bytes(base64.b64decode(''))
          Path('app/src/main/res/drawable/ic_notification.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/drawable/ic_notification.xml').write_bytes(base64.b64decode(''))
          Path('app/src/main/res/values/colors.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values/colors.xml').write_bytes(base64.b64decode('PHJlc291cmNlcz48Y29sb3IgbmFtZT0iY2FiY2FsY19ncmVlbiI+IzIwRDM5QTwvY29sb3I+PC9yZXNvdXJjZXM+Cg=='))
          Path('app/src/main/res/values/strings.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values/strings.xml').write_bytes(base64.b64decode(''))
          Path('app/src/main/res/values/styles.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values/styles.xml').write_bytes(base64.b64decode(''))
          Path('app/src/main/res/xml/file_paths.xml').parent.mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/xml/file_paths.xml').write_bytes(base64.b64decode('PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPHBhdGhzIHhtbG5zOmFuZHJvaWQ9Imh0dHA6Ly9zY2hlbWFzLmFuZHJvaWQuY29tL2Fway9yZXMvYW5kcm9pZCI+CiAgICA8Y2FjaGUtcGF0aCBuYW1lPSJzaGFyZWQiIHBhdGg9InNoYXJlZC8iIC8+CjwvcGF0aHM+Cg=='))
          Path('build.gradle').parent.mkdir(parents=True,exist_ok=True)
          Path('build.gradle').write_bytes(base64.b64decode('cGx1Z2lucyB7CiAgICBpZCAnY29tLmFuZHJvaWQuYXBwbGljYXRpb24nIHZlcnNpb24gJzguNy4zJyBhcHBseSBmYWxzZQogICAgaWQgJ29yZy5qZXRicmFpbnMua290bGluLmFuZHJvaWQnIHZlcnNpb24gJzIuMS4wJyBhcHBseSBmYWxzZQp9Cg=='))
          Path('gradle.properties').parent.mkdir(parents=True,exist_ok=True)
          Path('gradle.properties').write_bytes(base64.b64decode('b3JnLmdyYWRsZS5qdm1hcmdzPS1YbXgyZyAtRGZpbGUuZW5jb2Rpbmc9VVRGLTgKYW5kcm9pZC51c2VBbmRyb2lkWD10cnVlCmFuZHJvaWQubm9uVHJhbnNpdGl2ZVJDbGFzcz10cnVlCmtvdGxpbi5jb2RlLnN0eWxlPW9mZmljaWFsCg=='))
          Path('settings.gradle').parent.mkdir(parents=True,exist_ok=True)
          Path('settings.gradle').write_bytes(base64.b64decode(''))
          Path('verify_baseline.py').parent.mkdir(parents=True,exist_ok=True)
          Path('verify_baseline.py').write_bytes(base64.b64decode(''))
          Path('verify_v50_15.py').parent.mkdir(parents=True,exist_ok=True)
          Path('verify_v50_15.py').write_bytes(base64.b64decode(''))
          PY
      - name: Verify baseline before build
        run: |
          set -euo pipefail
          cd android/cabcalc_android_v50_15
          python3 verify_baseline.py
      - name: Prepare Capacitor Android dependencies
        run: |
          set -euo pipefail
          cd android/cabcalc_android_v50_15
          npm init -y >/dev/null 2>&1 || true
          npx --yes cap@7.4.0 add android --no-interactive
      - name: Overlay exact native Android GPS + UI baseline
        run: |
          set -euo pipefail
          cd android/cabcalc_android_v50_15
          cp -R app/src/main/assets/public android/app/src/main/assets/
          cp -R app/src/main/java/com/cabcalc/app android/app/src/main/java/com/cabcalc/
          cp -R app/src/main/res/* android/app/src/main/res/ || true
      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android/cabcalc_android_v50_15/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Verify APK
        run: |
          set -euo pipefail
          APK=$(find android/cabcalc_android_v50_15/android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          test -s "$APK"
          echo "APK: $APK"
          sha256sum "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.15-Android-Baseline-GPS-UI
          path: android/cabcalc_android_v50_15/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
