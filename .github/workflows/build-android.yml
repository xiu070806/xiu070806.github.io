name: TAXIMET PRO Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # UI-only update:
      # Replace the WebView public/index.html while keeping the existing
      # native Android GPS engine / bridge unchanged.
      - name: Install web assets
        shell: bash
        run: |
          set -e
          mkdir -p android/app/src/main/assets/public
          cp -f public/index.html android/app/src/main/assets/public/index.html

          if [ -d public/vendor ]; then
            rm -rf android/app/src/main/assets/public/vendor
            cp -R public/vendor android/app/src/main/assets/public/vendor
          fi

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build unsigned release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p build-output
          find android/app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} build-output/TAXIMET_PRO_ANDROID_GPS_UI_RELEASE.apk \;

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-Android-GPS-UI
          path: build-output/TAXIMET_PRO_ANDROID_GPS_UI_RELEASE.apk
          if-no-files-found: error
