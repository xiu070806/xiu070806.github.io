name: Build CabCalc Android V50.14 - iOS Feature Parity + GPS FIX5
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare required native resources
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          XML
          test -s android-native/file_paths.xml
          echo "Required FileProvider resource: OK"
      - name: Verify sources (no fragile grep)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          checks={
            "android-native/MainActivity.java":["addJavascriptInterface","registerPlugin(TaximetLocationPlugin.class)"],
            "android-native/TaximetLocationPlugin.java":["setTripActive","getTripStats","shareFile","@CapacitorPlugin(name = \"TaximetLocation\")"],
            "android-native/TaximetLocationService.java":["tripActive","tripDistanceM","updateTripDistance","requestLocationUpdates","START_STICKY","HandlerThread","getLooper","saveTripAnchor","long dt=ts-ts0","MAX_TRIP_GAP_MS","MAX_TRIP_SPEED_MPS"],
            "android-native/TaximetNativeShare.java":["class TaximetNativeShare","shareBase64","FileProvider","ACTION_SEND"],
            "android-native/file_paths.xml":["<paths","cache-path"],
            "native-web-android/index.html":["androidShareBlob","TaximetNativeShare","exportInvoicePNG","exportInvoicePDF",'nativeTripCall("startTrip"','nativeTripCall("resumeTrip",{})','nativeTripCall("pauseTrip",{})','nativeTripCall("finishTrip",{})'],
          }
          errors=[]
          for fn,tokens in checks.items():
              s=Path(fn).read_text(errors="replace")
              for t in tokens:
                  if t not in s: errors.append(f"{fn}: missing token: {t}")
          # CabCalc iOS-parity checks
          h=Path("native-web-android/index.html").read_text()
          required=["CabCalc","Smart Ride, Smart Fare","paymentStateForTrip","paymentStateLabel","paymentStateClass","paymentStateColor","Tìm thấy chuyến chưa hoàn tất","TIẾP TỤC CHUYẾN","HÓA ĐƠN DỊCH VỤ","brand-calc","gps-ok .brand-calc","gps-bad .brand-calc"]
          for t in required:
              if t not in h: errors.append(f"native-web-android/index.html: missing parity token: {t}")
          if "for EVcar" in h: errors.append("legacy branding: for EVcar still present")
          if "TAXIMET PRO" in h: errors.append("legacy visible branding still present")
          # Check only human-visible legacy branding. Technical package/class/storage identifiers
          # such as TaximetLocationService and com.xiu070806.taximetpro are intentionally preserved
          # for Android compatibility and are NOT UI branding.
          visible_legacy=["TAXIMET PRO","Taximet Pro","for EVcar"]
          for fn in ["android-native/TaximetLocationService.java","android-native/TaximetNativeShare.java","android-native/MainActivity.java"]:
              ns=Path(fn).read_text(errors="replace")
              for legacy in visible_legacy:
                  if legacy in ns: errors.append(f"{fn}: legacy visible branding still present: {legacy}")
          # Android bridge must expose all trip lifecycle operations used by iOS UI.
          ah=Path("android-native/TaximetLocationPlugin.java").read_text()
          for t in ["setTripActive","getTripStats","shareFile"]:
              if t not in ah: errors.append(f"android-native/TaximetLocationPlugin.java: missing {t}")
          sh=Path("android-native/TaximetLocationService.java").read_text()
          for t in ["MAX_TRIP_GAP_MS","MIN_CONFIDENT_SPEED_MPS","tripSmallMoveM","Collections.sort","START_STICKY"]:
              if t not in sh: errors.append(f"android-native/TaximetLocationService.java: missing GPS FIX5 marker {t}")
          if errors:
              print("SOURCE VERIFICATION FAILED")
              print("\n".join("- "+e for e in errors))
              raise SystemExit(1)
          # Guard the two critical trip-state invariants.
          h=Path("native-web-android/index.html").read_text()
          if "resumeTrip" in h and 'nativeTripCall("resumeTrip",{})' not in h:
              raise SystemExit("Resume must re-enable native trip tracking without reset")
          if "startTrip" in h and 'nativeTripCall("startTrip"' not in h:
              raise SystemExit("Start must explicitly reset the native trip accumulator")
          if "active.pendingFinishTotal=b.total;" in h:
              a=h.index("active.pendingFinishTotal=b.total;")
              b=h.index("await reverseGeocode",a)
              if 'nativeTripCall("finishTrip",{})' not in h[a:b]:
                  raise SystemExit("Finish must freeze native distance before geocoding")
          print("Source verification OK: iOS feature parity + single native distance engine + pause/resume preservation + payment freeze + native share")
          PY
      - name: Install Capacitor dependencies
        run: |
          set -euo pipefail
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8
      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www android
          mkdir -p www
          cp native-web-android/index.html www/index.html
      - name: Normalize Capacitor config
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("capacitor.config.json")
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({"appId":"com.xiu070806.taximetpro","appName":"CabCalc","webDir":"www","bundledWebRuntime":False})
          p.write_text(json.dumps(d,indent=2)+"\n")
          PY
      - name: Create Android project
        run: |
          set -euo pipefail
          npx cap add android
          npx cap sync android
      - name: Force Android ID
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          for p in [Path("android/app/build.gradle"),Path("android/app/build.gradle.kts")]:
              if not p.exists(): continue
              s=p.read_text()
              if p.suffix==".kts":
                  s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s*=\s*"[^"]+"','namespace = "com.xiu070806.taximetpro"',s)
              else:
                  s=re.sub(r'applicationId\s+"[^"]+"','applicationId "com.xiu070806.taximetpro"',s)
                  s=re.sub(r'namespace\s+"[^"]+"','namespace "com.xiu070806.taximetpro"',s)
              p.write_text(s)
          PY
      - name: Install native sources
        run: |
          set -euo pipefail
          P=android/app/src/main/java/com/xiu070806/taximetpro
          mkdir -p "$P"
          cp android-native/*.java "$P/"
          mkdir -p android/app/src/main/res/xml
          cp android-native/file_paths.xml android/app/src/main/res/xml/taximet_file_paths.xml
      - name: Configure Android manifest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          perms=["ACCESS_COARSE_LOCATION","ACCESS_FINE_LOCATION","ACCESS_BACKGROUND_LOCATION","FOREGROUND_SERVICE","FOREGROUND_SERVICE_LOCATION","POST_NOTIFICATIONS"]
          for x in perms: s=re.sub(r"\s*<uses-permission android:name=\"android.permission."+x+r"\"\s*/>","",s)
          pos=s.find(">",s.find("<manifest"))+1
          s=s[:pos]+"\n"+"".join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in perms)+s[pos:]
          s=re.sub(r'<activity[^>]*android:name="[^"]*MainActivity"[^>]*>.*?</activity>',"",s,flags=re.S)
          activity="""
          <activity android:name="com.xiu070806.taximetpro.MainActivity" android:exported="true" android:launchMode="singleTask" android:theme="@style/AppTheme">
              <intent-filter><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent-filter>
          </activity>
          """
          service="""<service android:name="com.xiu070806.taximetpro.TaximetLocationService" android:exported="false" android:foregroundServiceType="location" />"""
          provider="""<provider android:name="androidx.core.content.FileProvider" android:authorities="com.xiu070806.taximetpro.fileprovider" android:exported="false" android:grantUriPermissions="true"><meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/taximet_file_paths" /></provider>"""
          s=s.replace("</application>",activity+service+provider+"\n</application>")
          p.write_text(s)
          PY
      - name: Add Google location dependency
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle") if Path("android/app/build.gradle").exists() else Path("android/app/build.gradle.kts")
          s=p.read_text()
          dep='implementation("com.google.android.gms:play-services-location:21.3.0")' if p.suffix==".kts" else 'implementation "com.google.android.gms:play-services-location:21.3.0"'
          if "play-services-location:21.3.0" not in s: s=s.replace("dependencies {","dependencies {\n    "+dep,1)
          p.write_text(s)
          PY
      - name: Generate launcher icon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          img=Image.open("assets/app-icon/icon-512.png").convert("RGBA"); assert Path("assets/app-icon/icon-1024.png").exists(); root=Path("android/app/src/main/res")
          sizes={"mipmap-mdpi":48,"mipmap-hdpi":72,"mipmap-xhdpi":96,"mipmap-xxhdpi":144,"mipmap-xxxhdpi":192}
          for folder,size in sizes.items():
              d=root/folder; d.mkdir(parents=True,exist_ok=True); im=img.resize((size,size),Image.Resampling.LANCZOS); im.save(d/"ic_launcher.png"); im.save(d/"ic_launcher_round.png")
          for p in root.rglob("ic_launcher*.xml"):
              if "mipmap-anydpi" in str(p): p.unlink()
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          s=re.sub(r'android:icon="[^"]+"','android:icon="@mipmap/ic_launcher"',s); s=re.sub(r'android:roundIcon="[^"]+"','android:roundIcon="@mipmap/ic_launcher_round"',s)
          p.write_text(s)
          PY
      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon
      - name: Verify final APK (critical only)
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)
          test -s "$APK"
          echo "APK: $APK"
          unzip -p "$APK" assets/capacitor.plugins.json > /tmp/plugins.json
          python3 - <<'PY'
          import json
          d=json.load(open("/tmp/plugins.json")); pkgs={x.get("pkg") for x in d if isinstance(x,dict)}
          for x in ["@capacitor/share","@capacitor/filesystem"]:
              assert x in pkgs, f"Missing plugin: {x}"
          print("Capacitor Share/Filesystem: OK")
          PY
          unzip -l "$APK" | grep -F "res/xml/taximet_file_paths.xml" >/dev/null
          echo "FileProvider/share resources: OK"
          FOUND_TRIP=0; FOUND_SHARE=0; FOUND_SERVICE=0
          for dex in $(unzip -Z1 "$APK" "classes*.dex"); do
              b=$(unzip -p "$APK" "$dex" | strings)
              echo "$b" | grep -F "com/xiu070806/taximetpro/TaximetLocationService" >/dev/null && FOUND_SERVICE=1 || true
              echo "$b" | grep -F "tripDistanceM" >/dev/null && FOUND_TRIP=1 || true
              echo "$b" | grep -F "TaximetNativeShare" >/dev/null && FOUND_SHARE=1 || true
          done
          test "$FOUND_SERVICE" = 1
          test "$FOUND_TRIP" = 1
          test "$FOUND_SHARE" = 1
          echo "Native GPS distance engine + native share bridge: OK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.14-Android-IOS-PARITY-GPS-FIX5
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
