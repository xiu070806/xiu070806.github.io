name: CabCalc Android — cabcalc(2) UI baseline + GPS distance/speed fix
true:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Prepare required native resources
      run: "set -euo pipefail\nmkdir -p android-native\ncat > android-native/file_paths.xml <<'XML'\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<paths xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <cache-path name=\"cache\" path=\".\" />\n</paths>\nXML\ntest -s android-native/file_paths.xml\necho \"Required FileProvider resource: OK\"\n"
    - name: Normalize native Java imports (self-healing preflight)
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\np=Path(\"android-native/TaximetLocationPlugin.java\")\ns=p.read_text(errors=\"replace\")\nif \"getActivity()\" in s and \"import android.app.Activity;\" not in s:\n    lines=s.splitlines()\n    pkg=next((i for i,x in enumerate(lines) if x.startswith(\"package \")),0)\n    lines.insert(pkg+1,\"import android.app.Activity;\")\n    p.write_text(\"\\n\".join(lines)+\"\\n\")\n    print(\"Inserted missing android.app.Activity import\")\n# Hard assertions for native source used by the build.\ns=p.read_text(errors=\"replace\")\nassert \"import android.app.Activity;\" in s if \"getActivity()\" in s else True\nassert \"@CapacitorPlugin(name = \\\"TaximetLocation\\\")\" in s\nprint(\"Native Java import preflight OK\")\nPY\n"
    - name: Install exact V2 native sources
      run: 'set -euo pipefail

        python3 - <<''PY''

        import base64

        from pathlib import Path

        Path("android-native/TaximetLocationService.java").write_bytes(base64.b64decode(""))

        Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))

        Path("native-web-android/index.html").write_bytes(base64.b64decode(""))

        PY

        echo "Distance Engine V2 sources installed"

        '
    - name: Apply cabcalc(2) UI baseline + GPS distance/speed fix
      run: "set -euo pipefail\npython3 - <<'PY'\nimport base64\nfrom pathlib import Path\nfiles={\n  \"android-native/TaximetLocationService.java\":\"\",\n  \"android-native/TaximetLocationPlugin.java\":\"\",\n  \"native-web-android/index.html\":\"\"\
        \n}\nfor fn,b64 in files.items():\n    Path(fn).write_bytes(base64.b64decode(b64))\n    print(\"Installed\",fn,Path(fn).stat().st_size,\"bytes\")\nPY"
    - name: Verify cabcalc(2) UI baseline + GPS patch (deterministic)
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport hashlib,re\nerrors=[]\nsvc=Path(\"android-native/TaximetLocationService.java\").read_text(errors=\"replace\")\nplg=Path(\"android-native/TaximetLocationPlugin.java\").read_text(errors=\"replace\")\nh=Path(\"native-web-android/index.html\").read_text(errors=\"replace\")\nskel=re.sub(r'<script(?:\\s[^>]*)?>.*?</script>', '<script></script>', h, flags=re.S|re.I)\nif hashlib.sha256(skel.encode()).hexdigest() != \"b17ba18e60df29e1091bb4d3b6f633c7074042b22ed16c804565408cce049198\": errors.append(\"UI baseline changed outside script blocks\")\nfor t in [\"resolveMovementAndSpeed\",\"SPEED_MAX_FIX_AGE_MS\",\"MIN_MOVING_SPEED_FIXES\",\"SPEED_MOVING_DERIVED_MPS\",\"KEY_SPEED_DISPLAY_MPS\",\"updateTripDistance(android.location.Location l, boolean movementConfirmed)\",\"if(!movementConfirmed)\"]:\n    if t not in svc: errors.append(\"service missing \"+t)\nfor t in [\"startTrip\",\"pauseTrip\",\"resumeTrip\",\"finishTrip\",\"speedKmh\",\"movementConfirmed\",\"gpsFixFresh\",\"distanceM\"]:\n    if t not in plg: errors.append(\"plugin missing \"+t)\nif \"reportedSpeed>=CONFIDENT_SPEED_MPS ||\" in svc: errors.append(\"raw speed bypass remains in distance engine\")\nif \"Math.max(avg,reportedSpeed\" in svc: errors.append(\"raw speed still dominates small-distance evidence\")\nif \"navigator.geolocation\" in h or \"watchPosition\" in h or \"getCurrentPosition\" in h: errors.append(\"browser GPS API present\")\nfor t in [\"hasMovementContract\",\"geo.movementConfirmed\",\"geo.gpsFixFresh\",\"geo.distanceM\",\"data.speedKmh\"]:\n    if t not in h: errors.append(\"HTML missing \"+t)\nif svc.count(\"{\") != svc.count(\"}\") if False else False: pass\nif svc.count(\")!=svc.count(\"): errors.append(\"service braces invalid\")\nif plg.count(\")!=plg.count(\"): errors.append(\"plugin braces invalid\")\nif errors:\n    print(\"GPS/UI verification FAILED\")\n    print(\"\\n\".join(\"- \"+e for e in errors))\n    raise SystemExit(1)\nprint(\"CabCalc(2) UI baseline preserved; GPS speed/distance patch verification: PASS\")\nprint(\"UI skeleton SHA256:\", hashlib.sha256(skel.encode()).hexdigest())\nPY"
    - name: Install Capacitor dependencies
      run: 'set -euo pipefail

        npm install

        npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/android@7.4.0 @capacitor/share@7.0.2 @capacitor/filesystem@7.1.8

        '
    - name: Install local invoice engines
      run: 'set -euo pipefail

        npm install --save-exact html2canvas@1.4.1 jspdf@2.5.1

        test -s node_modules/html2canvas/dist/html2canvas.min.js

        test -s node_modules/jspdf/dist/jspdf.umd.min.js

        '
    - name: Prepare web assets
      run: 'set -euo pipefail

        rm -rf www android

        mkdir -p www/vendor

        cp native-web-android/index.html www/index.html

        cp node_modules/html2canvas/dist/html2canvas.min.js www/vendor/html2canvas.min.js

        cp node_modules/jspdf/dist/jspdf.umd.min.js www/vendor/jspdf.umd.min.js

        test -s www/vendor/html2canvas.min.js

        test -s www/vendor/jspdf.umd.min.js

        '
    - name: Normalize Capacitor config
      run: 'set -euo pipefail

        python3 - <<''PY''

        import json

        from pathlib import Path

        p=Path("capacitor.config.json")

        d=json.loads(p.read_text()) if p.exists() else {}

        d.update({"appId":"com.xiu070806.taximetpro","appName":"CabCalc","webDir":"www","bundledWebRuntime":False})

        p.write_text(json.dumps(d,indent=2)+"\n")

        PY

        '
    - name: Create Android project
      run: 'set -euo pipefail

        npx cap add android

        npx cap sync android

        '
    - name: Force Android ID
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\nfor p in [Path(\"android/app/build.gradle\"),Path(\"android/app/build.gradle.kts\")]:\n    if not p.exists(): continue\n    s=p.read_text()\n    if p.suffix==\".kts\":\n        s=re.sub(r'applicationId\\s*=\\s*\"[^\"]+\"','applicationId = \"com.xiu070806.taximetpro\"',s)\n        s=re.sub(r'namespace\\s*=\\s*\"[^\"]+\"','namespace = \"com.xiu070806.taximetpro\"',s)\n    else:\n        s=re.sub(r'applicationId\\s+\"[^\"]+\"','applicationId \"com.xiu070806.taximetpro\"',s)\n        s=re.sub(r'namespace\\s+\"[^\"]+\"','namespace \"com.xiu070806.taximetpro\"',s)\n    p.write_text(s)\nPY\n"
    - name: Install native sources
      run: 'set -euo pipefail

        P=android/app/src/main/java/com/xiu070806/taximetpro

        mkdir -p "$P"

        cp android-native/*.java "$P/"

        mkdir -p android/app/src/main/res/xml

        cp android-native/file_paths.xml android/app/src/main/res/xml/taximet_file_paths.xml

        '
    - name: Configure Android manifest
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\np=Path(\"android/app/src/main/AndroidManifest.xml\"); s=p.read_text()\nperms=[\"ACCESS_COARSE_LOCATION\",\"ACCESS_FINE_LOCATION\",\"ACCESS_BACKGROUND_LOCATION\",\"FOREGROUND_SERVICE\",\"FOREGROUND_SERVICE_LOCATION\",\"POST_NOTIFICATIONS\"]\nfor x in perms: s=re.sub(r\"\\s*<uses-permission android:name=\\\"android.permission.\"+x+r\"\\\"\\s*/>\",\"\",s)\npos=s.find(\">\",s.find(\"<manifest\"))+1\ns=s[:pos]+\"\\n\"+\"\".join(f'    <uses-permission android:name=\"android.permission.{x}\" />\\n' for x in perms)+s[pos:]\ns=re.sub(r'<activity[^>]*android:name=\"[^\"]*MainActivity\"[^>]*>.*?</activity>',\"\",s,flags=re.S)\nactivity=\"\"\"\n<activity android:name=\"com.xiu070806.taximetpro.MainActivity\" android:exported=\"true\" android:launchMode=\"singleTask\" android:theme=\"@style/AppTheme\">\n    <intent-filter><action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.category.LAUNCHER\" /></intent-filter>\n</activity>\n\"\"\"\nservice=\"\"\"<service android:name=\"com.xiu070806.taximetpro.TaximetLocationService\" android:exported=\"false\" android:foregroundServiceType=\"location\" android:stopWithTask=\"false\" />\"\"\"\nprovider=\"\"\"<provider android:name=\"androidx.core.content.FileProvider\" android:authorities=\"com.xiu070806.taximetpro.fileprovider\" android:exported=\"false\" android:grantUriPermissions=\"true\"><meta-data android:name=\"android.support.FILE_PROVIDER_PATHS\" android:resource=\"@xml/taximet_file_paths\" /></provider>\"\"\"\ns=s.replace(\"</application>\",activity+service+provider+\"\\n</application>\")\np.write_text(s)\nPY\n"
    - name: Add Google location dependency
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        p=Path("android/app/build.gradle") if Path("android/app/build.gradle").exists() else Path("android/app/build.gradle.kts")

        s=p.read_text()

        dep=''implementation("com.google.android.gms:play-services-location:21.3.0")'' if p.suffix==".kts" else ''implementation "com.google.android.gms:play-services-location:21.3.0"''

        if "play-services-location:21.3.0" not in s: s=s.replace("dependencies {","dependencies {\n    "+dep,1)

        p.write_text(s)

        PY

        '
    - name: Generate launcher icon
      run: "set -euo pipefail\npython3 -m pip install --disable-pip-version-check Pillow\npython3 - <<'PY'\nfrom PIL import Image\nfrom pathlib import Path\nimg=Image.open(\"assets/app-icon/icon-512.png\").convert(\"RGBA\"); assert Path(\"assets/app-icon/icon-1024.png\").exists(); root=Path(\"android/app/src/main/res\")\nsizes={\"mipmap-mdpi\":48,\"mipmap-hdpi\":72,\"mipmap-xhdpi\":96,\"mipmap-xxhdpi\":144,\"mipmap-xxxhdpi\":192}\nfor folder,size in sizes.items():\n    d=root/folder; d.mkdir(parents=True,exist_ok=True); im=img.resize((size,size),Image.Resampling.LANCZOS); im.save(d/\"ic_launcher.png\"); im.save(d/\"ic_launcher_round.png\")\nfor p in root.rglob(\"ic_launcher*.xml\"):\n    if \"mipmap-anydpi\" in str(p): p.unlink()\nPY\npython3 - <<'PY'\nfrom pathlib import Path\nimport re\np=Path(\"android/app/src/main/AndroidManifest.xml\"); s=p.read_text()\ns=re.sub(r'android:icon=\"[^\"]+\"','android:icon=\"@mipmap/ic_launcher\"',s); s=re.sub(r'android:roundIcon=\"[^\"]+\"','android:roundIcon=\"@mipmap/ic_launcher_round\"',s)\np.write_text(s)\nPY\n"
    - name: Verify Distance Engine V2 invariants
      run: 'set -euo pipefail

        python3 - <<''PY''

        from pathlib import Path

        s=Path("android-native/TaximetLocationService.java").read_text(errors="replace")

        p=Path("android-native/TaximetLocationPlugin.java").read_text(errors="replace")

        required=["KEY_TRIP_DISTANCE_BITS","KEY_NEEDS_ANCHOR","MAX_TRIP_ACCURACY_M","MIN_TRIP_DIRECT_M","MIN_SMALL_AVG_SPEED_MPS","hasFineLocationPermission","tripNeedsAnchor","resolveMovementAndSpeed","movementConfirmed"]

        missing=[x for x in required if x not in s+p]

        if missing: raise SystemExit("Missing GPS/distance invariant(s): "+repr(missing))

        if "tripDistanceBits" not in p: raise SystemExit("Plugin missing double-distance bridge")

        if "if(!movementConfirmed)" not in s: raise SystemExit("Distance engine is not gated by movement confirmation")

        print("Distance + speed unified invariants: PASS")

        PY'
    - name: Build debug APK
      run: 'set -euo pipefail

        cd android

        chmod +x gradlew

        ./gradlew clean assembleDebug --no-daemon

        '
    - name: Verify final APK (deterministic)
      run: "set -euo pipefail\npython3 - <<'PY'\nfrom pathlib import Path\nimport zipfile, re\napks=list(Path(\"android/app/build/outputs/apk/debug\").glob(\"*.apk\"))\nif not apks: raise SystemExit(\"No debug APK produced\")\napk=apks[0]\nif apk.stat().st_size<=0: raise SystemExit(\"APK is empty\")\nwith zipfile.ZipFile(apk) as z:\n  names=set(z.namelist())\n  for n in [\"assets/capacitor.plugins.json\",\"res/xml/taximet_file_paths.xml\"]:\n    if not any(x==n or x.endswith(\"/\"+n) for x in names): raise SystemExit(f\"Missing APK resource: {n}\")\n  dex=b\"\".join(z.read(n) for n in names if re.fullmatch(r\"classes(?:\\d+)?\\.dex\",n))\n  for token in [b\"TaximetLocationService\",b\"tripDistanceM\",b\"TaximetNativeShare\",b\"shareBase64\"]:\n    if token not in dex: raise SystemExit(f\"Missing native marker: {token.decode()}\")\n  plugins=z.read(\"assets/capacitor.plugins.json\").decode(\"utf-8\",\"replace\")\n  for token in [\"@capacitor/share\",\"@capacitor/filesystem\"]:\n    if token not in plugins: raise SystemExit(f\"Missing plugin: {token}\")\nprint(f\"APK verification OK: {apk} ({apk.stat().st_size} bytes)\")\nPY\n"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CabCalc-v50.14-Android-IOS-PARITY-GPS-FIX9
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
