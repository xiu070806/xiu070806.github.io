name: CabCalc Android V50.14 - FIX9.1 FINAL GPS + UI + Invoice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare required native resources
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
          </paths>
          XML
          test -s android-native/file_paths.xml
          echo "Required FileProvider resource: OK"
      - name: Write canonical native invoice share bridge
        run: |
          set -euo pipefail
          mkdir -p android-native
          cat > android-native/TaximetNativeShare.java <<'JAVA'
          package com.xiu070806.taximetpro;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.Intent;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.util.Base64;
          import androidx.core.content.FileProvider;
          import androidx.annotation.Keep;
          import java.io.File;
          import java.io.FileOutputStream;

          @Keep
          public final class TaximetNativeShare {
              private final Activity activity;
              private final WebView webView;
              private FileOutputStream pendingOut;
              private File pendingFile;
              private String pendingMime;
              private String pendingTitle;
              private String pendingText;

              public TaximetNativeShare(Activity activity, WebView webView) { this.activity = activity; this.webView = webView; }

              @JavascriptInterface
              public synchronized String beginShareBase64(String fileName, String mime, String title, String text) {
                  try {
                      cancelPending();
                      File dir = new File(activity.getCacheDir(), "taximet-share");
                      if (!dir.exists() && !dir.mkdirs()) throw new IllegalStateException("Không tạo được thư mục chia sẻ");
                      String safe = (fileName == null ? "cabcalc-invoice" : fileName).replaceAll("[^a-zA-Z0-9._-]", "_");
                      pendingFile = new File(dir, safe);
                      pendingOut = new FileOutputStream(pendingFile, false);
                      pendingMime = (mime == null || mime.isEmpty()) ? "application/octet-stream" : mime;
                      pendingTitle = title == null ? "CabCalc" : title;
                      pendingText = text == null ? "Hóa đơn CabCalc" : text;
                      return "SHARE_READY";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String appendShareBase64(String base64) {
                  try {
                      if (pendingOut == null) throw new IllegalStateException("Chưa khởi tạo tệp chia sẻ");
                      if (base64 == null || base64.isEmpty()) return "CHUNK_OK";
                      pendingOut.write(Base64.decode(base64, Base64.DEFAULT));
                      return "CHUNK_OK";
                  } catch (Exception e) { return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized String finishShareBase64() {
                  try {
                      if (pendingOut == null || pendingFile == null) throw new IllegalStateException("Tệp chia sẻ chưa hoàn tất");
                      pendingOut.flush(); pendingOut.close(); pendingOut = null;
                      File file = pendingFile;
                      String mime = pendingMime, title = pendingTitle, text = pendingText;
                      pendingFile = null; pendingMime = pendingTitle = pendingText = null;
                      final Uri uri = FileProvider.getUriForFile(activity, activity.getPackageName() + ".fileprovider", file);
                      activity.runOnUiThread(() -> openShare(uri, mime, title, text));
                      return "SHARE_STARTED";
                  } catch (Exception e) { cancelPending(); return "ERROR:" + e.getClass().getSimpleName() + ":" + String.valueOf(e.getMessage()); }
              }

              @JavascriptInterface
              public synchronized void cancelShareBase64() { cancelPending(); }

              @JavascriptInterface
              public synchronized String shareBase64(final String base64, final String fileName, final String mime,
                                      final String title, final String text) {
                  try {
                      String r=beginShareBase64(fileName,mime,title,text); if (r.startsWith("ERROR:")) return r;
                      r=appendShareBase64(base64); if (r.startsWith("ERROR:")) { cancelPending(); return r; }
                      return finishShareBase64();
                  } catch(Exception e) { cancelPending(); return "ERROR:"+e.getClass().getSimpleName()+":"+String.valueOf(e.getMessage()); }
              }

              private void openShare(final Uri uri, final String mime, final String title, final String text) {
                  try {
                      Intent send = new Intent(Intent.ACTION_SEND);
                      send.setType(mime);
                      send.putExtra(Intent.EXTRA_STREAM, uri);
                      send.putExtra(Intent.EXTRA_TEXT, text);
                      send.putExtra(Intent.EXTRA_TITLE, title);
                      send.setClipData(ClipData.newRawUri("CabCalc", uri));
                      send.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      Intent chooser = Intent.createChooser(send, "Chia sẻ hóa đơn CabCalc");
                      chooser.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      activity.startActivity(chooser);
                  } catch (Exception e) {
                      android.util.Log.e("CabCalcShare", "Unable to open Android share sheet", e);
                      if (webView != null) {
                          String msg = e.getClass().getSimpleName() + ": " + String.valueOf(e.getMessage());
                          final String js = "window.dispatchEvent(new CustomEvent('taximetNativeShareError',{detail:" + org.json.JSONObject.quote(msg) + "}));";
                          webView.post(() -> webView.evaluateJavascript(js, null));
                      }
                  }
              }

              private synchronized void cancelPending() {
                  try { if (pendingOut != null) pendingOut.close(); } catch (Exception ignored) {}
                  pendingOut = null; pendingFile = null; pendingMime = pendingTitle = pendingText = null;
              }
          }
          JAVA
          test -s android-native/TaximetNativeShare.java
      - name: Normalize native Java imports (self-healing preflight)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android-native/TaximetLocationPlugin.java")
          s=p.read_text(errors="replace")
          if "getActivity()" in s and "import android.app.Activity;" not in s:
              lines=s.splitlines()
              pkg=next((i for i,x in enumerate(lines) if x.startswith("package ")),0)
              lines.insert(pkg+1,"import android.app.Activity;")
              p.write_text("\n".join(lines)+"\n")
              print("Inserted missing android.app.Activity import")
          # Hard assertions for native source used by the build.
          s=p.read_text(errors="replace")
          assert "import android.app.Activity;" in s if "getActivity()" in s else True
          assert "@CapacitorPlugin(name = \"TaximetLocation\")" in s
          print("Native Java import preflight OK")
          PY
      - name: Install canonical Android GPS distance engine sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationService.java").write_bytes(base64.b64decode(""))
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          PY
          echo "Canonical Android GPS distance engine sources installed"

      - name: Install canonical Android GPS bridge and Activity
        run: |
          set -euo pipefail
          python3 - <<'PY3'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          Path("android-native/MainActivity.java").write_bytes(base64.b64decode(""))
          print("Canonical Android GPS bridge + Activity installed")
          PY3

      - name: Fix main trip action buttons layout (no overlay)
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          from pathlib import Path
          import re
          p=Path("native-web-android/index.html")
          h=p.read_text(errors="replace")
          # Remove any previous action-flow styles so this fix is deterministic.
          h=re.sub(r'<style id="cabcalc-trip-actions-flow-v1">.*?</style>', '', h, flags=re.S)
          h=re.sub(r'<style id="cabcalc-trip-actions-flow-v2">.*?</style>', '', h, flags=re.S)
          css="""<style id="cabcalc-trip-actions-flow-v2">
          /* FINAL ACTION STACK: pause/finish buttons stay in normal document flow.
             They must never be pinned to the viewport or overlap pickup/dropoff. */
          #clock.screen.active>#tripButtons{
            position:relative!important;
            left:auto!important; right:auto!important; top:auto!important; bottom:auto!important;
            inset:auto!important;
            float:none!important; clear:both!important;
            z-index:10!important; width:100%!important;
            margin:10px 0 8px!important; padding:0!important;
            box-sizing:border-box!important;
          }
          #clock.screen.active>#tripButtons .grid2{
            display:grid!important; grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:10px!important; width:100%!important; margin:0!important;
          }
          #clock.screen.active>#tripButtons .grid2 button{
            width:100%!important; height:60px!important; min-height:60px!important;
            box-sizing:border-box!important; position:relative!important;
          }
          </style>
          """
          if '</head>' not in h: raise SystemExit('index.html: </head> missing')
          h=h.replace('</head>',css+'</head>',1)
          p.write_text(h)
          h=p.read_text(errors="replace")
          assert 'cabcalc-trip-actions-flow-v2' in h
          assert 'position:relative!important' in h and 'bottom:auto!important' in h and 'inset:auto!important' in h
          print('Trip action flow v2 installed')
          PY2
      - name: Install canonical Android trip lifecycle bridge
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64
          from pathlib import Path
          Path("android-native/TaximetLocationPlugin.java").write_bytes(base64.b64decode(""))
          PY2
          python3 - <<'PY2'
          from pathlib import Path
          import re
          s=Path("android-native/TaximetLocationPlugin.java").read_text(errors="replace")
          required=["startTrip","pauseTrip","resumeTrip","finishTrip","clearFinishedTrip","setTripActive","getTripStats"]
          for m in required: assert len(re.findall(r"public void "+re.escape(m)+r"\(PluginCall call\)",s))==1, m
          assert re.search(r"private void putTripDistanceM\(SharedPreferences\.Editor e, double d\)",s)
          assert re.search(r"private boolean hasFineLocationPermission\(\)",s)
          assert "public class TaximetLocationPlugin extends Plugin" in s
          assert "public class TaximetLocationService extends Service" not in s
          assert s.count("{")==s.count("}")
          print("Canonical Android trip lifecycle plugin installed")
          PY2
      - name: Fix Android resume and invoice export flow
        run: |
          set -euo pipefail
          python3 - <<'PY2'
          import base64
          exec(base64.b64decode("").decode())
          PY2
      - name: Finalize Android native trip bridge and bottom-navigation-safe UI
        run: |
          set -euo pipefail
          python3 - <<'PY4'
          from pathlib import Path
          import re
          p=Path("native-web-android/index.html")
          h=p.read_text(errors="replace")
          old=re.search(r'startTrip:\(args\)=>android\.setTripActive\(\{active:true,reset:true,tripId:args\?\.tripId\|\|""\}\),\s*pauseTrip:\(\)=>android\.setTripActive\(\{active:false,reset:false\}\),\s*resumeTrip:\(\)=>android\.setTripActive\(\{active:true,reset:false\}\),\s*finishTrip:\(\)=>android\.setTripActive\(\{active:false,reset:false\}\),',h)
          new='startTrip:(args)=>android.startTrip(args||{}),pauseTrip:()=>android.pauseTrip(),resumeTrip:()=>android.resumeTrip(),finishTrip:()=>android.finishTrip(),'
          if old:
              h=h[:old.start()]+new+h[old.end():]
          elif new not in h:
              # COMPILE28 may already contain the canonical nativeTripCall bridge.
              # In that case there is nothing to rewrite. Do not fail merely
              # because the older setTripActive mapping is absent.
              required_bridge = [
                  'nativeTripCall("startTrip"',
                  'nativeTripCall("resumeTrip",{})',
                  'nativeTripCall("pauseTrip",{})',
                  'nativeTripCall("finishTrip",{})'
              ]
              if not all(x in h for x in required_bridge):
                  raise SystemExit("Android native trip mapping not found")
          h=re.sub(r'<style id="cabcalc-trip-actions-final-v3">.*?</style>','',h,flags=re.S)
          # This legacy block is intentionally not reinserted; COMPILE20 owns the final canvas.
          if '</head>' not in h: raise SystemExit('index.html: </head> missing')
          p.write_text(h)
          print('Final Android trip bridge + bottom-navigation-safe UI installed')
          PY4

      - name: Finalize unified 390px UI and native GPS bridge (COMPILE19)
        run: |
          set -euo pipefail
          python3 - <<'PY19'
          from pathlib import Path
          import re
          p=Path("android-native/TaximetLocationPlugin.java")
          s=p.read_text(errors="replace")
          old='if (i.hasExtra("tripDistanceM")) o.put("tripDistanceM", i.getDoubleExtra("tripDistanceM", 0d));'
          new='''if (i.hasExtra("tripDistanceM")) {\n            double d = i.getDoubleExtra("tripDistanceM", 0d);\n            o.put("tripDistanceM", d);\n            o.put("distanceM", d);\n        }'''
          if old in s: s=s.replace(old,new,1)
          elif 'o.put("distanceM", d);' not in s: raise SystemExit("Plugin payload anchor not found")
          old2='''        o.put("timestamp", p.getLong("timestamp", 0));\n        call.resolve(o);\n    }\n\n\n    private void putTripDistanceM'''
          new2='''        o.put("timestamp", p.getLong("timestamp", 0));\n        double d = getTripDistanceM(p);\n        o.put("tripDistanceM", d);\n        o.put("distanceM", d);\n        call.resolve(o);\n    }\n\n\n    private void putTripDistanceM'''
          if old2 in s: s=s.replace(old2,new2,1)
          elif 'double d = getTripDistanceM(p);' not in s: raise SystemExit("getLastLocation anchor not found")
          p.write_text(s)

          p=Path("android-native/TaximetLocationService.java")
          s=p.read_text(errors="replace")
          old='''            .putExtra("tripDistanceM", getTripDistanceM(getSharedPreferences(PREF,0)));'''
          new='''            .putExtra("tripDistanceM", getTripDistanceM(getSharedPreferences(PREF,0)))\n            .putExtra("distanceM", getTripDistanceM(getSharedPreferences(PREF,0)));'''
          if old in s: s=s.replace(old,new,1)
          elif '.putExtra("distanceM"' not in s: raise SystemExit("Service publish anchor not found")
          p.write_text(s)

          p=Path("native-web-android/index.html")
          h=p.read_text(errors="replace")
          old='''</section>\n</div>\n\n<nav class="bottom">'''
          new='''</section>\n<nav class="bottom">'''
          if old in h: h=h.replace(old,new,1)
          old='''</button>\n</nav>\n<div id="modalWrap"'''
          new='''</button>\n</nav>\n</div>\n<div id="modalWrap"'''
          if old in h: h=h.replace(old,new,1)
          for sid in ["cabcalc-final-main-fit","cabcalc-main-interface-fixed-stack-v2","cabcalc-final-single-canvas-v3","cabcalc-trip-actions-flow-v1","cabcalc-trip-actions-flow-v2","cabcalc-trip-actions-final-v3","cabcalc-trip-actions-final-v4"]:
              h=re.sub(r'<style id="'+re.escape(sid)+r'">.*?</style>','',h,flags=re.S)
          # Remove every legacy .bottom CSS block that uses viewport-fixed positioning.
          # The final unified canvas below is the only authoritative .bottom rule.
          def strip_fixed_bottom(m):
              body=m.group(2)
              if re.search(r'position\s*:\s*fixed\b', body, re.I):
                  return ''
              return m.group(0)
          h=re.sub(r'(?s)(\.bottom\s*\{)([^{}]*)(\})', strip_fixed_bottom, h)
          css='''<style id="cabcalc-unified-390-canvas-v5">\nhtml,body{width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important;overscroll-behavior:none!important}\nbody{position:fixed!important;inset:0!important}\n.app{width:390px!important;max-width:390px!important;min-width:390px!important;height:calc(100dvh / var(--cabcalc-ui-scale))!important;margin:0!important;position:relative!important;left:50%!important;transform:translateX(-50%) scale(var(--cabcalc-ui-scale))!important;transform-origin:top center!important;overflow:hidden!important;display:grid!important;grid-template-rows:auto minmax(0,1fr) auto!important;box-sizing:border-box!important}\n#appHeader{grid-row:1!important}\n#clock.screen.active,#revenue.screen.active,#debt.screen.active,#settings.screen.active{grid-row:2!important;min-height:0!important;box-sizing:border-box!important}\n#clock.screen.active{overflow:hidden!important;touch-action:none!important}\n#revenue.screen.active,#debt.screen.active,#settings.screen.active{overflow-y:auto!important;overflow-x:hidden!important;overscroll-behavior:contain!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}\n#clock.screen.active>#tripButtons{position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;float:none!important;clear:both!important;z-index:auto!important;width:100%!important;height:auto!important;min-height:0!important;margin:10px 0 8px!important;padding:0!important;box-sizing:border-box!important;transform:none!important}\n#clock.screen.active>#tripButtons #startBtn{position:static!important;width:100%!important;height:62px!important;min-height:62px!important;box-sizing:border-box!important}\n#clock.screen.active>#tripButtons .grid2{position:static!important;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;width:100%!important;height:auto!important;margin:0!important;padding:0!important}\n#clock.screen.active>#tripButtons .grid2 button{position:static!important;width:100%!important;height:60px!important;min-height:60px!important;box-sizing:border-box!important}\n#clock.screen.active>.card:not(.total){height:122px!important;min-height:122px!important;max-height:122px!important;overflow:hidden!important;box-sizing:border-box!important}\n#clock.screen.active>.card:not(.total) .place{height:50px!important;min-height:50px!important;max-height:50px!important;overflow:hidden!important;box-sizing:border-box!important}\n#clock.screen.active>.card:not(.total) .place div{display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:2!important;overflow:hidden!important;max-height:33px!important}\n.bottom{grid-row:3!important;position:static!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;inset:auto!important;width:390px!important;max-width:390px!important;height:auto!important;min-height:0!important;transform:none!important;transform-origin:center!important;z-index:auto!important;box-sizing:border-box!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:5px!important;padding:8px 8px 5px!important;margin:0!important}\n.bottom button{width:100%!important;height:55px!important;min-height:55px!important;max-height:55px!important;padding:5px 2px!important;margin:0!important;box-sizing:border-box!important;display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;font-size:10px!important;line-height:1.05!important;white-space:nowrap!important}\n.bottom button i{display:block!important;font-size:18px!important;margin:0 0 5px!important;line-height:1!important}\n</style>'''
          if '</head>' not in h: raise SystemExit("index.html </head> missing")
          h=h.replace('</head>',css+'</head>',1)
          js='''<script id="cabcalc-native-android-gps-poll-v2">\n(function(){\n  let timer=null;\n  async function poll(){\n    if(!isNativeAndroidTaximet()) return;\n    const n=nativeTaximetGps(); if(!n) return;\n    try{\n      const st=await n.status?.(); if(st) cacheNativeGpsStatus?.(st);\n      const last=await n.getLastLocation?.();\n      const pos=nativePositionToGeo(last);\n      if(pos){ window.__taximetLastNativeGPS=pos; nativeGpsLastAccuracy=Number(pos.coords?.accuracy)||nativeGpsLastAccuracy; nativeGpsLastFixAt=Number(pos.timestamp)||Date.now(); onPosition(pos); }\n      if(active&&['RUNNING','ACQUIRING_GPS'].includes(active.status)){ const trip=await n.getTripStats?.(); if(trip){applyNativeDistance(trip);save();renderClock();} }\n    }catch(e){console.warn('[CabCalc][GPS] native Android poll',e)}\n  }\n  function boot(){if(!isNativeAndroidTaximet()){setTimeout(boot,300);return} if(timer)return; poll(); timer=setInterval(poll,1000)}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();\n})();\n</script>'''
          h=h.replace('</body>',js+'</body>',1)
          p.write_text(h)
          print('COMPILE19 unified canvas + native GPS bridge installed')
          PY19

      - name: Finalize native-only GPS bridge and clean unified iPhone 12 Pro UI (COMPILE28)
        run: |
          set -euo pipefail
          python3 - <<'PY28'
          from pathlib import Path
          import re

          p=Path("native-web-android/index.html")
          h=p.read_text(errors="replace")

          a=h.find("async function startGps(){")
          b=h.find("function onGpsError(err){", a)
          if a<0 or b<0:
              raise SystemExit("GPS start/stop block anchors missing")
          native_gps="""async function startGps(){
            const native=nativeTaximetGps();
            if(!native){ nativeGpsErrorState="NATIVE GPS KHÔNG KHẢ DỤNG"; gpsStatus(false,"NATIVE GPS LỖI"); throw new Error("NATIVE_GPS_UNAVAILABLE"); }
            if(nativeGpsEngineStarting)return nativeGpsEngineStarting;
            nativeGpsEngineStarting=(async()=>{
              try{
                try{if(nativeGpsListener?.remove)await nativeGpsListener.remove()}catch(e){}
                try{if(nativeGpsErrorListener?.remove)await nativeGpsErrorListener.remove()}catch(e){}
                nativeGpsListener=await native.addListener("locationUpdate",data=>{
                  const pos=nativePositionToGeo(data); if(!pos)return;
                  window.__taximetLastNativeGPS=pos;
                  nativeGpsLastAccuracy=Number(pos.coords?.accuracy)||nativeGpsLastAccuracy;
                  nativeGpsLastFixAt=Number(pos.timestamp)||Date.now();
                  onPosition(pos);
                });
                nativeGpsErrorListener=await native.addListener("locationError",data=>{
                  const code=Number(data?.code)||2; const message=String(data?.message||"Native GPS error");
                  nativeGpsErrorState=code===1?"QUYỀN GPS BỊ TỪ CHỐI":"GPS MẤT TÍN HIỆU";
                  onGpsError({code,message});
                });
                if(!nativeGpsStatusListener) nativeGpsStatusListener=await native.addListener("gpsStatus",data=>cacheNativeGpsStatus(data));
                await native.start();
                nativeGpsEngineStarted=true;
                try{cacheNativeGpsStatus(await native.status())}catch(e){}
                try{const last=await native.getLastLocation(); const pos=nativePositionToGeo(last); if(pos){window.__taximetLastNativeGPS=pos; nativeGpsLastAccuracy=Number(pos.coords?.accuracy)||nativeGpsLastAccuracy; nativeGpsLastFixAt=Number(pos.timestamp)||Date.now(); onPosition(pos);}}catch(e){}
                renderNativeGpsStatus();
                return true;
              }finally{ nativeGpsEngineStarting=null; }
            })();
            return nativeGpsEngineStarting;
          }
          async function stopGps(){
            try{if(nativeGpsListener?.remove)await nativeGpsListener.remove()}catch(e){}
            try{if(nativeGpsErrorListener?.remove)await nativeGpsErrorListener.remove()}catch(e){}
            nativeGpsListener=null; nativeGpsErrorListener=null;
            clearTimeout(gpsRetryTimer); gpsRetryTimer=null;
            nativeGpsEngineStarted=false;
          }
          """
          h=h[:a]+native_gps+h[b:]

          for token in [r'navigator\.geolocation',r'\bwatchPosition\b',r'\bgetCurrentPosition\b',r'\bclearWatch\b']:
              h=re.sub(token,'',h)
          h=h.replace("GEOLOCATION_UNSUPPORTED","NATIVE_GPS_UNAVAILABLE")
          h=h.replace("GEOLOCATION_REQUIRES_SECURE_CONTEXT","NATIVE_GPS_REQUIRES_PERMISSION")
