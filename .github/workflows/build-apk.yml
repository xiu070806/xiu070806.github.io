name: Build TAXIMET PRO v11 APK - Native GPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Create Android project
      - name: Create Android project
        run: npx cap add android

      # 7. Prepare www
      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html

      # 8. Verify TAXIMET PRO v11
      - name: Verify TAXIMET PRO v11
        run: |
          test -f www/index.html
          echo "TAXIMET PRO v11 OK"
          wc -c www/index.html

      # 9. Copy native GPS source
      - name: Copy native GPS
        shell: bash
        run: |
          set -e

          test -f android-native/TaximetLocationPlugin.java
          test -f android-native/LocationService.java

          echo "Native GPS source found:"
          ls -lh android-native/*.java

          PACKAGE=$(grep -m1 '^package ' \
            android-native/TaximetLocationPlugin.java \
            | sed 's/^package //' \
            | sed 's/;//')

          if [ -z "$PACKAGE" ]; then
            echo "ERROR: Java package not found"
            exit 1
          fi

          echo "Detected Java package: $PACKAGE"

          PACKAGE_PATH=$(echo "$PACKAGE" | tr '.' '/')

          mkdir -p \
            "android/app/src/main/java/$PACKAGE_PATH"

          cp \
            android-native/TaximetLocationPlugin.java \
            "android/app/src/main/java/$PACKAGE_PATH/TaximetLocationPlugin.java"

          cp \
            android-native/LocationService.java \
            "android/app/src/main/java/$PACKAGE_PATH/LocationService.java"

          echo "Native GPS installed at:"
          find \
            "android/app/src/main/java/$PACKAGE_PATH" \
            -maxdepth 1 \
            -type f \
            -print

      # 10. Sync Capacitor
      - name: Capacitor sync
        run: |
          npx cap sync android

      # 11. Patch Android Manifest
      - name: Patch Android Manifest
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          plugin = Path(
              "android-native/TaximetLocationPlugin.java"
          )

          service = Path(
              "android-native/LocationService.java"
          )

          s = manifest.read_text()

          plugin_text = plugin.read_text()
          service_text = service.read_text()

          # Detect plugin package
          m = re.search(
              r'^\s*package\s+([A-Za-z0-9_.]+)\s*;',
              plugin_text,
              re.M
          )

          if not m:
              raise SystemExit(
                  "ERROR: Cannot detect plugin package"
              )

          plugin_package = m.group(1)

          # Detect service package
          ms = re.search(
              r'^\s*package\s+([A-Za-z0-9_.]+)\s*;',
              service_text,
              re.M
          )

          if ms:
              service_package = ms.group(1)
          else:
              service_package = plugin_package

          # Required permissions
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />'
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      '<application',
                      permission + '\n\n    <application',
                      1
                  )

          # Register LocationService
          service_name = (
              service_package + ".LocationService"
          )

          if service_name not in s:
              service_xml = f'''
              <service
                  android:name="{service_name}"
                  android:enabled="true"
                  android:exported="false"
                  android:foregroundServiceType="location" />
              '''

              s = s.replace(
                  '</application>',
                  service_xml + '\n    </application>',
                  1
              )

          manifest.write_text(s)

          print("AndroidManifest.xml patched")
          print("Plugin package:", plugin_package)
          print("Service:", service_name)
          PY

      # 12. Register native GPS plugin
      - name: Register native GPS plugin
        shell: bash
        run: |
          set -e

          MAIN=$(find \
            android/app/src/main/java \
            -name "MainActivity.java" \
            | head -n 1)

          if [ -z "$MAIN" ]; then
            echo "ERROR: MainActivity.java not found"
            exit 1
          fi

          echo "MainActivity:"
          echo "$MAIN"

          PACKAGE=$(grep -m1 '^package ' \
            android-native/TaximetLocationPlugin.java \
            | sed 's/^package //' \
            | sed 's/;//')

          echo "Native GPS package: $PACKAGE"

          python3 - "$MAIN" "$PACKAGE" <<'PY'
          from pathlib import Path
          import sys
          import re

          main = Path(sys.argv[1])
          package = sys.argv[2]

          s = main.read_text()

          import_line = (
              f"import {package}.TaximetLocationPlugin;"
          )

          if import_line not in s:

              match = re.search(
                  r'^(package\s+[^;]+;)',
                  s,
                  re.M
              )

              if match:
                  position = match.end()

                  s = (
                      s[:position]
                      + "\n\n"
                      + import_line
                      + s[position:]
                  )
              else:
                  s = (
                      import_line
                      + "\n"
                      + s
                  )

          registration = (
              "registerPlugin(TaximetLocationPlugin.class);"
          )

          if registration not in s:

              marker = (
                  "super.onCreate(savedInstanceState);"
              )

              if marker in s:

                  s = s.replace(
                      marker,
                      marker
                      + "\n        "
                      + registration,
                      1
                  )

              else:

                  class_match = re.search(
                      r'(public\s+class\s+MainActivity[^{]*\{)',
                      s
                  )

                  if not class_match:
                      raise SystemExit(
                          "ERROR: MainActivity class not found"
                      )

                  method = '''
              
              @Override
              public void onCreate(
                      android.os.Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  registerPlugin(
                      TaximetLocationPlugin.class
                  );
              }
          '''

                  position = class_match.end()

                  s = (
                      s[:position]
                      + method
                      + s[position:]
                  )

          main.write_text(s)

          print("MainActivity patched successfully")
          PY

      # 13. Verify native GPS integration
      - name: Verify native GPS integration
        run: |
          echo "===== Java files ====="

          find android/app/src/main/java \
            -type f \
            \( \
              -name "TaximetLocationPlugin.java" \
              -o \
              -name "LocationService.java" \
            \) \
            -print

          echo ""
          echo "===== Manifest GPS permissions ====="

          grep -n \
            -E "ACCESS_.*LOCATION|FOREGROUND_SERVICE" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "===== Location Service ====="

          grep -n \
            "LocationService" \
            android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "===== MainActivity plugin ====="

          grep -n \
            "TaximetLocationPlugin" \
            $(find android/app/src/main/java \
              -name "MainActivity.java" \
              | head -n 1) || true

      # 14. Build APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 15. Verify APK exists
      - name: Verify APK
        run: |
          echo "===== APK OUTPUT ====="

          ls -lh \
            android/app/build/outputs/apk/debug/

          test -f \
            android/app/build/outputs/apk/debug/app-debug.apk

          echo ""
          echo "APK CREATED SUCCESSFULLY"

      # 16. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v11-Native-GPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
