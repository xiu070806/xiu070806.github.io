name: Build TAXIMET PRO v11 APK - Native GPS + EV Pro Logo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python image dependency
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web directory
        run: |
          set -e

          rm -rf www
          mkdir -p www

          test -f native-web/index.html

          cp native-web/index.html www/index.html

          echo "Native web copied successfully"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Copy native Android sources
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/taximet/pro

          cp android-native/TaximetLocationPlugin.java \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          cp android-native/LocationService.java \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          cp android-native/MainActivity.java \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

          echo "Native Android sources copied"

      - name: Install EV Pro app icon
        run: |
          set -e

          test -f assets/app-icon/icon-192.png
          test -f assets/app-icon/icon-512.png

          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/app-icon/icon-512.png")
          res = Path("android/app/src/main/res")

          img = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder

              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  target / "ic_launcher.png",
                  "PNG"
              )

              icon.save(
                  target / "ic_launcher_round.png",
                  "PNG"
              )

          print("EV Pro icon generated successfully")
          PY

      - name: Patch Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      perm + "\n\n    <application",
                      1
                  )

          service = """    <service
              android:name="com.ev.taximetpro.LocationService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="location" />"""

          if "com.ev.taximetpro.LocationService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n\n    </application>",
                  1
              )

          p.write_text(s)
          PY

          echo "Android Manifest patched"

      - name: Verify TaximetLocationPlugin
        run: |
          set -e

          FILE="android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java"

          test -f "$FILE"

          grep -q \
            'import com.getcapacitor.annotation.Permission;' \
            "$FILE"

          grep -q \
            '@Permission(' \
            "$FILE"

          if grep -q '@CapacitorPlugin.Permission' "$FILE"; then
            echo "ERROR: old Permission syntax detected"
            exit 1
          fi

          echo "TaximetLocationPlugin OK"

      - name: Verify MainActivity
        run: |
          set -e

          FILE="android/app/src/main/java/com/taximet/pro/MainActivity.java"

          test -f "$FILE"

          grep -q \
            'registerPlugin(TaximetLocationPlugin.class)' \
            "$FILE"

          grep -q \
            'onNewIntent' \
            "$FILE"

          echo "MainActivity OK"

      - name: Verify notification
        run: |
          set -e

          FILE="android/app/src/main/java/com/taximet/pro/LocationService.java"

          test -f "$FILE"

          grep -q 'setContentIntent' "$FILE"
          grep -q 'getLaunchIntentForPackage' "$FILE"
          grep -q 'FLAG_ACTIVITY_SINGLE_TOP' "$FILE"
          grep -q 'FLAG_UPDATE_CURRENT' "$FILE"
          grep -q 'FLAG_IMMUTABLE' "$FILE"

          echo "Notification PendingIntent OK"

      - name: Verify foreground GPS service
        run: |
          set -e

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          grep -q \
            'com.ev.taximetpro.LocationService' \
            "$MANIFEST"

          grep -q \
            'FOREGROUND_SERVICE_LOCATION' \
            "$MANIFEST"

          echo "Foreground GPS service OK"

      - name: Verify native web GPS bridge
        run: |
          set -e

          FILE="www/index.html"

          grep -q 'TaximetLocation' "$FILE"
          grep -q 'locationUpdate' "$FILE"
          grep -q 'nativeTaximetGps' "$FILE"

          echo "Native web GPS bridge OK"

      - name: Verify EV Pro logo
        run: |
          set -e

          RES="android/app/src/main/res"

          test -f "$RES/mipmap-mdpi/ic_launcher.png"
          test -f "$RES/mipmap-hdpi/ic_launcher.png"
          test -f "$RES/mipmap-xhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher.png"

          test -f "$RES/mipmap-mdpi/ic_launcher_round.png"
          test -f "$RES/mipmap-hdpi/ic_launcher_round.png"
          test -f "$RES/mipmap-xhdpi/ic_launcher_round.png"
          test -f "$RES/mipmap-xxhdpi/ic_launcher_round.png"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher_round.png"

          grep -q \
            'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          echo "EV Pro logo OK"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK CREATED"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v11-Native-GPS-EV-Pro
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
