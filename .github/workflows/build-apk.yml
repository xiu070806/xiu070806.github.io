name: Build TAXIMET PRO v14 APK - GPS Background Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Python image dependency
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web directory
        run: |
          set -e
          rm -rf www
          mkdir -p www
          test -f native-web/index.html
          cp native-web/index.html www/index.html

      - name: Verify GPS bridge BEFORE sync
        run: |
          set -e

          grep -q 'nativePromise' native-web/index.html
          grep -q 'TaximetLocation' native-web/index.html
          grep -q 'function startGps' native-web/index.html

          echo "v14 GPS bridge source OK (APK12-compatible nativePromise)"

      - name: Capacitor sync
        run: npx cap sync android

      - name: Verify GPS bridge AFTER sync
        run: |
          set -e

          grep -q 'nativePromise' www/index.html
          grep -q 'TaximetLocation' www/index.html

          echo "v14 GPS bridge in www OK"

      - name: Copy synchronized native Android sources
        run: |
          set -e

          mkdir -p android/app/src/main/java/com/taximet/pro

          cp android-native/TaximetLocationPlugin.java \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          cp android-native/LocationService.java \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          cp android-native/MainActivity.java \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

      - name: Install EV Pro launcher icon
        run: |
          set -e

          test -f assets/app-icon/icon-192.png
          test -f assets/app-icon/icon-512.png

          RES="android/app/src/main/res"

          rm -rf "$RES/mipmap-anydpi-v26"
          rm -rf "$RES/mipmap-anydpi-v25"
          rm -rf "$RES/mipmap-anydpi"

          mkdir -p \
            "$RES/mipmap-mdpi" \
            "$RES/mipmap-hdpi" \
            "$RES/mipmap-xhdpi" \
            "$RES/mipmap-xxhdpi" \
            "$RES/mipmap-xxxhdpi"

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/app-icon/icon-512.png")
          res = Path("android/app/src/main/res")

          img = Image.open(source).convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, size in sizes.items():
              target = res / folder
              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  target / "ic_launcher.png",
                  "PNG"
              )

              icon.save(
                  target / "ic_launcher_round.png",
                  "PNG"
              )

          print("EV Pro icons generated")
          PY

      - name: Patch Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      perm + "\n\n    <application",
                      1
                  )

          service = """    <service
              android:name="com.ev.taximetpro.LocationService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="location" />"""

          if "com.ev.taximetpro.LocationService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n\n    </application>",
                  1
              )

          if 'android:icon="@mipmap/ic_launcher"' not in s:
              s = s.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )
          elif 'android:roundIcon="@mipmap/ic_launcher_round"' not in s:
              s = s.replace(
                  'android:icon="@mipmap/ic_launcher"',
                  'android:icon="@mipmap/ic_launcher" '
                  'android:roundIcon="@mipmap/ic_launcher_round"',
                  1
              )

          p.write_text(s)
          PY

      - name: Verify native plugin and notification
        run: |
          set -e

          PLUGIN="android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java"
          MAIN="android/app/src/main/java/com/taximet/pro/MainActivity.java"
          SERVICE="android/app/src/main/java/com/taximet/pro/LocationService.java"
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          test -f "$PLUGIN"
          test -f "$MAIN"
          test -f "$SERVICE"

          grep -q 'import com.getcapacitor.annotation.Permission;' "$PLUGIN"
          grep -q '@Permission(' "$PLUGIN"

          if grep -q '@CapacitorPlugin.Permission' "$PLUGIN"; then
            echo "ERROR: old Permission syntax remains"
            exit 1
          fi

          grep -q 'registerPlugin(TaximetLocationPlugin.class)' "$MAIN"
          grep -q 'onNewIntent' "$MAIN"

          grep -q 'com.taximet.pro.MainActivity' "$SERVICE"
          grep -q 'setContentIntent' "$SERVICE"
          grep -q 'FLAG_ACTIVITY_SINGLE_TOP' "$SERVICE"
          grep -q 'FLAG_ACTIVITY_CLEAR_TOP' "$SERVICE"
          grep -q 'FLAG_UPDATE_CURRENT' "$SERVICE"
          grep -q 'FLAG_IMMUTABLE' "$SERVICE"

          grep -q 'com.ev.taximetpro.LocationService' "$MANIFEST"
          grep -q 'FOREGROUND_SERVICE_LOCATION' "$MANIFEST"

          echo "Native plugin + notification OK"

      - name: Verify launcher icon
        run: |
          set -e

          RES="android/app/src/main/res"

          test -f "$RES/mipmap-mdpi/ic_launcher.png"
          test -f "$RES/mipmap-hdpi/ic_launcher.png"
          test -f "$RES/mipmap-xhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxhdpi/ic_launcher.png"
          test -f "$RES/mipmap-xxxhdpi/ic_launcher.png"

          if find "$RES/mipmap-anydpi-v26" -type f 2>/dev/null | grep -q .; then
            echo "ERROR: adaptive launcher icon still exists"
            exit 1
          fi

          grep -q 'android:icon="@mipmap/ic_launcher"' \
            android/app/src/main/AndroidManifest.xml

          echo "EV Pro launcher icon OK"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          set -e

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"
          echo "APK CREATED"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v14-GPS-Background-Fix-EV-Pro
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
