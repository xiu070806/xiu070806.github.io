name: Build TAXIMET PRO v11 APK - Native GPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
  

      # 3. Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install dependencies
      - name: Install dependencies
        run: npm install

      # 6. Create Android project
      - name: Create Android project
        run: npx cap add android

      # 7. Create www directory
      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

      # 8. Copy TAXIMET PRO v11
      - name: Copy TAXIMET PRO v11
        run: |
          cp index.html www/index.html

      # 9. Copy native GPS source
      - name: Copy native GPS
        run: |
          find android/app/src/main/java -type f -name "MainActivity.java" -print

          mkdir -p android/app/src/main/java/com/taximet/pro

          cp TaximetLocationPlugin.java \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          cp LocationService.java \
            android/app/src/main/java/com/taximet/pro/LocationService.java

      # 10. Sync Capacitor
      - name: Capacitor sync
        run: npx cap sync android

      # 11. Patch Android permissions
      - name: Patch Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />'
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      perm + "\n\n    <application",
                      1
                  )

          p.write_text(s)
          PY

      # 12. Build debug APK
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      # 13. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v11-Native-GPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
