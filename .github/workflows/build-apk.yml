name: Build TAXIMET PRO v11 APK - Native GPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

          test -f native-web/index.html

          cp native-web/index.html www/index.html

      - name: Capacitor sync
        run: npx cap sync android

      - name: Copy native Android sources
        run: |
          mkdir -p android/app/src/main/java/com/taximet/pro

          cp android-native/TaximetLocationPlugin.java \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          cp android-native/LocationService.java \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          cp android-native/MainActivity.java \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

      - name: Patch Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for perm in permissions:
              if perm not in s:
                  s = s.replace(
                      "<application",
                      perm + "\n\n    <application",
                      1
                  )

          service = """    <service
              android:name="com.ev.taximetpro.LocationService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="location" />"""

          if "com.ev.taximetpro.LocationService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n\n    </application>",
                  1
              )

          p.write_text(s)
          PY

      - name: Verify synchronized native wiring
        run: |
          set -e

          echo "======================================"
          echo "CHECK NATIVE WEB"
          echo "======================================"

          test -f www/index.html

          grep -q 'TaximetLocation' www/index.html
          grep -q 'locationUpdate' www/index.html

          echo "Native Web OK"

          echo "======================================"
          echo "CHECK NATIVE JAVA"
          echo "======================================"

          test -f \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          test -f \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          test -f \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

          echo "Native Java files OK"

          echo "======================================"
          echo "CHECK MAIN ACTIVITY"
          echo "======================================"

          grep -q \
            'registerPlugin(TaximetLocationPlugin.class)' \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

          grep -q \
            'onNewIntent' \
            android/app/src/main/java/com/taximet/pro/MainActivity.java

          echo "MainActivity OK"

          echo "======================================"
          echo "CHECK NOTIFICATION"
          echo "======================================"

          grep -q \
            'setContentIntent' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          grep -q \
            'getLaunchIntentForPackage' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          grep -q \
            'FLAG_ACTIVITY_SINGLE_TOP' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          grep -q \
            'FLAG_UPDATE_CURRENT' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          grep -q \
            'FLAG_IMMUTABLE' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          echo "Notification PendingIntent OK"

          echo "======================================"
          echo "CHECK ANDROID GPS SERVICE"
          echo "======================================"

          grep -q \
            'com.ev.taximetpro.LocationService' \
            android/app/src/main/AndroidManifest.xml

          grep -q \
            'FOREGROUND_SERVICE_LOCATION' \
            android/app/src/main/AndroidManifest.xml

          echo "Foreground GPS Service OK"

          echo "======================================"
          echo "ALL CHECKS PASSED"
          echo "======================================"

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --stacktrace

      - name: Verify APK
        run: |
          test -f \
            android/app/build/outputs/apk/debug/app-debug.apk

          echo "======================================"
          echo "APK CREATED"
          echo "======================================"

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v11-Native-GPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
