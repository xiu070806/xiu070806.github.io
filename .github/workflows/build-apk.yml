name: Build TAXIMET PRO v11 APK - Native GPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

      - name: Copy TAXIMET PRO v11
        run: |
          cp index.html www/index.html

      - name: Copy native GPS source
        run: |
          mkdir -p android/app/src/main/java/com/taximet/pro

          cp android-native/TaximetLocationPlugin.java \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          cp android-native/LocationService.java \
            android/app/src/main/java/com/taximet/pro/LocationService.java

      - name: Register native GPS plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("android/app/src/main/java")
          main_files = list(root.rglob("MainActivity.java"))

          if not main_files:
              raise SystemExit("MainActivity.java not found")

          main = main_files[0]
          text = main.read_text()

          print("MainActivity:", main)

          # Add plugin import
          if "com.ev.taximetpro.TaximetLocationPlugin" not in text:
              lines = text.splitlines()

              package_index = 0

              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      package_index = i
                      break

              lines.insert(
                  package_index + 1,
                  ""
              )

              lines.insert(
                  package_index + 2,
                  "import com.ev.taximetpro.TaximetLocationPlugin;"
              )

              text = "\n".join(lines) + "\n"

          # Register plugin
          if "registerPlugin(TaximetLocationPlugin.class)" not in text:

              marker = "public class MainActivity extends BridgeActivity {"

              if marker not in text:
                  raise SystemExit(
                      "Unexpected MainActivity.java format"
                  )

              replacement = """public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(android.os.Bundle savedInstanceState) {
                  registerPlugin(TaximetLocationPlugin.class);
                  super.onCreate(savedInstanceState);
              }"""

              text = text.replace(
                  marker,
                  replacement,
                  1
              )

          main.write_text(text)

          print("Native GPS plugin registered successfully.")
          PY

      - name: Patch Android location permissions and service
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          s = manifest.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          ]

          for permission in permissions:
              if permission not in s:
                  s = s.replace(
                      "<application",
                      permission + "\n\n    <application",
                      1
                  )

          service = """    <service
              android:name="com.ev.taximetpro.LocationService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="location" />"""

          if "com.ev.taximetpro.LocationService" not in s:
              s = s.replace(
                  "</application>",
                  service + "\n\n    </application>",
                  1
              )

          manifest.write_text(s)

          print("Android location permissions/service configured.")
          PY

      - name: Verify native GPS wiring
        run: |
          echo "===== Native GPS files ====="

          find android/app/src/main/java \
            -name "TaximetLocationPlugin.java" \
            -o -name "LocationService.java"

          echo "===== MainActivity ====="

          find android/app/src/main/java \
            -name "MainActivity.java"

          echo "===== Check plugin source ====="

          test -f android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          echo "Plugin source OK"

          echo "===== Check service source ====="

          test -f android/app/src/main/java/com/taximet/pro/LocationService.java

          echo "Location service source OK"

          echo "===== Check MainActivity registration ====="

          grep -R -q \
            'registerPlugin(TaximetLocationPlugin.class)' \
            android/app/src/main/java

          echo "Plugin registration OK"

          echo "===== Check Android service ====="

          grep -q \
            'com.ev.taximetpro.LocationService' \
            android/app/src/main/AndroidManifest.xml

          echo "Location service declaration OK"

          echo "===== Check foreground location ====="

          grep -q \
            'FOREGROUND_SERVICE_LOCATION' \
            android/app/src/main/AndroidManifest.xml

          echo "Foreground location permission OK"

          echo "===== Check Java package ====="

          grep -q \
            'package com.ev.taximetpro;' \
            android/app/src/main/java/com/taximet/pro/TaximetLocationPlugin.java

          grep -q \
            'package com.ev.taximetpro;' \
            android/app/src/main/java/com/taximet/pro/LocationService.java

          echo "Java package OK"

          echo "===== Check web native bridge ====="

          grep -q \
            'TaximetLocation' \
            www/index.html

          grep -q \
            'locationUpdate' \
            www/index.html

          echo "Web native GPS bridge OK"

          echo "===== ALL NATIVE GPS CHECKS PASSED ====="

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk

          echo "===== APK CREATED ====="

          ls -lh \
            android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v11-Native-GPS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
