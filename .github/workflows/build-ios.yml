name: TAXIMET PRO iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www
          cp index.html www/index.html
          if [ -f manifest.webmanifest ]; then cp manifest.webmanifest www/manifest.webmanifest; fi
          if [ -f sw.js ]; then cp sw.js www/sw.js; fi
          if [ -d icons ]; then cp -R icons www/icons; fi
          if [ -d assets ]; then cp -R assets www/assets; fi

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      # Copy files into the actual App source directory.
      - name: Install native GPS source files
        run: |
          cp ios-native/LocationBridge.swift ios/App/App/LocationBridge.swift
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/TaximetLocationPlugin.swift

      # Add the files with paths relative to the App group.
      # This avoids the "multiple commands produce LocationBridge.swift"
      # / generated-file path problem caused by adding repository-relative
      # paths to an Xcode group that already points at ios/App/App.
      - name: Add native files to Xcode project
        run: |
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'App' }
          abort 'App target not found' unless target

          app_group = project.main_group.groups.find { |g| g.name == 'App' || g.path == 'App' }
          abort 'App group not found' unless app_group

          {
            'LocationBridge.swift' => 'ios/App/App/LocationBridge.swift',
            'TaximetLocationPlugin.swift' => 'ios/App/App/TaximetLocationPlugin.swift'
          }.each do |name, disk_path|

            # Remove stale references to this file from the project.
            project.files.select do |ref|
              ref.path == name ||
              ref.path == disk_path ||
              ref.real_path.to_s == File.expand_path(disk_path)
            end.each do |ref|
              target.source_build_phase.remove_file_reference(ref)
              ref.remove_from_project
            end

            # Create exactly one reference relative to the App group.
            ref = app_group.new_file(name)

            target.source_build_phase.add_file_reference(ref)
          end

          project.save
          RUBY

      - name: Configure iOS location permissions
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính tiền taxi theo GPS." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tiếp tục nhận GPS khi chạy nền." "$PLIST"

      - name: Verify Xcode sources
        run: |
          test -f ios/App/App/LocationBridge.swift
          test -f ios/App/App/TaximetLocationPlugin.swift

          echo "LocationBridge references:"
          grep -c "LocationBridge.swift" ios/App/App.xcodeproj/project.pbxproj

          echo "TaximetLocationPlugin references:"
          grep -c "TaximetLocationPlugin.swift" ios/App/App.xcodeproj/project.pbxproj

          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" ios/App/App/Info.plist

      - name: Build unsigned iOS
        run: |
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          cd ios/App
          rm -rf Payload
          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            Payload/TAXIMET_PRO.app

          /usr/bin/zip -r \
            ../../TAXIMET_PRO_unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_unsigned
          path: TAXIMET_PRO_unsigned.ipa
