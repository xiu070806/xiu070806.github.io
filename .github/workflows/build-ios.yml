name: TAXIMET PRO v20.1 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Install npm dependencies
        run: |
          npm install
          npm install @capacitor/core@^7.4.0
          npm install @capacitor/ios@^7.4.0

      - name: Create iOS project
        run: npx cap add ios

      - name: Prepare web app
        run: |
          mkdir -p www
          cp native-web/index.html www/index.html

      - name: Verify v20.1 source
        run: |
          test -f native-web/index.html
          test -f ios-native/TaximetLocationPlugin.swift
          test -f ios-native/TaximetLocationPlugin.m
          grep -q "TaximetLocationPlugin" native-web/index.html
          grep -q "getBackgroundLocations" native-web/index.html
          grep -q "setTripActive" native-web/index.html
          grep -q "public func locationManager" ios-native/TaximetLocationPlugin.swift

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Install v20.1 native GPS plugin
        run: |
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.m ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Create TaximetLocation plugin registration
        run: |
          cat > ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Capacitor/Capacitor.h>

          CAP_PLUGIN(TaximetLocationPlugin, "TaximetLocation",
            CAP_PLUGIN_METHOD(start, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(stop, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(getLastLocation, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(getBackgroundLocations, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(clearBackgroundLocations, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(status, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(setTripActive, CAPPluginReturnPromise);
          )
          EOF

      - name: Add v20.1 GPS plugin to Xcode project
        run: |
          set -e

          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target =
            project.targets.find { |t| t.name == 'App' } ||
            project.targets.first

          abort 'ERROR: App target not found' unless target

          app_group =
            project.main_group.children.find do |child|
              child.respond_to?(:path) &&
              child.path.to_s == 'App'
            end

          unless app_group
            app_group =
              project.main_group.groups.find do |group|
                group.path.to_s == 'App'
              end
          end

          abort 'ERROR: App group not found' unless app_group

          plugins_group =
            app_group.children.find do |child|
              child.isa == 'PBXGroup' &&
              child.path.to_s == 'Plugins'
            end

          unless plugins_group
            plugins_group = app_group.new_group('Plugins', 'Plugins')
          end

          taximet_group =
            plugins_group.children.find do |child|
              child.isa == 'PBXGroup' &&
              child.path.to_s == 'TaximetLocation'
            end

          unless taximet_group
            taximet_group =
              plugins_group.new_group(
                'TaximetLocation',
                'TaximetLocation'
              )
          end

          swift_path =
            'Plugins/TaximetLocation/TaximetLocationPlugin.swift'

          swift_ref =
            project.files.find do |file|
              file.path.to_s == swift_path
            end

          unless swift_ref
            swift_ref =
              taximet_group.new_file(
                'TaximetLocationPlugin.swift'
              )
          end

          unless target.source_build_phase.files.any? do |build_file|
            build_file.file_ref == swift_ref
          end
            target.source_build_phase.add_file_reference(swift_ref)
          end

          objc_path =
            'Plugins/TaximetLocation/TaximetLocationPlugin.m'

          objc_ref =
            project.files.find do |file|
              file.path.to_s == objc_path
            end

          unless objc_ref
            objc_ref =
              taximet_group.new_file(
                'TaximetLocationPlugin.m'
              )
          end

          unless target.source_build_phase.files.any? do |build_file|
            build_file.file_ref == objc_ref
          end
            target.source_build_phase.add_file_reference(objc_ref)
          end

          project.save

          puts "V20.2 GPS plugin added to Xcode"
          puts "Swift: #{swift_ref.path}"
          puts "Objective-C: #{objc_ref.path}"
          RUBY

      - name: Configure iOS GPS permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước." ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để tính cước." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí luôn luôn để tiếp tục tính cước khi chạy nền." ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí luôn luôn để tiếp tục tính cước khi chạy nền." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/App/App/Info.plist 2>/dev/null || true

      - name: Install TAXIMET PRO icon
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          python <<'PY'
          from PIL import Image
          from pathlib import Path
          import json

          src = Path("assets/app-icon/icon-512.png")
          out = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          img = Image.open(src).convert("RGBA")

          sizes = {
              "Icon-60@2x.png": 120,
              "Icon-60@3x.png": 180,
              "Icon-76.png": 76,
              "Icon-76@2x.png": 152,
              "Icon-83.5@2x.png": 167,
              "Icon-1024.png": 1024,
          }

          for name, size in sizes.items():
              img.resize((size, size), Image.Resampling.LANCZOS).save(out / name)

          images = [
              {"filename": "Icon-60@2x.png", "idiom": "iphone", "scale": "2x", "size": "60x60"},
              {"filename": "Icon-60@3x.png", "idiom": "iphone", "scale": "3x", "size": "60x60"},
              {"filename": "Icon-76.png", "idiom": "ipad", "scale": "1x", "size": "76x76"},
              {"filename": "Icon-76@2x.png", "idiom": "ipad", "scale": "2x", "size": "76x76"},
              {"filename": "Icon-83.5@2x.png", "idiom": "ipad", "scale": "2x", "size": "83.5x83.5"},
              {"filename": "Icon-1024.png", "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024"},
          ]

          (out / "Contents.json").write_text(json.dumps({
              "images": images,
              "info": {"author": "xcode", "version": 1}
          }, indent=2))
          PY

      - name: Verify files before build
        run: |
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m
          grep -q "TaximetLocationPlugin" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Build unsigned iOS app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built App
        run: |
          APP_PATH="ios/App/build/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" "artifacts/Payload/TAXIMET PRO.app"

      - name: Package unsigned IPA
        run: |
          cd artifacts
          zip -qry ../TAXIMET_PRO_v20.2_unsigned.ipa Payload

      - name: Upload iOS v20.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v20.1-iOS
          path: |
            TAXIMET_PRO_v20.2_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
          if-no-files-found: error
          retention-days: 7
