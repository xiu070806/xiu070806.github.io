name: Build CabCalc v50.14 - Baseline V1 Native GPS Bridge FIX FINAL v4

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare Capacitor project
        run: |
          set -euo pipefail
          if [ ! -f package.json ]; then
            cat > package.json <<'JSON'
          {
            "private": true,
            "dependencies": {
              "@capacitor/core": "7.4.0",
              "@capacitor/ios": "7.4.0"
            },
            "devDependencies": {
              "@capacitor/cli": "7.4.0"
            }
          }
          JSON
          fi
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/ios@7.4.0
          npm install --save-dev --save-exact @capacitor/cli@7.4.0
          sudo gem install xcodeproj --no-document
          rm -rf www ios
          mkdir -p www
          cp native-web/index.html www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.cabcalc.app",
            "appName": "CabCalc",
            "webDir": "www"
          }
          JSON

      - name: VERIFY FINAL SOURCE CONTRACT
        run: |
          set -euo pipefail
          test -s native-web/index.html
          test -s ios-native/TaximetLocationPlugin.swift
          test -s ios-native/TaximetBridgeViewController.swift
          EXPECTED_BASELINE_HTML_CSS_SHA='14d039432733b2062f86606413d4e49a44847c91ef398c9c44bfc6211d9cc8ec'
          EXPECTED_HTML_SHA='1d5820d0ab67227750e8f4527a49debee638ef47f356fb04abd0f7f96fa9aedb'
          EXPECTED_SWIFT_SHA='2d1bcf9652506809c2fda4101956eb17acbd4552572046cd7336a217e2aa6680'
          EXPECTED_BRIDGE_SHA='a29dc82834fa103ffc5103af489c516b7bbea233dcc43f90f5013ce806a19c2a'
          ACTUAL_HTML_SHA=$(shasum -a 256 native-web/index.html | awk '{print $1}')
          ACTUAL_SWIFT_SHA=$(shasum -a 256 ios-native/TaximetLocationPlugin.swift | awk '{print $1}')
          ACTUAL_BRIDGE_SHA=$(shasum -a 256 ios-native/TaximetBridgeViewController.swift | awk '{print $1}')
          test "$ACTUAL_HTML_SHA" = "$EXPECTED_HTML_SHA"
          test "$ACTUAL_SWIFT_SHA" = "$EXPECTED_SWIFT_SHA"
          test "$ACTUAL_BRIDGE_SHA" = "$EXPECTED_BRIDGE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          html=Path('native-web/index.html').read_text(encoding='utf-8')
          swift=Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')
          bridge=Path('ios-native/TaximetBridgeViewController.swift').read_text(encoding='utf-8')
          css=''.join(re.findall(r'<style[^>]*>(.*?)</style>',html,re.S))
          assert hashlib.sha256(css.encode()).hexdigest() == '14d039432733b2062f86606413d4e49a44847c91ef398c9c44bfc6211d9cc8ec'
          required_html=['v47-metric-accents','v50-13-master-single-scale','GHI NỢ','HÓA ĐƠN DỊCH VỤ','CHI TIẾT CÁC CHUYẾN','TAXIMET_PRO_DB','taximet-payment-state-clean','payment-status-tag','paymentStateTag','#D32F2F','#D99A00','#16803C','history','debts','flushPersistentStorage','initTaximetPersistentStorage','taximet_idb_migration_v2','isNativeIOSTaximet','syncIOSNativeTripOnForeground','nativeTripCall("finishTrip",{})','nativeTripCall("startTrip",{tripId:active.id})','No WebView geolocation permission','iOS native Core Location is authoritative']
          missing=[x for x in required_html if x not in html]
          if missing: raise SystemExit('MISSING HTML CONTRACT '+repr(missing))
          forbidden=['navigator.geolocation','watchPosition','getCurrentPosition','clearWatch','gpsDerivedSpeedKmh','effectiveGpsSpeedKmh','haversineM','computeRoutes','routes.googleapis.com','resolveGap','gapLedger','drAccrueUntil','drFactor']
          bad=[x for x in forbidden if x in html]
          if bad: raise SystemExit('WEBVIEW GPS/DISTANCE ENGINE STILL PRESENT '+repr(bad))
          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',html)
          dup=sorted({x for x in funcs if funcs.count(x)>1})
          if dup: raise SystemExit('DUPLICATE JS FUNCTIONS '+repr(dup))
          if html.count('</html>') != 1 or html.split('</html>',1)[1].strip(): raise SystemExit('INVALID HTML TRAILING CONTENT')
          required_swift=['TaximetLocationEngine','CLLocationManager','CAPBridgedPlugin','@objc(TaximetLocationPlugin)','public let jsName = "TaximetLocation"','allowsBackgroundLocationUpdates = true','showsBackgroundLocationIndicator = true','pausesLocationUpdatesAutomatically = false','startUpdatingLocation()','startAtLaunch()','recoverIfAuthorized()','requestAlwaysAuthorization()','startTripTracking','pauseTripTracking','resumeTripTracking','finishTripTracking','nativeTripStats','getTripStats','sparseGapThresholdSeconds','maxIntegratedGapSeconds','nativeDistanceM','nativeLastLocation','tripSpeedKey','tripAccuracyKey']
          missing=[x for x in required_swift if x not in swift]
          if missing: raise SystemExit('SWIFT CONTRACT MISSING '+repr(missing))
          if 'requestWhenInUseAuthorization()' in swift: raise SystemExit('WHEN-IN-USE REQUEST MUST NOT BE USED BY NATIVE ENGINE')
          if 'CAP_PLUGIN(' in swift: raise SystemExit('CAP_PLUGIN MACRO NOT ALLOWED')
          required_bridge=['CAPBridgeViewController','capacitorDidLoad','registerPluginInstance','TaximetLocationPlugin()']
          missing=[x for x in required_bridge if x not in bridge]
          if missing: raise SystemExit('BRIDGE CONTRACT MISSING '+repr(missing))
          if any(x in html+swift+bridge for x in ['ActivityKit','TaximetLiveActivity','LiveActivityExtension','TaximetLiveActivityWidget']): raise SystemExit('LIVE ACTIVITY FOUND')
          finish=html[html.index('async function finishTrip(){'):html.index('function pauseTrip(){')]
          if finish.index('nativeTripCall("finishTrip",{})') > finish.index('fareBreakdown(active)'): raise SystemExit('FINISH SNAPSHOT ORDER WRONG')
          print('FINAL SOURCE CONTRACT: PASS')
          PY

      - name: Create Capacitor iOS project
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios

      - name: RESTORE EXACT BASELINE V1 APPICON ASSET CATALOG
        run: |
          set -euo pipefail
          SRC="assets/ios-appiconset"
          DST="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -d "$SRC"
          test -s "$SRC/Contents.json"
          test "$(find "$SRC" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" -eq 12
          rm -rf "$DST"
          mkdir -p "$DST"
          cp -a "$SRC/." "$DST/"
          cmp -s "$SRC/Contents.json" "$DST/Contents.json"
          test "$(find "$DST" -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" -eq 12
          echo 'BASELINE V1 APPICON ASSET CATALOG: RESTORED EXACTLY'

      - name: Install native GPS engine and bridge into Xcode target
        run: |
          set -euo pipefail
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          cp ios-native/TaximetBridgeViewController.swift ios/App/App/Plugins/TaximetLocation/TaximetBridgeViewController.swift
          ruby <<'RUBY'
          require 'xcodeproj'
          project=Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target=project.targets.find{|t|t.name=='App'} || project.targets.first
          raise 'App target not found' unless target
          app_group=project.main_group.children.find{|c|c.respond_to?(:path)&&c.path.to_s=='App'}
          raise 'App group not found' unless app_group
          plugins=app_group.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='Plugins'} || app_group.new_group('Plugins','Plugins')
          gps=plugins.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='TaximetLocation'} || plugins.new_group('TaximetLocation','TaximetLocation')
          %w[TaximetLocationPlugin.swift TaximetBridgeViewController.swift].each do |name|
            ref=gps.files.find{|f|File.basename(f.path.to_s)==name} || gps.new_file(name)
            target.source_build_phase.add_file_reference(ref) unless target.source_build_phase.files.any?{|bf|bf.file_ref==ref}
          end
          project.save
          RUBY
          STORYBOARD=$(find ios/App/App -name 'Main.storyboard' -print -quit)
          test -s "$STORYBOARD"
          export STORYBOARD
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['STORYBOARD']); s=p.read_text(encoding='utf-8')
          if 'TaximetBridgeViewController' not in s:
            old='customClass="CAPBridgeViewController" customModule="Capacitor"'
            if old not in s: raise SystemExit('CAPBridgeViewController storyboard entry not found')
            s=s.replace(old,'customClass="TaximetBridgeViewController" customModule="App"',1)
            p.write_text(s,encoding='utf-8')
          if 'TaximetBridgeViewController' not in p.read_text(encoding='utf-8'): raise SystemExit('BRIDGE STORYBOARD INSTALL FAILED')
          PY

      - name: Start native GPS engine at app launch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift'); s=p.read_text(encoding='utf-8')
          marker='TaximetLocationEngine.shared.startAtLaunch()'
          if marker not in s:
            needles=[
              'override func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {',
              'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
              'func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
            ]
            needle=next((x for x in needles if x in s),None)
            if not needle: raise SystemExit('AppDelegate didFinishLaunching not found')
            s=s.replace(needle,needle+'\n        '+marker,1); p.write_text(s,encoding='utf-8')
          PY

      - name: Configure iOS GPS permissions/background
        run: |
          set -euo pipefail
          PLIST='ios/App/App/Info.plist'
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string CabCalc' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName CabCalc' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string CabCalc' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :CFBundleName CabCalc' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationWhenInUseUsageDescription string CabCalc cần quyền vị trí để nhận GPS.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationWhenInUseUsageDescription CabCalc cần quyền vị trí để nhận GPS.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationAlwaysAndWhenInUseUsageDescription string CabCalc cần quyền vị trí khi ứng dụng chạy nền để ghi nhận quãng đường chuyến xe.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationAlwaysAndWhenInUseUsageDescription CabCalc cần quyền vị trí khi ứng dụng chạy nền để ghi nhận quãng đường chuyến xe.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UIBackgroundModes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string location' "$PLIST"

      - name: VERIFY GENERATED IOS PROJECT BEFORE BUILD
        run: |
          set -euo pipefail
          grep -F 'TaximetLocationPlugin.swift' ios/App/App.xcodeproj/project.pbxproj >/dev/null
          grep -F 'TaximetBridgeViewController.swift' ios/App/App.xcodeproj/project.pbxproj >/dev/null
          grep -F 'TaximetBridgeViewController' "$(find ios/App/App -name 'Main.storyboard' -print -quit)" >/dev/null
          grep -F 'TaximetLocationEngine.shared.startAtLaunch()' ios/App/App/AppDelegate.swift >/dev/null
          test "$(grep -R -l 'class TaximetLocationPlugin' ios/App/App/Plugins/TaximetLocation | wc -l | tr -d ' ')" -eq 1
          test "$(grep -R -l 'class TaximetBridgeViewController' ios/App/App/Plugins/TaximetLocation | wc -l | tr -d ' ')" -eq 1
          test -s ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          test "$(find ios/App/App/Assets.xcassets/AppIcon.appiconset -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')" -eq 12
          cmp -s assets/ios-appiconset/Contents.json ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          echo 'GENERATED IOS PROJECT + BASELINE ASSETS VERIFY: PASS'

      - name: Build unsigned iOS app
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: VERIFY FINAL IPA - HARD FAIL IF NATIVE GPS/APP PACKAGE IS MISSING
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)
          test -n "$APP_PATH"
          test -s "$APP_PATH/App"
          test -s "$APP_PATH/Info.plist"
          test -s "$APP_PATH/Assets.car"
          test -s "$APP_PATH/public/index.html"
          test -d "$APP_PATH/Frameworks/Capacitor.framework"
          grep -a -q 'TaximetLocationPlugin' "$APP_PATH/App"
          grep -a -q 'TaximetLocationEngine' "$APP_PATH/App"
          grep -a -q 'TaximetBridgeViewController' "$APP_PATH/App"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" | grep -q 'location'
          /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' "$APP_PATH/Info.plist" >/dev/null
          UNZIPPED_KB=$(du -sk "$APP_PATH" | awk '{print $1}')
          echo "Final App uncompressed size: ${UNZIPPED_KB} KB"
          echo "--- FINAL APP COMPONENT SIZES ---"
          du -sk "$APP_PATH/App" "$APP_PATH/Assets.car" "$APP_PATH/public/index.html" "$APP_PATH/Frameworks/Capacitor.framework" 2>/dev/null || true
          test -d "$APP_PATH/Frameworks/Capacitor.framework" || { echo 'ERROR: Capacitor.framework missing'; exit 1; }
          test -s "$APP_PATH/Frameworks/Capacitor.framework/Capacitor" || { echo 'ERROR: Capacitor binary missing'; exit 1; }
          test -s "$APP_PATH/public/index.html" || { echo 'ERROR: Web UI missing'; exit 1; }
          test -s "$APP_PATH/Assets.car" || { echo 'ERROR: Assets.car missing'; exit 1; }
          # Safety floor only: generated Capacitor builds can legitimately be smaller than the historical 3.3MB on-disk App.
          # The historical reference IPA is ~1.746MB compressed; package integrity is checked by contents/native symbols below.
          test "$UNZIPPED_KB" -ge 2000 || { echo 'ERROR: final App package is abnormally small; refusing to package IPA'; exit 1; }
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/Payload/CabCalc.app"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -qry "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" Payload
          test -s "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa"
          IPA_BYTES=$(wc -c < "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa")
          echo "Final IPA bytes: $IPA_BYTES"
          # Do not reject a valid IPA solely by compressed ZIP size. Instead verify the
          # historically important uncompressed resources that were lost in the 784/813 KB builds.
          ASSET_KB=$(du -k "$APP_PATH/Assets.car" | awk '{print $1}')
          CAP_KB=$(du -k "$APP_PATH/Frameworks/Capacitor.framework/Capacitor" | awk '{print $1}')
          WEB_KB=$(du -k "$APP_PATH/public/index.html" | awk '{print $1}')
          echo "Final Assets.car: ${ASSET_KB} KB"
          echo "Final Capacitor binary: ${CAP_KB} KB"
          echo "Final Web UI: ${WEB_KB} KB"
          test "$ASSET_KB" -ge 250 || { echo 'ERROR: Assets.car unexpectedly small after restoring exact Baseline V1 AppIcon catalog'; exit 1; }
          test "$CAP_KB" -ge 1000 || { echo 'ERROR: Capacitor.framework binary unexpectedly small'; exit 1; }
          test "$WEB_KB" -ge 100 || { echo 'ERROR: Web UI unexpectedly small'; exit 1; }
          unzip -l "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" | grep -q 'Payload/CabCalc.app/Frameworks/Capacitor.framework/'
          unzip -l "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" | grep -q 'Payload/CabCalc.app/public/index.html'
          unzip -l "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" | grep -q 'Payload/CabCalc.app/Assets.car'
          unzip -l "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" | grep -q 'Payload/CabCalc.app/Frameworks/Capacitor.framework/Capacitor'
          unzip -t "$GITHUB_WORKSPACE/CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa" >/dev/null
          echo 'FINAL IPA NATIVE GPS + BASELINE ASSETS + PACKAGE VERIFY: PASS'

      - name: Upload unsigned IPA
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.14-Baseline-V1-Native-GPS-Bridge-FIX-FINAL-V4
          path: CabCalc_v50.14_BASELINE_V1_NATIVE_GPS_BRIDGE_FIX_FINAL_V4_UNSIGNED.ipa
          if-no-files-found: error
          retention-days: 7
