name: TAXIMET PRO iOS GPS CORE V3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          for item in assets icons manifest.webmanifest sw.js; do
            if [ -e "$item" ]; then
              rm -rf "www/$item"
              cp -R "$item" "www/$item"
            fi
          done
          test -f www/index.html

      - name: Install Capacitor
        run: npm install

      - name: Create iOS project
        run: npx cap add ios

      - name: Sync iOS project
        run: npx cap sync ios

      - name: Copy native GPS source
        run: |
          set -e
          test -f ios-native/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/TaximetLocationPlugin.swift

      - name: Add GPS source to Xcode target
        run: |
          set -e
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'App' }
          abort 'App target not found' unless target

          # Do not depend on the generated PBXGroup name.
          # Add the Swift file directly to the project's main group.
          project.files.select { |f|
            f.path == 'App/TaximetLocationPlugin.swift' ||
            f.path == 'TaximetLocationPlugin.swift'
          }.each do |ref|
            target.source_build_phase.remove_file_reference(ref)
            ref.remove_from_project
          end

          ref = project.main_group.new_file('App/TaximetLocationPlugin.swift')
          target.source_build_phase.add_file_reference(ref)

          project.save
          puts 'GPS Swift source added to App target.'
          RUBY

      - name: Register GPS plugin in ViewController
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("ios/App/App/ViewController.swift"),
              Path("ios/App/App/MainViewController.swift")
          ]

          p = next((x for x in candidates if x.exists()), None)
          if p is None:
              raise SystemExit("No Capacitor view controller found")

          text = p.read_text()

          if "TaximetLocationPlugin()" not in text:
              # Normal Capacitor template:
              # class ViewController: CAPBridgeViewController {}
              pattern = r"class\s+ViewController\s*:\s*CAPBridgeViewController\s*\{\s*\}"

              replacement = """class ViewController: CAPBridgeViewController {
    override func capacitorDidLoad() {
        bridge?.registerPluginInstance(TaximetLocationPlugin())
    }
}"""

              new_text, count = re.subn(pattern, replacement, text, count=1)

              if count == 0:
                  marker = "class ViewController: CAPBridgeViewController"
                  if marker not in text:
                      raise SystemExit("Unexpected ViewController template")

                  start = text.index(marker)
                  brace = text.find("{", start)
                  if brace < 0:
                      raise SystemExit("ViewController class body not found")

                  new_text = (
                      text[:brace + 1]
                      + "\n    override func capacitorDidLoad() {\n"
                      + "        bridge?.registerPluginInstance(TaximetLocationPlugin())\n"
                      + "    }\n"
                      + text[brace + 1:]
                  )

              p.write_text(new_text)

          print("GPS plugin registration:", p)
          PY

      - name: Configure iOS background location
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính tiền taxi theo GPS." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tiếp tục nhận GPS khi chạy nền." "$PLIST"

      - name: Verify native GPS
        run: |
          set -e
          test -f ios/App/App/TaximetLocationPlugin.swift
          grep -q 'App/TaximetLocationPlugin.swift' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'registerPluginInstance(TaximetLocationPlugin())' ios/App/App/ViewController.swift 2>/dev/null || \
            grep -q 'registerPluginInstance(TaximetLocationPlugin())' ios/App/App/MainViewController.swift
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/App/App/Info.plist

      - name: Build unsigned IPA
        run: |
          set -e
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/TAXIMET_PRO.app
          zip -r ../../TAXIMET_PRO_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_GPS_CORE_V3
          path: TAXIMET_PRO_unsigned.ipa
          if-no-files-found: error
