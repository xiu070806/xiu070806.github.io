name: TAXIMET PRO v19.1 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Install npm dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@^7.4.0 @capacitor/ios@^7.4.0 --legacy-peer-deps

      - name: Create iOS project
        run: npx cap add ios

      - name: Prepare web app
        run: |
          mkdir -p www
          cp native-web/index.html www/index.html

      - name: Verify v19.1 native GPS source
        run: |
          test -f ios-native/TaximetLocationPlugin.swift
          test -f ios-native/TaximetLocationPlugin.m
          grep -q "TaximetLocationPlugin" native-web/index.html
          grep -q "getBackgroundLocations" native-web/index.html
          grep -q "setTripActive" native-web/index.html
          grep -q "public func locationManager" ios-native/TaximetLocationPlugin.swift

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install native GPS plugin
        run: |
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.m ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Register native plugin files in Xcode
        run: |
          gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' }
          raise 'App target not found' unless target

          group = project.main_group.groups.find { |g| g.path.to_s == 'App' } ||
                  project.main_group.new_group('App', 'App')

          plugins = group.groups.find { |g| g.name == 'Plugins' } ||
                    group.new_group('Plugins', 'Plugins')

          gps = plugins.groups.find { |g| g.name == 'TaximetLocation' } ||
                plugins.new_group('TaximetLocation', 'Plugins/TaximetLocation')

          [
            ['TaximetLocationPlugin.swift', 'source'],
            ['TaximetLocationPlugin.m', 'source']
          ].each do |filename, _|
            path = "ios/App/App/Plugins/TaximetLocation/#{filename}"
            ref = gps.files.find { |f| f.path == filename } ||
                  gps.new_file(path)
            unless target.source_build_phase.files_references.include?(ref)
              target.add_file_references([ref])
            end
          end

          project.save
          RUBY

      - name: Configure Capacitor plugin registration
        run: |
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m
          grep -q "CAP_PLUGIN(TaximetLocationPlugin" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Configure iOS location permissions
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước." ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để tính cước." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí luôn luôn để tiếp tục tính cước khi chạy nền." ios/App/App/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí luôn luôn để tiếp tục tính cước khi chạy nền." ios/App/App/Info.plist

          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" ios/App/App/Info.plist 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" ios/App/App/Info.plist 2>/dev/null || true

      - name: Install TAXIMET PRO icon
        run: |
          mkdir -p ios/App/App/Assets.xcassets/AppIcon.appiconset
          python <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Path("assets/app-icon/icon-512.png")
          out = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          img = Image.open(src).convert("RGBA")

          sizes = {
              "Icon-60@2x.png": 120,
              "Icon-60@3x.png": 180,
              "Icon-76.png": 76,
              "Icon-76@2x.png": 152,
              "Icon-83.5@2x.png": 167,
              "Icon-1024.png": 1024,
          }
          for name, size in sizes.items():
              img.resize((size, size), Image.Resampling.LANCZOS).save(out / name)

          import json
          contents = {
              "images": [
                  {"filename": n, "idiom": "iphone", "scale": "2x", "size": "60x60"} if n == "Icon-60@2x.png" else
                  {"filename": n, "idiom": "iphone", "scale": "3x", "size": "60x60"} if n == "Icon-60@3x.png" else
                  {"filename": n, "idiom": "ipad", "scale": "1x", "size": "76x76"} if n == "Icon-76.png" else
                  {"filename": n, "idiom": "ipad", "scale": "2x", "size": "76x76"} if n == "Icon-76@2x.png" else
                  {"filename": n, "idiom": "ipad", "scale": "2x", "size": "83.5x83.5"} if n == "Icon-83.5@2x.png" else
                  {"filename": n, "idiom": "ios-marketing", "scale": "1x", "size": "1024x1024"}
                  for n in sizes
              ],
              "info": {"author": "xcode", "version": 1}
          }
          (out / "Contents.json").write_text(json.dumps(contents, indent=2))
          PY

      - name: Build unsigned iOS app
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built App
        run: |
          APP_PATH="ios/App/build/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" "artifacts/Payload/TAXIMET PRO.app"

      - name: Package unsigned IPA
        run: |
          cd artifacts
          zip -qry ../TAXIMET_PRO_v19.1_unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v19.1-iOS
          path: |
            TAXIMET_PRO_v19.1_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
          if-no-files-found: error
          retention-days: 7
