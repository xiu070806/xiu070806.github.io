name: Build TAXIMET PRO Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app/Contents/Developer"
          else
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi
          xcodebuild -version

      - name: Verify repository layout
        run: |
          set -e
          test -f "ios-native/TAXIMET PRO.xcodeproj/project.pbxproj"
          test -f "ios-native/AppDelegate.swift"
          test -f "ios-native/ViewController.swift"
          test -f "ios-native/NativeLocationService.swift"
          test -f "ios-native/Info.plist"
          test -f "ios-native/LaunchScreen.storyboard"
          test -f "ios-native/resources/index.html"

      - name: Show Xcode target
        run: |
          set -e
          xcodebuild \
            -project "ios-native/TAXIMET PRO.xcodeproj" \
            -scheme "TAXIMET PRO" \
            -showBuildSettings \
            | grep -E 'PRODUCT_NAME|PRODUCT_BUNDLE_IDENTIFIER|INFOPLIST_FILE|TARGET_NAME|FULL_PRODUCT_NAME' || true

      - name: Build unsigned app
        run: |
          set -e
          rm -rf build
          xcodebuild \
            -project "ios-native/TAXIMET PRO.xcodeproj" \
            -scheme "TAXIMET PRO" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$PWD/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Locate app
        run: |
          set -e
          APP_DIR="$PWD/build/DerivedData/Build/Products/Release-iphoneos"
          echo "Build products:"
          find "$APP_DIR" -maxdepth 1 -mindepth 1 -print

          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -type d -name 'TAXIMET PRO.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: TAXIMET PRO.app not found."
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e
          rm -rf ipa
          mkdir -p "ipa/Payload"
          cp -R "$APP_PATH" "ipa/Payload/TAXIMET PRO.app"
          cd ipa
          zip -qry "../TAXIMET_PRO_unsigned.ipa" Payload
          cd ..
          test -s "TAXIMET_PRO_unsigned.ipa"
          ls -lh "TAXIMET_PRO_unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_unsigned_ipa
          path: TAXIMET_PRO_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
