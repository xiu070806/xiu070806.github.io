name: TAXIMET PRO iOS GPS CORE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare www
        run: |
          mkdir -p www
          cp index.html www/index.html

          if [ -d assets ]; then
            cp -R assets www/
          fi

          if [ -d icons ]; then
            cp -R icons www/
          fi

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/
          fi

          if [ -f sw.js ]; then
            cp sw.js www/
          fi

      - name: Install
        run: npm install

      - name: Add iOS
        run: npx cap add ios

      - name: Sync iOS
        run: npx cap sync ios

      - name: Install GPS Core
        run: |
          cp ios-native/TaximetLocationPlugin.swift \
             ios/App/App/TaximetLocationPlugin.swift

      - name: Add GPS Swift to Xcode
        run: |
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project = Xcodeproj::Project.open(
            'ios/App/App.xcodeproj'
          )

          target = project.targets.find do |t|
            t.name == 'App'
          end

          abort 'App target not found' unless target

          group = project.main_group.groups.find do |g|
            g.name == 'App'
          end

          abort 'App group not found' unless group

          file = group.new_file(
            'TaximetLocationPlugin.swift'
          )

          target.source_build_phase.add_file_reference(file)

          project.save
          RUBY

      - name: Background GPS
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes array" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :UIBackgroundModes:0 string location" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần GPS để tính tiền taxi." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy \
            -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần GPS khi chạy nền." \
            "$PLIST" 2>/dev/null || true

      - name: Verify
        run: |
          test -f ios/App/App/TaximetLocationPlugin.swift
          test -f ios/App/App.xcworkspace/contents.xcworkspacedata
          echo "GPS CORE READY"

      - name: Build
        run: |
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          cd ios/App

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            Payload/TAXIMET_PRO.app

          zip -r ../../TAXIMET_PRO_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_GPS_CORE
          path: TAXIMET_PRO_unsigned.ipa
