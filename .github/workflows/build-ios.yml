name: TAXIMET PRO iOS Background GPS

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned iOS IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install xcodeproj
        run: gem install xcodeproj --no-document

      - name: Copy native GPS plugin
        run: |
          test -f ios-native/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/TaximetLocationPlugin.swift

      - name: Register native GPS plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [
              Path("ios/App/App/ViewController.swift"),
              Path("ios/App/App/MainViewController.swift")
          ]

          path = next((p for p in candidates if p.exists()), None)
          if path is None:
              raise SystemExit("Capacitor view controller not found")

          text = path.read_text()

          if "TaximetLocationPlugin()" not in text:
              needle = "override func capacitorDidLoad()"

              if needle in text:
                  start = text.find(needle)
                  brace = text.find("{", start)
                  if brace < 0:
                      raise SystemExit("capacitorDidLoad body not found")

                  text = (
                      text[:brace + 1]
                      + "\n        bridge?.registerPluginInstance(TaximetLocationPlugin())\n"
                      + text[brace + 1:]
                  )
              else:
                  text = text.rstrip() + """

    override func capacitorDidLoad() {
        bridge?.registerPluginInstance(TaximetLocationPlugin())
    }
"""

              path.write_text(text + ("" if text.endswith("\n") else "\n"))

          print("Registered native GPS plugin in", path)
          PY

      - name: Configure iOS background location
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính tiền taxi theo GPS." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tiếp tục nhận GPS khi chạy nền." "$PLIST"

      - name: Verify background GPS configuration
        run: |
          test -f ios/App/App/TaximetLocationPlugin.swift
          grep -q "TaximetLocationPlugin.swift" ios/App/App.xcodeproj/project.pbxproj
          grep -R -q "registerPluginInstance(TaximetLocationPlugin())" ios/App/App
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSLocationAlwaysAndWhenInUseUsageDescription" ios/App/App/Info.plist

      - name: Build unsigned iOS
        run: |
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package IPA
        run: |
          cd ios/App
          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/TAXIMET_PRO.app
          /usr/bin/zip -r ../../TAXIMET_PRO_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_unsigned
          path: TAXIMET_PRO_unsigned.ipa
