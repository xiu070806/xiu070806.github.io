name: TAXIMET PRO iOS v25.2 - V14 BASE + Native Background GPS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build TAXIMET PRO iOS v25.2
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install @capacitor/core@^7.4.0
          npm install @capacitor/ios@^7.4.0

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Install V14 web source unchanged except GPS bridge patch
        run: |
          set -e
          test -f native-web/index.html
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html

      - name: Verify V14 web baseline
        run: |
          set -e
          test -f www/index.html
          grep -Fq 'TAXIMET PRO' www/index.html
          grep -Fq 'startTrip' www/index.html
          grep -Fq 'pauseTrip' www/index.html
          grep -Fq 'resumeTrip' www/index.html
          grep -Fq 'finishTrip' www/index.html
          grep -Fq 'fareBreakdown' www/index.html
          grep -Fq 'openPayment' www/index.html
          grep -Fq 'renderDebt' www/index.html
          grep -Fq 'getBackgroundLocations' www/index.html
          grep -Fq 'setTripActive' www/index.html
          grep -Fq 'ackBackgroundLocations' www/index.html

      - name: Capacitor sync iOS
        run: |
          set -e
          npx cap sync ios

      - name: Install native GPS source
        run: |
          set -e
          test -f ios-native/TaximetLocationPlugin.swift
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

      - name: Install native GPS registration
        run: |
          set -e
          cp ios-native/TaximetLocationPlugin.m ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Install xcodeproj
        run: |
          set -e
          sudo gem install xcodeproj --no-document

      - name: Add native GPS plugin to Xcode project
        run: |
          set -e
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' } || project.targets.first
          abort 'ERROR: App target not found' unless target

          app_group = project.main_group.children.find { |child| child.respond_to?(:path) && child.path.to_s == 'App' }
          app_group ||= project.main_group.groups.find { |group| group.path.to_s == 'App' }
          abort 'ERROR: App group not found' unless app_group

          plugins_group = app_group.children.find { |child| child.isa == 'PBXGroup' && child.path.to_s == 'Plugins' }
          plugins_group ||= app_group.new_group('Plugins', 'Plugins')

          taximet_group = plugins_group.children.find { |child| child.isa == 'PBXGroup' && child.path.to_s == 'TaximetLocation' }
          taximet_group ||= plugins_group.new_group('TaximetLocation', 'TaximetLocation')

          swift_path = 'Plugins/TaximetLocation/TaximetLocationPlugin.swift'
          swift_ref = project.files.find { |f| f.path.to_s == swift_path }
          swift_ref ||= taximet_group.new_file('TaximetLocationPlugin.swift')
          unless target.source_build_phase.files.any? { |bf| bf.file_ref == swift_ref }
            target.source_build_phase.add_file_reference(swift_ref)
          end

          objc_path = 'Plugins/TaximetLocation/TaximetLocationPlugin.m'
          objc_ref = project.files.find { |f| f.path.to_s == objc_path }
          objc_ref ||= taximet_group.new_file('TaximetLocationPlugin.m')
          unless target.source_build_phase.files.any? { |bf| bf.file_ref == objc_ref }
            target.source_build_phase.add_file_reference(objc_ref)
          end

          project.save
          puts 'Native GPS plugin registered.'
          puts "Swift: #{swift_ref.path}"
          puts "ObjC:  #{objc_ref.path}"
          RUBY

      - name: Verify Xcode plugin wiring
        run: |
          set -e
          PROJECT=ios/App/App.xcodeproj/project.pbxproj
          SWIFT=ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          OBJC=ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m
          test -f "$SWIFT"
          test -f "$OBJC"
          ! grep -Fq 'ios/App/App/ios/App/App' "$PROJECT"
          grep -Fq 'TaximetLocationPlugin.swift' "$PROJECT"
          grep -Fq 'TaximetLocationPlugin.m' "$PROJECT"
          grep -Fq 'ackBackgroundLocations' "$SWIFT"
          grep -Fq 'CLBackgroundActivitySession' "$SWIFT"
          grep -Fq 'allowsBackgroundLocationUpdates' "$SWIFT"
          grep -Fq 'requestAlwaysAuthorization' "$SWIFT"
          grep -Fq 'synchronize' "$SWIFT"
          grep -Fq 'ackBackgroundLocations' "$OBJC"

      - name: Configure iOS GPS permissions and background mode
        run: |
          set -e
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước theo GPS.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để tính cước theo GPS.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UIBackgroundModes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string location' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$PLIST"

      - name: Install TAXIMET PRO iOS icon
        run: |
          set -euo pipefail
          SRC="assets/app-icon/icon-source.png"
          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          test -f "$SRC"
          rm -rf "$APPICON"
          mkdir -p "$APPICON"
          python3 - "$SRC" "$APPICON" <<'PY'
          import sys
          from pathlib import Path
          from PIL import Image
          src=Path(sys.argv[1])
          dst=Path(sys.argv[2])
          img=Image.open(src).convert("RGBA")
          resample=getattr(Image, "Resampling", Image).LANCZOS
          sizes={
            "icon-20@2x.png":40,"icon-20@3x.png":60,
            "icon-29@2x.png":58,"icon-29@3x.png":87,
            "icon-40@2x.png":80,"icon-40@3x.png":120,
            "icon-60@2x.png":120,"icon-60@3x.png":180,
            "icon-76@2x.png":152,"icon-83.5@2x.png":167,
            "icon-1024.png":1024,
          }
          for name,size in sizes.items():
              out=dst/name
              img.resize((size,size),resample).save(out,format="PNG")
              assert out.is_file() and out.stat().st_size > 0, out
          print("Generated", len(sizes), "iOS icon files")
          PY
          cat > "$APPICON/Contents.json" <<'EOF'
          {"images":[
            {"filename":"icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
            {"filename":"icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
            {"filename":"icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
            {"filename":"icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
            {"filename":"icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
            {"filename":"icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
            {"filename":"icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
            {"filename":"icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
            {"filename":"icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
            {"filename":"icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
            {"filename":"icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          EOF
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json")
          json.loads(p.read_text())
          print("AppIcon Contents.json: OK")
          PY
      - name: Verify final iOS project configuration
        run: |
          set -e
          test -f ios/App/App/Info.plist
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m
          grep -Fq 'NSLocationWhenInUseUsageDescription' ios/App/App/Info.plist
          grep -Fq 'NSLocationAlwaysAndWhenInUseUsageDescription' ios/App/App/Info.plist
          grep -Fq 'UIBackgroundModes' ios/App/App/Info.plist
          grep -Fq 'location' ios/App/App/Info.plist

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            SWIFT_VERSION=5.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ../../xcodebuild-v25.2.log

      - name: Locate built App
        run: |
          set -e
          APP_PATH="$(find ios/App/build -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf artifacts
          mkdir -p 'artifacts/Payload'
          cp -R "$APP_PATH" 'artifacts/Payload/TAXIMET PRO.app'
          cd artifacts
          zip -qry ../TAXIMET_PRO_v25.2_unsigned.ipa Payload
          cd ..
          test -f TAXIMET_PRO_v25.2_unsigned.ipa

      - name: Verify built IPA background GPS
        run: |
          set -e
          rm -rf ipa-check
          mkdir ipa-check
          unzip -q TAXIMET_PRO_v25.2_unsigned.ipa -d ipa-check
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=Path('ipa-check/Payload/TAXIMET PRO.app/Info.plist')
          with p.open('rb') as f: d=plistlib.load(f)
          assert 'location' in d.get('UIBackgroundModes',[]), d.get('UIBackgroundModes')
          assert d.get('NSLocationWhenInUseUsageDescription'), 'missing WhenInUse'
          assert d.get('NSLocationAlwaysAndWhenInUseUsageDescription'), 'missing Always'
          print('IPA background GPS plist: OK')
          PY
          /usr/bin/strings 'ipa-check/Payload/TAXIMET PRO.app/App' | grep -E 'TaximetLocationPlugin|ackBackgroundLocations|startUpdatingLocation|requestAlwaysAuthorization' | head -20 || true

      - name: Upload iOS v25.2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v25.2-iOS
          path: |
            TAXIMET_PRO_v25.2_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
            xcodebuild-v25.2.log
          if-no-files-found: error
          retention-days: 7
