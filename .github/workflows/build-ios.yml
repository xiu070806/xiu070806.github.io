name: Build CabCalc v50.14 FIX6 FINAL4 - Native Background GPS Distance + Fare Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -euo pipefail
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0
          python -m pip install --upgrade pip Pillow
          sudo gem install xcodeproj --no-document

      - name: Verify FIX6 source and background-trip invariants
        run: |
          set -euo pipefail
          test -s native-web/index.html
          test -s ios-native/TaximetLocationPlugin.swift

          EXPECTED_HTML_SHA='94a67a795d355b188a10f9e4c3b44829e93063ee4f842a5352470d485d04f966'
          EXPECTED_SWIFT_SHA='98590b4cd4089fa3d789e8eff353e4cbc658cd094a7a32cc69f65512a2cae224'
          ACTUAL_HTML_SHA="$(shasum -a 256 native-web/index.html | awk '{print $1}')"
          ACTUAL_SWIFT_SHA="$(shasum -a 256 ios-native/TaximetLocationPlugin.swift | awk '{print $1}')"
          echo "HTML expected:  $EXPECTED_HTML_SHA"
          echo "HTML actual:    $ACTUAL_HTML_SHA"
          echo "Swift expected: $EXPECTED_SWIFT_SHA"
          echo "Swift actual:   $ACTUAL_SWIFT_SHA"
          test "$ACTUAL_HTML_SHA" = "$EXPECTED_HTML_SHA"
          test "$ACTUAL_SWIFT_SHA" = "$EXPECTED_SWIFT_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('native-web/index.html').read_text(encoding='utf-8')
          swift=Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')

          required_html=[
            'CabCalc','Smart Ride, Smart Fare','GHI NỢ','HÓA ĐƠN DỊCH VỤ',
            'paymentStateForTrip','paymentStateLabel','paymentStateClass','paymentStateColor',
            'nativeTripCall("startTrip"','nativeTripCall("resumeTrip",{})',
            'nativeTripCall("pauseTrip",{})','nativeTripCall("finishTrip",{})',
            'getTripStats','syncIOSNativeTripOnForeground',
            'v50-13-master-single-scale','--cabcalc-ui-scale',
            'overflow:hidden!important','startBtn','#tripButtons',
            'exportInvoicePNG','exportInvoicePDF'
          ]
          required_swift=[
            'TaximetLocationEngine','CLLocationManager','CAPBridgedPlugin',
            'public let jsName = "TaximetLocation"','allowsBackgroundLocationUpdates = true',
            'pausesLocationUpdatesAutomatically = false','desiredAccuracy = kCLLocationAccuracyBest',
            'distanceFilter = 0.5','activityType = .automotiveNavigation',
            'startUpdatingLocation()','startAtLaunch()','recoverIfAuthorized()',
            'startMonitoringSignificantLocationChanges','nativeTripRunning','nativeTripPaused',
            'nativeDistanceM','nativeLastLocation','nativeNeedsRecoveryAnchor',
            'nativeTripStats','getTripStats','locationManager(',
            'locations','sorted { $0.timestamp < $1.timestamp }','dt > 180.0',
            'delta >= 0.5','integratedSpeedDistance','distanceFilter = 0.5','finishTripTracking() -> [String: Any]',
            'isIdleTimerDisabled','requestAlwaysAuthorization','requestAlwaysIfNeeded'
          ]
          # FIX6 distance contract: do not discard the first background fix just because
          # the app entered background; use native Core Location speed integration only
          # for moderate sparse gaps, and hard-anchor after a genuinely long outage.
          missing=[]
          if 'nativeNeedsRecoveryAnchor = true' in swift:
              missing.append('Swift: background entry still forces a recovery anchor')
          if 'integratedSpeedDistance' not in swift:
              missing.append('Swift: sparse-gap speed integration missing')
          if 'distanceFilter = 0.5' not in swift:
              missing.append('Swift: distanceFilter 0.5m contract missing')
          if 'tripSpeedKey' not in swift or 'tripAccuracyKey' not in swift:
              missing.append('Swift: persisted speed/accuracy recovery state missing')
          if 'requestAlwaysIfNeeded' not in swift or 'requestAlwaysAuthorization()' not in swift:
              missing.append('Swift: Always authorization upgrade path missing')
          if 'allowsBackgroundLocationUpdates = true' not in swift or 'startUpdatingLocation()' not in swift:
              missing.append('Swift: standard background location service missing')
          if 'ActivityKit' in swift or 'TaximetLiveActivity' in swift:
              missing.append('Swift: unexpected Live Activity dependency in FIX6 build')
          missing=[f'HTML: {x}' for x in required_html if x not in html] + [f'Swift: {x}' for x in required_swift if x not in swift] + missing
          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',html)
          dup=sorted({x for x in funcs if funcs.count(x)>1})
          if dup: missing.append('HTML duplicate JS functions: '+repr(dup))
          if html.count('</html>') != 1 or html.split('</html>',1)[1].strip():
              missing.append('HTML trailing content after </html>')
          if missing:
              print('SOURCE VERIFY FAILED')
              print('\n'.join('- '+x for x in missing))
              raise SystemExit(1)
          print('SOURCE VERIFY: PASS - FIX6 background Core Location + chronological distance + speed-integrated sparse background gaps + frozen finish distance + foreground fare catch-up')
          PY

      # UI CONTRACT: native-web/index.html is copied byte-for-byte from the repository.
      # This build never edits, restyles, or replaces the V50.14 FIX5 Trip Button 30% + Recovery Text FINAL UI.
      - name: Prepare web assets
        run: |
          set -euo pipefail
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html
          cmp -s native-web/index.html www/index.html

      - name: Create Capacitor iOS project
        run: |
          set -euo pipefail
          npx cap add ios
          npx cap sync ios

      - name: Configure CabCalc display name and location background mode
        run: |
          set -euo pipefail
          PLIST='ios/App/App/Info.plist'
          /usr/libexec/PlistBuddy -c 'Add :CFBundleDisplayName string CabCalc' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName CabCalc' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string CabCalc' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :CFBundleName CabCalc' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationWhenInUseUsageDescription string CabCalc cần quyền vị trí để nhận GPS.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationWhenInUseUsageDescription CabCalc cần quyền vị trí để nhận GPS.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :NSLocationAlwaysAndWhenInUseUsageDescription string CabCalc cần quyền vị trí khi ứng dụng chạy nền.' "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c 'Set :NSLocationAlwaysAndWhenInUseUsageDescription CabCalc cần quyền vị trí khi ứng dụng chạy nền.' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :UIBackgroundModes' "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes array' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Add :UIBackgroundModes:0 string location' "$PLIST"

      - name: Install CabCalc icon
        run: |
          set -euo pipefail
          SRC='assets/app-icon/icon-512.png'
          APPICON='ios/App/App/Assets.xcassets/AppIcon.appiconset'
          test -s "$SRC" || { echo "ERROR: Missing required source icon: $SRC"; exit 1; }
          python3 - <<'PYICONVERIFY'
          from PIL import Image
          p='assets/app-icon/icon-512.png'
          im=Image.open(p)
          im.load()
          assert im.size == (512,512), f'{p}: {im.size} != (512,512)'
          assert im.mode in ('RGB','RGBA'), f'{p}: unexpected mode {im.mode}'
          print('CAB CALC ICON SOURCE VERIFY: PASS')
          PYICONVERIFY
          rm -rf "$APPICON"
          mkdir -p "$APPICON"
          python3 - <<'PYICON'
          from PIL import Image
          from pathlib import Path
          src=Image.open('assets/app-icon/icon-512.png').convert('RGBA')
          src.load()
          out=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          sizes={
            'Icon-20@2x.png':40,'Icon-20@3x.png':60,
            'Icon-29@2x.png':58,'Icon-29@3x.png':87,
            'Icon-40@2x.png':80,'Icon-40@3x.png':120,
            'Icon-60@2x.png':120,'Icon-60@3x.png':180,
            'Icon-76@1x.png':76,'Icon-76@2x.png':152,
            'Icon-83.5@2x.png':167,'Icon-1024.png':1024
          }
          for name,size in sizes.items():
              img=src.resize((size,size),Image.Resampling.LANCZOS)
              img.save(out/name,'PNG')
          PYICON
          cat > "$APPICON/Contents.json" <<'JSONICON'
          {
            "images" : [
              {"filename":"Icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"Icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"Icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"Icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"Icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"Icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"Icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"Icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"Icon-76@1x.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"Icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"Icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"Icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSONICON
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' ios/App/App/Info.plist >/dev/null 2>&1 || true
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          from PIL import Image
          d=json.loads(Path('ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json').read_text())
          assert len(d['images']) == 12
          for x in d['images']:
              p=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')/x['filename']
              im=Image.open(p); im.load()
              assert im.width == im.height and im.width > 0
          print('CAB CALC APPICONSET VERIFY: PASS')
          PYVERIFY

      - name: Install exact native GPS source
        run: |
          set -euo pipefail
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          ruby - <<'RUBY'
          require 'xcodeproj'
          p='ios/App/App.xcodeproj'; project=Xcodeproj::Project.open(p)
          target=project.targets.find{|t| t.name=='App'} || project.targets.first
          app_group=project.main_group.children.find{|c| c.respond_to?(:path)&&c.path.to_s=='App'}
          plugins=app_group.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='Plugins'} || app_group.new_group('Plugins','Plugins')
          group=plugins.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='TaximetLocation'} || plugins.new_group('TaximetLocation','TaximetLocation')
          ref=group.files.find{|f|File.basename(f.path.to_s)=='TaximetLocationPlugin.swift'} || group.new_file('TaximetLocationPlugin.swift')
          target.source_build_phase.add_file_reference(ref) unless target.source_build_phase.files.any?{|bf|bf.file_ref==ref}
          target.build_configurations.each{|cfg|cfg.build_settings['IPHONEOS_DEPLOYMENT_TARGET']='16.1'}
          project.save
          RUBY

      - name: Inject AppDelegate native GPS startup
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          s=p.read_text()
          if 'TaximetLocationEngine.shared.startAtLaunch()' not in s:
              needles=[
                'override func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {',
                'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
                'func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
              ]
              needle=next((x for x in needles if x in s),None)
              if needle is None: raise SystemExit('AppDelegate launch method not found')
              s=s.replace(needle,needle+chr(10)+'        TaximetLocationEngine.shared.startAtLaunch()',1)
              p.write_text(s)
          PY

      - name: Verify copied sources before Xcode build
        run: |
          set -euo pipefail
          cmp -s native-web/index.html ios/App/App/public/index.html
          cmp -s ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -F 'TaximetLocationEngine.shared.startAtLaunch()' ios/App/App/AppDelegate.swift >/dev/null
          if grep -F '\\n' ios/App/App/AppDelegate.swift >/dev/null; then echo 'ERROR: literal \n found in AppDelegate.swift'; exit 1; fi
          echo 'FINAL SOURCE COPY VERIFY: PASS'

      - name: Validate iOS plist and asset catalog before Xcode build
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSLocationWhenInUseUsageDescription' ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :NSLocationAlwaysAndWhenInUseUsageDescription' ios/App/App/Info.plist
          test -f ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json
          python3 -m json.tool ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json >/dev/null
          echo 'PREBUILD PLIST + APPICON VERIFY: PASS'

      - name: Build unsigned IPA
        id: xcodebuild
        continue-on-error: true
        run: |
          set -u
          cd ios/App
          set +e
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}
          echo "XCODEBUILD_EXIT_CODE=$status"
          echo '--- XCODEBUILD ERRORS ---'
          grep -nEi '(^|[[:space:]])error:|fatal error:|SwiftCompile|CompileAssetCatalog|actool.*error|Command .* failed|BUILD FAILED' xcodebuild.log | tail -120 || true
          echo '--- XCODEBUILD LAST 120 LINES ---'
          tail -120 xcodebuild.log
          exit "$status"

      - name: Upload Xcode failure diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.14-FIX6-FINAL4-XcodeBuild-Diagnostics
          path: ios/App/xcodebuild.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop after Xcode build failure
        if: ${{ steps.xcodebuild.outcome == 'failure' }}
        run: |
          echo 'Xcode build failed. Full xcodebuild.log was uploaded as an artifact.'
          exit 1

      - name: Verify packaged app
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$APP_PATH/Info.plist" | grep -q location
          test -s "$APP_PATH/App"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)"
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/CabCalc.app
          cd artifacts
          zip -qry "$GITHUB_WORKSPACE/CabCalc_v50.14_FIX6_DISTANCE_BACKGROUND_FARE_unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/CabCalc_v50.14_FIX6_DISTANCE_BACKGROUND_FARE_unsigned.ipa"
          unzip -t "$GITHUB_WORKSPACE/CabCalc_v50.14_FIX6_DISTANCE_BACKGROUND_FARE_unsigned.ipa"

      - name: Upload IPA artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc-v50.14-FIX6-FINAL4-Unsigned-IPA
          path: CabCalc_v50.14_FIX6_DISTANCE_BACKGROUND_FARE_unsigned.ipa
          if-no-files-found: error
          retention-days: 7
