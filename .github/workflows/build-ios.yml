name: TAXIMET PRO v19 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build TAXIMET PRO iOS v19
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install @capacitor/core@^7.4.0
          npm install @capacitor/ios@^7.4.0

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Install v19 native web
        run: |
          set -e
          test -f native-web/index.html
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html

      - name: Capacitor sync iOS
        run: |
          set -e
          npx cap sync ios

      - name: Install v19 Swift GPS plugin
        run: |
          set -e
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.m \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

      - name: Install xcodeproj
        run: |
          set -e
          sudo gem install xcodeproj --no-document

      - name: Add GPS plugin to Xcode project
        run: |
          set -e
          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' } || project.targets.first
          abort 'ERROR: App target not found' unless target

          app_group = project.main_group.children.find { |c| c.respond_to?(:path) && c.path.to_s == 'App' }
          app_group ||= project.main_group.groups.find { |g| g.path.to_s == 'App' }
          abort 'ERROR: App group not found' unless app_group

          plugins = app_group.children.find { |c| c.isa == 'PBXGroup' && c.path.to_s == 'Plugins' }
          plugins ||= app_group.new_group('Plugins', 'Plugins')

          group = plugins.children.find { |c| c.isa == 'PBXGroup' && c.path.to_s == 'TaximetLocation' }
          group ||= plugins.new_group('TaximetLocation', 'TaximetLocation')

          {
            'TaximetLocationPlugin.swift' => 'Plugins/TaximetLocation/TaximetLocationPlugin.swift',
            'TaximetLocationPlugin.m' => 'Plugins/TaximetLocation/TaximetLocationPlugin.m'
          }.each do |name, path|
            ref = project.files.find { |f| f.path.to_s == path }
            ref ||= group.new_file(name)

            unless target.source_build_phase.files.any? { |bf| bf.file_ref == ref }
              target.source_build_phase.add_file_reference(ref)
            end
          end

          project.save
          RUBY

      - name: Configure iOS location permissions
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước theo GPS." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần vị trí khi chạy nền để tiếp tục ghi nhận chuyến." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Verify v19 native GPS
        run: |
          set -e
          grep -q "allowsBackgroundLocationUpdates" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "pausesLocationUpdatesAutomatically = false" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "requestAlwaysAuthorization" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "setTripActive" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "getBackgroundLocations" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "clearBackgroundLocations" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "append(" ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -q "UIBackgroundModes" ios/App/App/Info.plist

      - name: Install TAXIMET PRO icon
        run: |
          set -e
          test -f assets/app-icon/icon-512.png
          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          rm -rf "$APPICON"
          mkdir -p "$APPICON"

          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/app-icon/icon-512.png")
          target = Path("ios/App/App/Assets.xcassets/AppIcon.appiconset")
          img = Image.open(source).convert("RGBA")

          sizes = {
              "icon-20@2x.png": 40,
              "icon-20@3x.png": 60,
              "icon-29@2x.png": 58,
              "icon-29@3x.png": 87,
              "icon-40@2x.png": 80,
              "icon-40@3x.png": 120,
              "icon-60@2x.png": 120,
              "icon-60@3x.png": 180,
              "icon-76@2x.png": 152,
              "icon-83.5@2x.png": 167,
              "icon-1024.png": 1024
          }

          for name, size in sizes.items():
              img.resize((size, size), Image.Resampling.LANCZOS).save(target / name, "PNG")
          PY

      - name: Configure AppIcon
        run: |
          set -e
          cat > ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images": [
              {"filename":"icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          EOF

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Locate built App
        run: |
          set -e
          APP_PATH="$(find ios/App/build -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          test -d "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -e
          rm -rf artifacts
          mkdir -p "artifacts/Payload"
          cp -R "$APP_PATH" "artifacts/Payload/TAXIMET PRO.app"
          cd artifacts
          zip -qry ../TAXIMET_PRO_v19_unsigned.ipa Payload
          cd ..
          test -f TAXIMET_PRO_v19_unsigned.ipa
          ls -lh TAXIMET_PRO_v19_unsigned.ipa

      - name: Upload iOS v19 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v19-iOS
          path: |
            TAXIMET_PRO_v19_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
          if-no-files-found: error
          retention-days: 7
