name: TAXIMET PRO iOS GPS CORE V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web assets
        run: |
          set -e
          mkdir -p www
          test -f index.html
          cp index.html www/index.html

          for item in assets icons manifest.webmanifest sw.js; do
            if [ -e "$item" ]; then
              rm -rf "www/$item"
              cp -R "$item" "www/$item"
            fi
          done

      - name: Install dependencies
        run: npm install

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Install GPS Core
        run: |
          set -e
          test -f ios-native/TaximetLocationPlugin.swift
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/TaximetLocationPlugin.swift

      - name: Add GPS Swift to Xcode
        run: |
          set -e
          gem install xcodeproj --no-document

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'App' }
          abort 'App target not found' unless target

          # Find the actual source group used by the generated Capacitor project.
          group = nil

          project.main_group.recursive_children.each do |child|
            next unless child.respond_to?(:path)
            if child.isa == 'PBXGroup' &&
               (child.name == 'App' || child.path == 'App')
              group = child
              break
            end
          end

          # If Capacitor generated no App group, create one.
          unless group
            group = project.main_group.new_group('App', 'App')
          end

          # Remove previous reference if present.
          project.files.select do |f|
            f.path == 'TaximetLocationPlugin.swift'
          end.each do |ref|
            target.source_build_phase.remove_file_reference(ref)
            ref.remove_from_project
          end

          ref = group.new_file('TaximetLocationPlugin.swift')
          target.source_build_phase.add_file_reference(ref)

          project.save
          puts "GPS Swift added to target #{target.name}"
          puts "Group: #{group.display_name}"
          RUBY

      - name: Register GPS plugin
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          candidates = [
              Path("ios/App/App/ViewController.swift"),
              Path("ios/App/App/MainViewController.swift")
          ]

          controller = next((p for p in candidates if p.exists()), None)
          if controller is None:
              raise SystemExit("Capacitor view controller not found")

          text = controller.read_text()

          registration = "bridge?.registerPluginInstance(TaximetLocationPlugin())"

          if registration not in text:
              marker = "override func capacitorDidLoad()"

              if marker in text:
                  start = text.index(marker)
                  brace = text.index("{", start)
                  text = (
                      text[:brace + 1]
                      + "\n        " + registration + "\n"
                      + text[brace + 1:]
                  )
              else:
                  text = text.rstrip() + """

    override func capacitorDidLoad() {
        bridge?.registerPluginInstance(TaximetLocationPlugin())
    }
"""

              controller.write_text(text + ("" if text.endswith("\n") else "\n"))

          print("GPS plugin registered:", controller)
          PY

      - name: Configure background location
        run: |
          set -e
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần GPS để tính tiền taxi." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :NSLocationAlwaysAndWhenInUseUsageDescription" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần GPS khi chạy nền." "$PLIST"

      - name: Verify
        run: |
          set -e
          test -f ios/App/App/TaximetLocationPlugin.swift
          grep -q "TaximetLocationPlugin.swift" ios/App/App.xcodeproj/project.pbxproj
          grep -R -q "registerPluginInstance(TaximetLocationPlugin())" ios/App/App
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/App/App/Info.plist
          echo "GPS CORE V2 READY"

      - name: Build unsigned IPA
        run: |
          set -e
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          rm -rf Payload
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/TAXIMET_PRO.app
          zip -r ../../TAXIMET_PRO_unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_GPS_CORE_V2
          path: TAXIMET_PRO_unsigned.ipa
          if-no-files-found: error
