name: CabCalc v50.14 - Baseline V1 Native GPS + iOS Native Invoice Share

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout baseline repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Pin Capacitor 7.4.0 without recreating the iOS project
        run: |
          set -euo pipefail
          test -d ios/App || { echo 'BASELINE iOS PROJECT MISSING'; exit 1; }
          test -f package.json || { echo 'package.json missing'; exit 1; }
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/ios@7.4.0
          npm install --save-dev --save-exact @capacitor/cli@7.4.0

      - name: Install baseline web source
        run: |
          set -euo pipefail
          test -s index.html
          mkdir -p www
          cp index.html www/index.html
          cmp -s index.html www/index.html

      - name: Install native GPS + native invoice share bridge
        run: |
          set -euo pipefail
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          cp ios-native/TaximetBridgeViewController.swift ios/App/App/Plugins/TaximetLocation/TaximetBridgeViewController.swift
          ruby <<'RUBY'
          require 'xcodeproj'
          project=Xcodeproj::Project.open('ios/App/App.xcodeproj')
          target=project.targets.find{|t|t.name=='App'} || project.targets.first
          raise 'App target not found' unless target
          app_group=project.main_group.children.find{|c|c.respond_to?(:path)&&c.path.to_s=='App'}
          raise 'App group not found' unless app_group
          plugins=app_group.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='Plugins'} || app_group.new_group('Plugins','Plugins')
          gps=plugins.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='TaximetLocation'} || plugins.new_group('TaximetLocation','TaximetLocation')
          %w[TaximetLocationPlugin.swift TaximetBridgeViewController.swift].each do |name|
            ref=gps.files.find{|f|File.basename(f.path.to_s)==name} || gps.new_file(name)
            target.source_build_phase.add_file_reference(ref) unless target.source_build_phase.files.any?{|bf|bf.file_ref==ref}
          end
          # Keep the baseline asset catalog; only pin the existing AppIcon set name.
          target.build_configurations.each do |cfg|
            cfg.build_settings['ASSETCATALOG_COMPILER_APPICON_NAME']='AppIcon'
          end
          project.save
          RUBY

      - name: Install custom Capacitor bridge controller in existing storyboard
        run: |
          set -euo pipefail
          STORYBOARD=$(find ios/App/App -name 'Main.storyboard' -print -quit)
          test -s "$STORYBOARD"
          export STORYBOARD
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['STORYBOARD'])
          s=p.read_text(encoding='utf-8')
          if 'TaximetBridgeViewController' not in s:
            old='customClass="CAPBridgeViewController" customModule="Capacitor"'
            if old not in s:
              raise SystemExit('CAPBridgeViewController storyboard entry not found')
            s=s.replace(old,'customClass="TaximetBridgeViewController" customModule="App"',1)
            p.write_text(s,encoding='utf-8')
          if 'TaximetBridgeViewController' not in p.read_text(encoding='utf-8'):
            raise SystemExit('BRIDGE STORYBOARD INSTALL FAILED')
          PY

      - name: Inject native GPS launch hook
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          s=p.read_text(encoding='utf-8')
          marker='TaximetLocationEngine.shared.startAtLaunch()'
          if marker not in s:
            needles=[
              'override func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {',
              'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
              'func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
            ]
            needle=next((n for n in needles if n in s),None)
            if not needle: raise SystemExit('AppDelegate didFinishLaunching not found')
            s=s.replace(needle,needle+'\n        TaximetLocationEngine.shared.startAtLaunch()',1)
            p.write_text(s,encoding='utf-8')
          PY

      - name: Verify baseline preservation + share bridge contract
        run: |
          set -euo pipefail
          test -s www/index.html
          test -s ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          test -s ios/App/App/Plugins/TaximetLocation/TaximetBridgeViewController.swift
          grep -F 'beginShareBase64' ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift >/dev/null
          grep -F 'appendShareBase64' ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift >/dev/null
          grep -F 'finishShareBase64' ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift >/dev/null
          grep -F 'UIActivityViewController' ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift >/dev/null
          grep -F 'iosShareBlob' www/index.html >/dev/null
          grep -F 'isNativeIOSTaximet(){await iosShareBlob' www/index.html >/dev/null
          grep -F 'TaximetLocationEngine.shared.startAtLaunch()' ios/App/App/AppDelegate.swift >/dev/null
          test -d ios/App/App/Assets.xcassets
          test -d ios/App/App/Assets.xcassets/AppIcon.appiconset
          grep -F 'ASSETCATALOG_COMPILER_APPICON_NAME' ios/App/App.xcodeproj/project.pbxproj >/dev/null
          if grep -Eq 'LiveActivity|ActivityAttributes|ActivityConfiguration' www/index.html ios/App/App/Plugins/TaximetLocation/*.swift; then echo 'UNEXPECTED LIVE ACTIVITY'; exit 1; fi
          python3 - <<'PY'
          from pathlib import Path
          h=Path('www/index.html').read_text(encoding='utf-8')
          if h.count('</html>') != 1: raise SystemExit('INVALID HTML')
          for token in ['exportInvoicePNG','exportInvoicePDF','exportDebtPNG','exportDebtPDF','invoiceShareChooser','debtShareChooserFromCurrent','paymentStateForTrip','HÓA ĐƠN DỊCH VỤ']:
            if token not in h: raise SystemExit('Missing '+token)
          print('SOURCE VERIFY: PASS')
          PY

      - name: Build unsigned iOS app from existing baseline project
        run: |
          set -euo pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package and verify IPA payload
        run: |
          set -euo pipefail
          mkdir -p artifacts/Payload
          APP_PATH=$(find ios/App/build/Build/Products/Release-iphoneos -maxdepth 1 -name 'App.app' -print -quit)
          test -d "$APP_PATH"
          cp -a "$APP_PATH" artifacts/Payload/CabCalc.app
          test -s artifacts/Payload/CabCalc.app/Assets.car
          test -s artifacts/Payload/CabCalc.app/public/index.html || test -s artifacts/Payload/CabCalc.app/index.html
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' artifacts/Payload/CabCalc.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' artifacts/Payload/CabCalc.app/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' artifacts/Payload/CabCalc.app/Info.plist
          (cd artifacts && zip -qry CabCalc_V50.14_NATIVE_GPS_NATIVE_SHARE_UNSIGNED.ipa Payload)
          unzip -t artifacts/CabCalc_V50.14_NATIVE_GPS_NATIVE_SHARE_UNSIGNED.ipa >/dev/null
          echo 'IPA PACKAGE VERIFY: PASS'

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CabCalc_V50.14_NATIVE_GPS_NATIVE_SHARE_UNSIGNED
          path: artifacts/CabCalc_V50.14_NATIVE_GPS_NATIVE_SHARE_UNSIGNED.ipa
          if-no-files-found: error
