name: Build TAXIMET PRO v24 GPS ENGINE - 1 Device FINAL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0
          python -m pip install --upgrade pip Pillow
          sudo gem install xcodeproj --no-document

      - name: Verify source files and native iOS GPS contract
        run: |
          set -e
          test -s native-web/index.html
          test -s ios-native/TaximetLocationPlugin.swift
          echo '===== native-web/index.html ====='
          wc -c native-web/index.html
          echo '===== Swift ====='
          wc -c ios-native/TaximetLocationPlugin.swift

          python3 - <<'PYCODE'
          from pathlib import Path
          import re

          html = Path('native-web/index.html').read_text(encoding='utf-8')
          swift = Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')

          # Structural checks only: do not pin file size, hashes, or old version comments.
          required_html = [
              'isNativeIOSTaximet',
              'registerPlugin("TaximetLocation")',
              'native.addListener("locationUpdate"',
              'native.addListener("locationError"',
              'native.status()',
              'native.getLastLocation()',
              'startNativeGpsAtLaunch',
              'addressProvider',
              'OpenStreetMap — Miễn phí',
              'Google Maps API — Có phí',
              'nominatim.openstreetmap.org/reverse',
              'maps.googleapis.com/maps/api/geocode/json',
              'reverseGeocode(p,'pickup')',
              'reverseGeocode(active.dropoff,"dropoff")',
          ]
          for marker in required_html:
              if marker not in html:
                  raise SystemExit(f'Missing HTML marker: {marker}')

          # Removed feature contract: no DR/GAP/Hybrid/Google Routes code remains.
          forbidden = [
              'routes.googleapis.com',
              'computeRoutes',
              'resolveGap',
              'drAccrueUntil',
              'gapLedger',
              'drFactor',
              'Google Routes',
              'DR factor',
              'Gap ledger',
          ]
          for marker in forbidden:
              if marker.lower() in html.lower():
                  raise SystemExit(f'Forbidden removed-feature marker still present: {marker}')

          # Function declarations must be unique. Local const/let names are intentionally
          # ignored because they are valid in separate function scopes.
          funcs = re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', html)
          dup = sorted({x for x in funcs if funcs.count(x) > 1})
          if dup:
              raise SystemExit('Duplicate function declarations: ' + ', '.join(dup))

          # Reverse geocoding is intentionally limited to pickup and drop-off triggers.
          app_code = html.split('function selfTest(){', 1)[0]
          decls = re.findall(r'\b(?:async\s+)?function\s+reverseGeocode\s*\(', app_code)
          if len(decls) != 1:
              raise SystemExit(f'Unexpected reverseGeocode declaration count: {len(decls)}')
          if app_code.count("reverseGeocode(p,'pickup')") != 1:
              raise SystemExit('Pickup reverse-geocode trigger is not exactly once')
          if app_code.count('reverseGeocode(active.dropoff,\"dropoff\")') != 1:
              raise SystemExit('Drop-off reverse-geocode trigger is not exactly once')
          calls = 3  # one declaration + exactly two trip triggers

          # Ensure only the selected provider is used and Google is not silently used as fallback.
          if 'provider==="GOOGLE"' not in html or 'provider==="GOOGLE"?j.results?.[0]?.formatted_address:j.display_name' not in html:
              raise SystemExit('Provider selection contract missing')

          swift_required = [
              'TaximetLocationEngine',
              'CLLocationManager',
              'allowsBackgroundLocationUpdates = true',
              'showsBackgroundLocationIndicator = true',
              'pausesLocationUpdatesAutomatically = false',
              'startUpdatingLocation()',
              'startAtLaunch()',
          ]
          for marker in swift_required:
              if marker not in swift:
                  raise SystemExit(f'Missing Swift GPS marker: {marker}')

          if len(re.findall(r'func\s+locationManagerDidChangeAuthorization\s*\(', swift)) != 1:
              raise SystemExit('Swift authorization callback count is not exactly 1')

          print('SOURCE CONTRACT: PASS')
          print('HTML bytes:', len(html.encode('utf-8')))
          print('Swift bytes:', len(swift.encode('utf-8')))
          print('Unique JS function declarations:', len(set(funcs)))
          print('Reverse-geocode declaration+trip calls:', len(calls))
          PYCODE

          echo 'SOURCE PRECHECK: PASS'

      - name: Prepare Capacitor web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html
          test -s www/index.html

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Sync Capacitor iOS project
        run: |
          set -e
          npx cap sync ios

      - name: Install v24 native GPS plugin AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift \
             ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          cat > ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m <<'OBJC'
          #import <Foundation/Foundation.h>
          #import <Capacitor/Capacitor.h>

          CAP_PLUGIN(TaximetLocationPlugin, "TaximetLocation",
            CAP_PLUGIN_METHOD(start, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(stop, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(getLastLocation, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(status, CAPPluginReturnPromise);
          )
          OBJC

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' } || project.targets.first
          raise 'App target not found' unless target

          app_group = project.main_group.children.find do |child|
            child.respond_to?(:path) && child.path.to_s == 'App'
          end
          raise 'App group not found' unless app_group

          plugins_group = app_group.children.find do |child|
            child.isa == 'PBXGroup' && child.path.to_s == 'Plugins'
          end
          plugins_group ||= app_group.new_group('Plugins', 'Plugins')

          taximet_group = plugins_group.children.find do |child|
            child.isa == 'PBXGroup' && child.path.to_s == 'TaximetLocation'
          end
          taximet_group ||= plugins_group.new_group('TaximetLocation', 'TaximetLocation')

          swift_name = 'TaximetLocationPlugin.swift'
          objc_name  = 'TaximetLocationPlugin.m'

          swift_ref = taximet_group.files.find { |f| File.basename(f.path.to_s) == swift_name }
          swift_ref ||= taximet_group.new_file(swift_name)

          objc_ref = taximet_group.files.find { |f| File.basename(f.path.to_s) == objc_name }
          objc_ref ||= taximet_group.new_file(objc_name)

          target.source_build_phase.add_file_reference(swift_ref) unless target.source_build_phase.files.any? { |bf| bf.file_ref == swift_ref }
          target.source_build_phase.add_file_reference(objc_ref) unless target.source_build_phase.files.any? { |bf| bf.file_ref == objc_ref }

          project.save
          RUBY

          # Native bootstrap: start the app-level GPS engine from AppDelegate,
          # before the WebView/JavaScript layer is involved.
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = list(Path('ios/App/App').glob('AppDelegate.swift'))
          if not candidates:
              raise SystemExit('AppDelegate.swift not found')
          p = candidates[0]
          s = p.read_text(encoding='utf-8')

          if 'TaximetLocationEngine.shared.startAtLaunch()' not in s:
              marker = 'import Capacitor'
              if marker not in s:
                  raise SystemExit('import Capacitor not found in AppDelegate.swift')
              s = s.replace(marker, marker + '\nimport CoreLocation', 1)

              pattern = r'(func application\(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: \[UIApplication\.LaunchOptionsKey: Any\]\?\) -> Bool \{)'
              replacement = r'\1\n        TaximetLocationEngine.shared.startAtLaunch()'
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('didFinishLaunchingWithOptions not found in AppDelegate.swift')

              p.write_text(s, encoding='utf-8')
          PY

      - name: Install v24 web asset AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/public
          cp native-web/index.html ios/App/App/public/index.html
          test -s ios/App/App/public/index.html

      - name: Configure iOS location permissions and background mode
        run: |
          set -e
          PLIST='ios/App/App/Info.plist'

          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Install app icon
        run: |
          set -e
          APPICON='ios/App/App/Assets.xcassets/AppIcon.appiconset'
          rm -rf "$APPICON"
          mkdir -p "$APPICON"

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('assets/app-icon/icon-512.png').convert('RGBA')
          out=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          sizes={
              'Icon-20@2x.png':40,'Icon-20@3x.png':60,
              'Icon-29@2x.png':58,'Icon-29@3x.png':87,
              'Icon-40@2x.png':80,'Icon-40@3x.png':120,
              'Icon-60@2x.png':120,'Icon-60@3x.png':180,
              'Icon-76@1x.png':76,'Icon-76@2x.png':152,
              'Icon-83.5@2x.png':167,'Icon-1024.png':1024
          }
          for name,size in sizes.items():
              src.resize((size,size),Image.Resampling.LANCZOS).save(out/name,'PNG')
          PY

          cat > "$APPICON/Contents.json" <<'JSON'
          {
            "images" : [
              {"filename":"Icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"Icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"Icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"Icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"Icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"Icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"Icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"Icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"Icon-76@1x.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"Icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"Icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"Icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON

      - name: HARD VERIFY final native iOS sources
        run: |
          set -e
          test -f ios/App/App/public/index.html
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

          cmp -s native-web/index.html ios/App/App/public/index.html
          cmp -s ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          html=Path('ios/App/App/public/index.html').read_text(encoding='utf-8')
          swift=Path('ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift').read_text(encoding='utf-8')

          for marker in [
              'isNativeIOSTaximet','registerPlugin("TaximetLocation")',
              'startNativeGpsAtLaunch','nominatim.openstreetmap.org/reverse',
              'maps.googleapis.com/maps/api/geocode/json',
              'OpenStreetMap — Miễn phí','Google Maps API — Có phí'
          ]:
              assert marker in html, f'Missing final HTML marker: {marker}'

          for marker in ['routes.googleapis.com','computeRoutes','resolveGap','drAccrueUntil','gapLedger','drFactor']:
              assert marker.lower() not in html.lower(), f'Removed feature remains: {marker}'

          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',html)
          assert len(funcs)==len(set(funcs)), 'Duplicate JS function declaration found'
          assert len(re.findall(r'func\s+locationManagerDidChangeAuthorization\s*\(',swift))==1, 'Duplicate Swift auth callback'
          assert 'TaximetLocationEngine.shared.startAtLaunch()' in Path('ios/App/App/AppDelegate.swift').read_text(encoding='utf-8')
          print('HARD VERIFY: PASS')
          PYCODE

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios/App
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="$(find ios/App/build -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"
          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" 'artifacts/Payload/TAXIMET PRO.app'
          cd artifacts
          zip -qry ../TAXIMET_PRO_v24_GPS_ENGINE_unsigned.ipa Payload

      - name: Verify packaged IPA label
        run: |
          set -e
          test -s TAXIMET_PRO_v24_GPS_ENGINE_unsigned.ipa
          unzip -l TAXIMET_PRO_v24_GPS_ENGINE_unsigned.ipa | grep -q 'TAXIMET PRO.app/'
          echo 'V24 IPA PACKAGE: PASS'

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v24-GPS-ENGINE-GPS-1-Device-Unsigned
          path: TAXIMET_PRO_v24_GPS_ENGINE_unsigned.ipa
          retention-days: 7
