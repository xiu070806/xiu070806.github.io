name: Build TAXIMET PRO v50.13 - Payment Color Sync + Live Activity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0
          python -m pip install --upgrade pip Pillow
          sudo gem install xcodeproj --no-document

      - name: VERIFY EXACT FINAL SOURCE FILES
        run: |
          set -e
          test -s native-web/index.html
          test -s ios-native/TaximetLocationPlugin.swift

          EXPECTED_HTML_SHA='7c7cf87d02687ea6a8e01770537a2ca8137088dd4e982ea7f93b2fca3bbcfac1'
          EXPECTED_SWIFT_SHA='066d9554b96d9144f33f139ce3ce2a51ce1952ed4806f17c7841e02c05f349ee'

          ACTUAL_HTML_SHA="$(shasum -a 256 native-web/index.html | awk '{print $1}')"
          ACTUAL_SWIFT_SHA="$(shasum -a 256 ios-native/TaximetLocationPlugin.swift | awk '{print $1}')"

          echo "HTML expected:  $EXPECTED_HTML_SHA"
          echo "HTML actual:    $ACTUAL_HTML_SHA"
          echo "Swift expected: $EXPECTED_SWIFT_SHA"
          echo "Swift actual:   $ACTUAL_SWIFT_SHA"

          test "$ACTUAL_HTML_SHA" = "$EXPECTED_HTML_SHA"
          test "$ACTUAL_SWIFT_SHA" = "$EXPECTED_SWIFT_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('native-web/index.html').read_text(encoding='utf-8')
          swift=Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')
          for marker in ['startTripTracking','pauseTripTracking','resumeTripTracking','finishTripTracking','nativeNeedsRecoveryAnchor','UserDefaults.standard']:
              if marker not in swift:
                  print('MISSING SWIFT MARKER:', marker); raise SystemExit(1)

          required_html=[
            'v47-metric-accents',
            'v50-13-master-single-scale',
            'GHI NỢ',
            'HÓA ĐƠN DỊCH VỤ',
            'CHI TIẾT CÁC CHUYẾN',
            'TAXIMET_PRO_DB',
            'history',
            'debts',
            'flushPersistentStorage',
            'initTaximetPersistentStorage',
            'taximet_idb_migration_v2',
            'updateLiveActivity',
            'v50.13-live-activity',
          ]
          missing=[m for m in required_html if m not in html]
          if missing:
              print('MISSING HTML MARKERS:', missing)
              raise SystemExit(1)

          forbidden=['routes.googleapis.com','computeRoutes','resolveGap','drAccrueUntil','gapLedger','drFactor']
          bad=[m for m in forbidden if m.lower() in html.lower()]
          if bad:
              print('FORBIDDEN MARKERS:', bad)
              raise SystemExit(1)

          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',html)
          dup=sorted({x for x in funcs if funcs.count(x)>1})
          if dup:
              print('DUPLICATE JS FUNCTIONS:',dup)
              raise SystemExit(1)

          required_swift=[
            'TaximetLocationEngine',
            'CLLocationManager',
            'CAPBridgedPlugin',
            'public let jsName = "TaximetLocation"',
            'pluginMethods:',
            'allowsBackgroundLocationUpdates = true',
            'showsBackgroundLocationIndicator = true',
            'pausesLocationUpdatesAutomatically = false',
            'startUpdatingLocation()',
            'startAtLaunch()',
            'recoverIfAuthorized()',
            'gpsStatus',
            'setKeepAwake',
            'isIdleTimerDisabled',
            'TaximetLiveActivityManager',
            'TaximetLiveActivityAttributes',
            'ActivityKit',
          ]
          missing_swift=[m for m in required_swift if m not in swift]
          if missing_swift:
              print('MISSING SWIFT MARKERS:', missing_swift)
              raise SystemExit(1)

          assert len(re.findall(r'func\s+locationManagerDidChangeAuthorization\s*\(',swift))==1
          assert len(re.findall(r'public\s+func\s+requestAlwaysAuthorization\s*\(',swift))==1
          assert 'CAP_PLUGIN(' not in swift
          print('SOURCE VERIFY: PASS')
          PY

      - name: Prepare Capacitor web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html
          cmp -s native-web/index.html www/index.html

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Sync Capacitor iOS project
        run: |
          set -e
          npx cap sync ios

      - name: Install app icon
        run: |
          set -euo pipefail
          SRC='assets/app-icon/icon-512.png'
          APPICON='ios/App/App/Assets.xcassets/AppIcon.appiconset'
          test -s "$SRC" || { echo "ERROR: Missing required source icon: $SRC"; exit 1; }
          rm -rf "$APPICON"
          mkdir -p "$APPICON"

          python3 - <<'PYICON'
          from PIL import Image
          from pathlib import Path
          src=Image.open('assets/app-icon/icon-512.png').convert('RGBA')
          out=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          sizes={
            'Icon-20@2x.png':40,'Icon-20@3x.png':60,
            'Icon-29@2x.png':58,'Icon-29@3x.png':87,
            'Icon-40@2x.png':80,'Icon-40@3x.png':120,
            'Icon-60@2x.png':120,'Icon-60@3x.png':180,
            'Icon-76@1x.png':76,'Icon-76@2x.png':152,
            'Icon-83.5@2x.png':167,'Icon-1024.png':1024
          }
          for name,size in sizes.items():
              src.resize((size,size),Image.Resampling.LANCZOS).save(out/name,'PNG')
          PYICON

          cat > "$APPICON/Contents.json" <<'JSONICON'
          {
            "images" : [
              {"filename":"Icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"Icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"Icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"Icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"Icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"Icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"Icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"Icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"Icon-76@1x.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"Icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"Icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"Icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSONICON
          test -s "$APPICON/Contents.json"
          test "$(find "$APPICON" -name '*.png' | wc -l | tr -d ' ')" -eq 12

      - name: Install native GPS plugin AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          ruby <<'RUBY'
          require 'xcodeproj'
          project_path='ios/App/App.xcodeproj'
          project=Xcodeproj::Project.open(project_path)
          target=project.targets.find{|t|t.name=='App'} || project.targets.first
          raise 'App target not found' unless target
          app_group=project.main_group.children.find{|c|c.respond_to?(:path) && c.path.to_s=='App'}
          raise 'App group not found' unless app_group
          plugins_group=app_group.children.find{|c|c.isa=='PBXGroup' && c.path.to_s=='Plugins'}
          plugins_group ||= app_group.new_group('Plugins','Plugins')
          taximet_group=plugins_group.children.find{|c|c.isa=='PBXGroup' && c.path.to_s=='TaximetLocation'}
          taximet_group ||= plugins_group.new_group('TaximetLocation','TaximetLocation')
          swift_name='TaximetLocationPlugin.swift'
          swift_ref=taximet_group.files.find{|f|File.basename(f.path.to_s)==swift_name}
          swift_ref ||= taximet_group.new_file(swift_name)
          target.source_build_phase.add_file_reference(swift_ref) unless target.source_build_phase.files.any?{|bf|bf.file_ref==swift_ref}
          project.save
          RUBY

      - name: Install TAXIMET PRO Live Activity extension
        run: |
          set -euo pipefail
          mkdir -p ios/App/App/TaximetLiveActivity
          cp ios-native/TaximetLiveActivityAttributes.swift ios/App/App/TaximetLiveActivity/TaximetLiveActivityAttributes.swift
          cp ios-native/TaximetLiveActivityWidget.swift ios/App/App/TaximetLiveActivity/TaximetLiveActivityWidget.swift
          cp ios-native/TaximetLiveActivity-Info.plist ios/App/App/TaximetLiveActivity/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSupportsLiveActivities bool true" ios/App/App/Info.plist 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSSupportsLiveActivities true" ios/App/App/Info.plist
          ruby <<'RUBY'
          require 'xcodeproj'
          p='ios/App/App.xcodeproj'; project=Xcodeproj::Project.open(p)
          app=project.targets.find{|t|t.name=='App'} || project.targets.first
          app.build_configurations.each{|cfg| cfg.build_settings['IPHONEOS_DEPLOYMENT_TARGET']='16.1'}
          app_group=project.main_group.children.find{|c|c.respond_to?(:path)&&c.path.to_s=='App'}
          group=app_group.children.find{|c|c.isa=='PBXGroup'&&c.path.to_s=='TaximetLiveActivity'} || app_group.new_group('TaximetLiveActivity','TaximetLiveActivity')
          attrs=group.files.find{|f|File.basename(f.path.to_s)=='TaximetLiveActivityAttributes.swift'} || group.new_file('TaximetLiveActivityAttributes.swift')
          widget=group.files.find{|f|File.basename(f.path.to_s)=='TaximetLiveActivityWidget.swift'} || group.new_file('TaximetLiveActivityWidget.swift')
          app.source_build_phase.add_file_reference(attrs) unless app.source_build_phase.files.any?{|bf|bf.file_ref==attrs}
          ext=project.targets.find{|t|t.name=='TaximetLiveActivityExtension'}
          unless ext
            ext=project.new_target(:app_extension,'TaximetLiveActivityExtension',:ios,'16.1')
          end

          # Normalize the extension target as a real WidgetKit app-extension.
          # Explicit product/executable settings avoid Xcode interpreting the .appex
          # bundle itself as the linker output (which causes "Multiple commands produce").
          ext.product_type='com.apple.product-type.app-extension'
          ext.product_name='TaximetLiveActivityExtension'
          ext.product_reference.name='TaximetLiveActivityExtension.appex' if ext.product_reference

          # Keep only the two Swift sources in the extension's compile phase.
          [attrs,widget].each do |r|
            ext.source_build_phase.add_file_reference(r) unless ext.source_build_phase.files.any?{|bf|bf.file_ref==r}
          end

          ext.build_configurations.each do |cfg|
            bs=cfg.build_settings
            bs['PRODUCT_NAME']='TaximetLiveActivityExtension'
            bs['EXECUTABLE_NAME']='TaximetLiveActivityExtension'
            bs['WRAPPER_EXTENSION']='appex'
            bs['SWIFT_VERSION']='5.0'
            bs['IPHONEOS_DEPLOYMENT_TARGET']='16.1'
            bs['TARGETED_DEVICE_FAMILY']='1,2'
            bs['APPLICATION_EXTENSION_API_ONLY']='YES'
            bs['INFOPLIST_FILE']='App/TaximetLiveActivity/Info.plist'
            bs['SKIP_INSTALL']='YES'
            bs['GENERATE_INFOPLIST_FILE']='NO'
            ac=app.build_configurations.find{|c|c.name==cfg.name}
            bundle=ac&.build_settings&.[]('PRODUCT_BUNDLE_IDENTIFIER') || 'com.taximetpro.app'
            bs['PRODUCT_BUNDLE_IDENTIFIER']="#{bundle}.TaximetLiveActivity"
          end

          # Ensure the app embeds the extension exactly once.
          app.dependencies.reject!{|d|d.target==ext}
          app.add_dependency(ext)
          embed=app.copy_files_build_phases.find{|ph|ph.name=='Embed App Extensions'} || app.new_copy_files_build_phase('Embed App Extensions')
          embed.dst_subfolder_spec='13'
          embed.dst_path=''
          embed.files.reject!{|bf|bf.file_ref==ext.product_reference}
          embed.add_file_reference(ext.product_reference,true)
          project.save
          RUBY
          test -s ios/App/App/TaximetLiveActivity/TaximetLiveActivityAttributes.swift
          test -s ios/App/App/TaximetLiveActivity/TaximetLiveActivityWidget.swift
          echo 'LIVE ACTIVITY EXTENSION INSTALL: PASS'

      - name: Install final web asset AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/public
          cp native-web/index.html ios/App/App/public/index.html

      - name: Configure iOS location permissions and background mode
        run: |
          set -e
          PLIST='ios/App/App/Info.plist'
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Inject native GPS engine into AppDelegate
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          s=p.read_text()
          if 'TaximetLocationEngine.shared.startAtLaunch()' not in s:
              needles=[
                  'override func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {',
                  'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
                  'func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
              ]
              needle=next((n for n in needles if n in s), None)
              if needle is None: raise SystemExit('AppDelegate didFinishLaunching not found')
              s=s.replace(needle,needle+'\n        TaximetLocationEngine.shared.startAtLaunch()',1)
              p.write_text(s)
          PY

      - name: VERIFY COPIED SOURCES BEFORE XCODE BUILD
        run: |
          set -e
          cmp -s native-web/index.html ios/App/App/public/index.html
          cmp -s ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -F 'TaximetLocationEngine.shared.startAtLaunch()' ios/App/App/AppDelegate.swift >/dev/null
          echo 'FINAL SOURCE COPY VERIFY: PASS'

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/Assets.car"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons' "$APP_PATH/Info.plist" >/dev/null
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/Payload/TAXIMET PRO.app"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -qry "$GITHUB_WORKSPACE/TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa"

      - name: Verify packaged IPA
        run: |
          set -euo pipefail
          test -s TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa
          unzip -l TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa | grep -q 'Payload/TAXIMET PRO.app/'
          echo 'V45 V30 UI / V39 FUNCTIONAL CORE / GPS UI / SAFE AREA / KEEP AWAKE IPA PACKAGE: PASS'

      - name: Upload iOS IPA artifact to GitHub Actions
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v50.13-PAYMENT-COLOR-SYNC-LIVE-ACTIVITY-Unsigned
          path: |
            TAXIMET_PRO_v50.13_PAYMENT_COLOR_SYNC_LIVE_ACTIVITY_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app/**
          if-no-files-found: error
          retention-days: 7
