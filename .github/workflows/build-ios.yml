name: Build TAXIMET PRO v24 GPS ENGINE - OSM OFFLINE + GOOGLE ONLINE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0
          python -m pip install --upgrade pip Pillow
          sudo gem install xcodeproj --no-document

      - name: Download OSM offline database ZIP
        run: |
          set -e
          mkdir -p .osm_asset

          # The ZIP is stored in the repository at:
          # assets/osm/osm_vietnam_full_offline.zip
          test -s assets/osm/osm_vietnam_full_offline.zip

          cp assets/osm/osm_vietnam_full_offline.zip .osm_asset/osm_vietnam_full_offline.zip
          unzip -q -o .osm_asset/osm_vietnam_full_offline.zip -d .osm_asset/extracted

          test -s .osm_asset/extracted/osm_vietnam_full_offline.sqlite

          mkdir -p native-web
          cp .osm_asset/extracted/osm_vietnam_full_offline.sqlite native-web/osm_vietnam_full_offline.sqlite

          test -s native-web/osm_vietnam_full_offline.sqlite

          echo "SQLite bytes:"
          wc -c native-web/osm_vietnam_full_offline.sqlite

      - name: Verify source files and native iOS GPS contract
        run: |
          set -e
          test -s native-web/index.html
          test -s native-web/osm_vietnam_full_offline.sqlite
          test -s ios-native/TaximetLocationPlugin.swift

          echo '===== native-web/index.html ====='
          wc -c native-web/index.html
          echo '===== OSM SQLite ====='
          wc -c native-web/osm_vietnam_full_offline.sqlite
          echo '===== Swift ====='
          wc -c ios-native/TaximetLocationPlugin.swift

          python3 - <<'PYCODE'
          from pathlib import Path
          import re, sqlite3

          html = Path('native-web/index.html').read_text(encoding='utf-8')
          swift = Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')
          db = Path('native-web/osm_vietnam_full_offline.sqlite')

          required_html = [
              'isNativeIOSTaximet',
              'registerPlugin("TaximetLocation")',
              'native.addListener("locationUpdate"',
              'native.addListener("locationError"',
              'native.status()',
              'native.getLastLocation()',
              'startNativeGpsAtLaunch',
              'addressProvider',
              'reverseGeocode',
              'OSM',
              'GOOGLE',
          ]
          for marker in required_html:
              if marker not in html:
                  raise SystemExit(f'Missing HTML marker: {marker}')

          # The offline provider must not contain an online OSM/Nominatim reverse URL.
          forbidden_online_osm = [
              'nominatim.openstreetmap.org/reverse',
          ]
          for marker in forbidden_online_osm:
              if marker.lower() in html.lower():
                  raise SystemExit(f'Forbidden online OSM marker still present: {marker}')

          forbidden = [
              'routes.googleapis.com',
              'computeRoutes',
              'resolveGap',
              'drAccrueUntil',
              'gapLedger',
              'drFactor',
          ]
          for marker in forbidden:
              if marker.lower() in html.lower():
                  raise SystemExit(f'Forbidden removed-feature marker still present: {marker}')

          funcs = re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(', html)
          dup = sorted({x for x in funcs if funcs.count(x) > 1})
          if dup:
              raise SystemExit('Duplicate function declarations: ' + ', '.join(dup))

          swift_required = [
              'TaximetLocationEngine',
              'CLLocationManager',
              'CAPBridgedPlugin',
              'allowsBackgroundLocationUpdates = true',
              'showsBackgroundLocationIndicator = true',
              'pausesLocationUpdatesAutomatically = false',
              'startUpdatingLocation()',
              'startAtLaunch()',
          ]
          for marker in swift_required:
              if marker not in swift:
                  raise SystemExit(f'Missing Swift GPS marker: {marker}')

          if len(re.findall(r'func\s+locationManagerDidChangeAuthorization\s*\(', swift)) != 1:
              raise SystemExit('Swift authorization callback count is not exactly 1')

          con = sqlite3.connect(db)
          try:
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              if integrity != 'ok':
                  raise SystemExit(f'SQLite integrity_check failed: {integrity}')

              required_tables = {'addresses','address_rtree','roads','road_rtree','places','place_rtree','meta'}
              tables = {
                  row[0] for row in con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              missing = required_tables - tables
              if missing:
                  raise SystemExit('SQLite missing tables: ' + ', '.join(sorted(missing)))
          finally:
              con.close()

          print('SOURCE + SQLITE CONTRACT: PASS')
          PYCODE

      - name: Prepare Capacitor web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www

          cp native-web/index.html www/index.html
          cp native-web/osm_vietnam_full_offline.sqlite www/osm_vietnam_full_offline.sqlite

          test -s www/index.html
          test -s www/osm_vietnam_full_offline.sqlite

          cmp -s native-web/index.html www/index.html
          cmp -s native-web/osm_vietnam_full_offline.sqlite www/osm_vietnam_full_offline.sqlite

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Sync Capacitor iOS project
        run: |
          set -e
          npx cap sync ios

      - name: Install v24 native GPS plugin AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift              ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)
          target = project.targets.find { |t| t.name == 'App' } || project.targets.first
          raise 'App target not found' unless target

          app_group = project.main_group.children.find do |child|
            child.respond_to?(:path) && child.path.to_s == 'App'
          end
          raise 'App group not found' unless app_group

          plugins_group = app_group.children.find do |child|
            child.isa == 'PBXGroup' && child.path.to_s == 'Plugins'
          end
          plugins_group ||= app_group.new_group('Plugins', 'Plugins')

          taximet_group = plugins_group.children.find do |child|
            child.isa == 'PBXGroup' && child.path.to_s == 'TaximetLocation'
          end
          taximet_group ||= plugins_group.new_group('TaximetLocation', 'TaximetLocation')

          swift_name = 'TaximetLocationPlugin.swift'
          swift_ref = taximet_group.files.find { |f| File.basename(f.path.to_s) == swift_name }
          swift_ref ||= taximet_group.new_file(swift_name)

          target.source_build_phase.add_file_reference(swift_ref) unless target.source_build_phase.files.any? { |bf| bf.file_ref == swift_ref }

          project.save
          RUBY

      - name: Install web assets AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/public

          cp native-web/index.html ios/App/App/public/index.html
          cp native-web/osm_vietnam_full_offline.sqlite ios/App/App/public/osm_vietnam_full_offline.sqlite

          test -s ios/App/App/public/index.html
          test -s ios/App/App/public/osm_vietnam_full_offline.sqlite

      - name: Configure iOS location permissions and background mode
        run: |
          set -e
          PLIST='ios/App/App/Info.plist'

          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST" 2>/dev/null ||           /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST"

          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST" 2>/dev/null ||           /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST"

          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Install app icon
        run: |
          set -e
          APPICON='ios/App/App/Assets.xcassets/AppIcon.appiconset'
          rm -rf "$APPICON"
          mkdir -p "$APPICON"

          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Image.open('assets/app-icon/icon-512.png').convert('RGBA')
          out=Path('ios/App/App/Assets.xcassets/AppIcon.appiconset')
          sizes={
              'Icon-20@2x.png':40,'Icon-20@3x.png':60,
              'Icon-29@2x.png':58,'Icon-29@3x.png':87,
              'Icon-40@2x.png':80,'Icon-40@3x.png':120,
              'Icon-60@2x.png':120,'Icon-60@3x.png':180,
              'Icon-76@1x.png':76,'Icon-76@2x.png':152,
              'Icon-83.5@2x.png':167,'Icon-1024.png':1024
          }
          for name,size in sizes.items():
              src.resize((size,size),Image.Resampling.LANCZOS).save(out/name,'PNG')
          PY

          cat > "$APPICON/Contents.json" <<'JSON'
          {
            "images" : [
              {"filename":"Icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"Icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"Icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"Icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"Icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"Icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"Icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"Icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"Icon-76@1x.png","idiom":"ipad","scale":"1x","size":"76x76"},
              {"filename":"Icon-76@2x.png","idiom":"ipad","scale":"2x","size":"76x76"},
              {"filename":"Icon-83.5@2x.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},
              {"filename":"Icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info":{"author":"xcode","version":1}
          }
          JSON

      - name: HARD VERIFY final native iOS sources and SQLite
        run: |
          set -e

          test -s ios/App/App/public/index.html
          test -s ios/App/App/public/osm_vietnam_full_offline.sqlite

          cmp -s native-web/index.html ios/App/App/public/index.html
          cmp -s native-web/osm_vietnam_full_offline.sqlite ios/App/App/public/osm_vietnam_full_offline.sqlite
          cmp -s ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          python3 - <<'PYCODE'
          from pathlib import Path
          import sqlite3

          db = Path('ios/App/App/public/osm_vietnam_full_offline.sqlite')
          con = sqlite3.connect(db)
          try:
              assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          finally:
              con.close()

          html = Path('ios/App/App/public/index.html').read_text(encoding='utf-8')
          assert 'addressProvider' in html
          assert 'reverseGeocode' in html
          assert 'OSM' in html
          assert 'GOOGLE' in html
          assert 'nominatim.openstreetmap.org/reverse' not in html.lower()

          print('FINAL WEB + SQLITE VERIFY: PASS')
          PYCODE

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios/App
          xcodebuild             -workspace App.xcworkspace             -scheme App             -configuration Debug             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Verify SQLite inside compiled app
        run: |
          set -e
          APP_PATH="$(find ios/App/build -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"

          test -s "$APP_PATH/public/osm_vietnam_full_offline.sqlite"
          cmp -s native-web/osm_vietnam_full_offline.sqlite                  "$APP_PATH/public/osm_vietnam_full_offline.sqlite"

          echo 'COMPILED APP SQLITE: PASS'

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH="$(find ios/App/build -name 'App.app' -type d | head -n 1)"
          test -n "$APP_PATH"

          rm -rf artifacts
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" 'artifacts/Payload/TAXIMET PRO.app'

          cd artifacts
          zip -qry ../TAXIMET_PRO_v24_OSM_OFFLINE_GOOGLE_unsigned.ipa Payload

      - name: Verify packaged IPA and SQLite
        run: |
          set -e
          test -s TAXIMET_PRO_v24_OSM_OFFLINE_GOOGLE_unsigned.ipa

          unzip -l TAXIMET_PRO_v24_OSM_OFFLINE_GOOGLE_unsigned.ipa |             grep -q 'TAXIMET PRO.app/'

          unzip -l TAXIMET_PRO_v24_OSM_OFFLINE_GOOGLE_unsigned.ipa |             grep -q 'TAXIMET PRO.app/public/osm_vietnam_full_offline.sqlite'

          echo 'IPA + OFFLINE OSM SQLITE: PASS'

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v24-OSM-OFFLINE-GOOGLE-Unsigned
          path: TAXIMET_PRO_v24_OSM_OFFLINE_GOOGLE_unsigned.ipa
          retention-days: 7
