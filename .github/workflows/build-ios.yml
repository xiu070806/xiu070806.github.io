name: Build iOS - TAXIMET PRO GPS ENGINE v20

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          set -e
          npm install --no-audit --no-fund
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0

      - name: Verify v20 source files before Capacitor
        run: |
          set -e

          test -f native-web/index.html
          test -f ios-native/TaximetLocationPlugin.swift

          echo "Checking HTML GPS Engine..."
          grep -q "TAXIMET PRO GPS ENGINE DECOUPLED v20" native-web/index.html
          grep -q "startTaximetGpsEngineAtLaunch" native-web/index.html
          grep -q "GPS ENGINE is independent from Trip Engine" native-web/index.html

          echo "Checking native GPS..."
          grep -q "CLLocationManager" ios-native/TaximetLocationPlugin.swift
          grep -q "startUpdatingLocation" ios-native/TaximetLocationPlugin.swift
          grep -q "allowsBackgroundLocationUpdates" ios-native/TaximetLocationPlugin.swift
          grep -q "showsBackgroundLocationIndicator" ios-native/TaximetLocationPlugin.swift

          echo "v20 source verification: PASS"

      - name: Prepare Capacitor web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html

      - name: Create Capacitor iOS project
        run: |
          set -e
          rm -rf ios
          npx cap add ios

      - name: Sync Capacitor iOS project
        run: |
          set -e
          npx cap sync ios

      - name: Install v20 native GPS plugin AFTER sync
        run: |
          set -e

          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift \
             ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          echo "Native GPS source installed."

      - name: Install v20 web asset AFTER sync
        run: |
          set -e
          cp native-web/index.html ios/App/App/public/index.html

      - name: Configure iOS location permissions
        run: |
          set -e

          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes array" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes: string location" "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để nhận GPS." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần vị trí khi chạy nền để duy trì GPS." \
            "$PLIST" 2>/dev/null || true

      - name: HARD VERIFY v20 before Xcode
        run: |
          set -e

          test -f ios/App/App/public/index.html
          test -f ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          grep -q "TAXIMET PRO GPS ENGINE DECOUPLED v20" \
            ios/App/App/public/index.html

          grep -q "startTaximetGpsEngineAtLaunch" \
            ios/App/App/public/index.html

          grep -q "CLLocationManager" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          grep -q "startUpdatingLocation" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          grep -q "allowsBackgroundLocationUpdates" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          grep -q "showsBackgroundLocationIndicator" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          echo "HARD VERIFY v20: PASS"

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -e
          mkdir -p artifacts/Payload

          APP_PATH="ios/build/Build/Products/Debug-iphoneos/App.app"
          test -d "$APP_PATH"

          cp -R "$APP_PATH" artifacts/Payload/TAXIMET_PRO.app

          cd artifacts
          zip -qry ../TAXIMET_PRO_v20_GPS_ENGINE_unsigned.ipa Payload

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v20-GPS-ENGINE-1-Device-Unsigned
          path: TAXIMET_PRO_v20_GPS_ENGINE_unsigned.ipa
          if-no-files-found: error
