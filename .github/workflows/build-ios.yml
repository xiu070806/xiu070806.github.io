name: Build TAXIMET PRO iOS NEW

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate iOS project
        run: npx cap add ios

      - name: Apply native GPS bridge
        run: npm run cap:sync

      - name: Build unsigned IPA
        run: |
          set -e

          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            "Payload/TAXIMET PRO.app"

          /usr/bin/zip -r \
            ../../TAXIMET_PRO_NEW_unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_NEW_unsigned
          path: TAXIMET_PRO_NEW_unsigned.ipa
