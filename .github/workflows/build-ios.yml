name: TAXIMET PRO v14 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build TAXIMET PRO iOS v14
    runs-on: macos-15

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. XCODE
      # =====================================================
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version


      # =====================================================
      # 3. NODE.JS
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm


      # =====================================================
      # 4. PYTHON + PILLOW
      # =====================================================
      - name: Install Pillow
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow


      # =====================================================
      # 5. INSTALL NPM DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/ios@^7.4.0


      # =====================================================
      # 6. CREATE IOS PROJECT
      # =====================================================
      - name: Create Capacitor iOS project
        run: |
          npx cap add ios


      # =====================================================
      # 7. COPY SHARED NATIVE WEB
      #
      # Android + iOS dùng chung:
      # native-web/index.html
      # =====================================================
      - name: Install shared native web
        run: |
          set -e

          test -f native-web/index.html

          rm -rf www
          mkdir -p www

          cp native-web/index.html www/index.html

          echo "======================================"
          echo "Shared native-web/index.html installed"
          echo "======================================"


      # =====================================================
      # 8. VERIFY WEB SOURCE
      # =====================================================
      - name: Verify TAXIMET PRO web source
        run: |
          set -e

          test -f www/index.html

          grep -q "TaximetLocation" www/index.html
          grep -q "function startGps" www/index.html
          grep -q "function stopGps" www/index.html

          # Core taxi-meter functions
          grep -q "startTrip" www/index.html
          grep -q "pauseTrip" www/index.html
          grep -q "resumeTrip" www/index.html
          grep -q "finishTrip" www/index.html

          # GPS / fare compensation
          grep -q "resolveGap" www/index.html
          grep -q "drAccrueUntil" www/index.html

          # Revenue / debt
          grep -q "renderRevenue" www/index.html
          grep -q "renderDebt" www/index.html

          echo "======================================"
          echo "TAXIMET PRO web source OK"
          echo "======================================"


      # =====================================================
      # 9. CAPACITOR SYNC
      # =====================================================
      - name: Capacitor sync iOS
        run: |
          npx cap sync ios


      # =====================================================
      # 10. COPY NATIVE IOS GPS PLUGIN
      # =====================================================
      - name: Install TaximetLocationPlugin.swift
        run: |
          set -e

          test -f ios-native/TaximetLocationPlugin.swift

          mkdir -p \
            ios/App/App/Plugins/TaximetLocation

          cp \
            ios-native/TaximetLocationPlugin.swift \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          echo "Swift GPS plugin copied."


      # =====================================================
      # 11. CREATE CAPACITOR OBJECTIVE-C REGISTRATION
      # =====================================================
      - name: Create Capacitor plugin registration
        run: |
          set -e

          cat > ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Capacitor/Capacitor.h>

          CAP_PLUGIN(TaximetLocationPlugin, "TaximetLocation",
            CAP_PLUGIN_METHOD(start, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(stop, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(getLastLocation, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(status, CAPPluginReturnPromise);
          )
          EOF

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

          echo "Capacitor plugin registration created."


      # =====================================================
      # 12. ADD SWIFT + OBJECTIVE-C FILES TO XCODE PROJECT
      # =====================================================
      - name: Add native plugin files to Xcode project
        run: |
          python3 <<'PY'
          from pathlib import Path
          import uuid

          project = Path("ios/App/App.xcodeproj/project.pbxproj")

          if not project.exists():
              raise SystemExit("ERROR: project.pbxproj not found")

          s = project.read_text()

          swift_name = "TaximetLocationPlugin.swift"
          objc_name = "TaximetLocationPlugin.m"

          # If already registered, do nothing.
          if swift_name in s and objc_name in s:
              print("Plugin files already exist in Xcode project.")
              raise SystemExit(0)

          def gid():
              return uuid.uuid4().hex[:24].upper()

          swift_ref = gid()
          swift_build = gid()

          objc_ref = gid()
          objc_build = gid()

          # -------------------------------------------------
          # PBXFileReference
          # -------------------------------------------------
          file_marker = "/* Begin PBXFileReference section */"

          file_refs = f"""
              {swift_ref} /* {swift_name} */ = {{
                  isa = PBXFileReference;
                  lastKnownFileType = sourcecode.swift;
                  path = Plugins/TaximetLocation/{swift_name};
                  sourceTree = "<group>";
              }};
              {objc_ref} /* {objc_name} */ = {{
                  isa = PBXFileReference;
                  lastKnownFileType = sourcecode.cpp.objc;
                  path = Plugins/TaximetLocation/{objc_name};
                  sourceTree = "<group>";
              }};
          """

          if file_marker not in s:
              raise SystemExit("ERROR: PBXFileReference section not found")

          s = s.replace(
              file_marker,
              file_marker + file_refs,
              1
          )

          # -------------------------------------------------
          # PBXBuildFile
          # -------------------------------------------------
          build_marker = "/* Begin PBXBuildFile section */"

          build_refs = f"""
              {swift_build} /* {swift_name} in Sources */ = {{
                  isa = PBXBuildFile;
                  fileRef = {swift_ref} /* {swift_name} */;
              }};
              {objc_build} /* {objc_name} in Sources */ = {{
                  isa = PBXBuildFile;
                  fileRef = {objc_ref} /* {objc_name} */;
              }};
          """

          if build_marker not in s:
              raise SystemExit("ERROR: PBXBuildFile section not found")

          s = s.replace(
              build_marker,
              build_marker + build_refs,
              1
          )

          # -------------------------------------------------
          # PBXSourcesBuildPhase
          # -------------------------------------------------
          sources_marker = "/* Sources */ = {"

          sources_pos = s.find(sources_marker)

          if sources_pos < 0:
              raise SystemExit(
                  "ERROR: PBXSourcesBuildPhase not found"
              )

          # Find the first closing ');' after Sources.
          end_pos = s.find(
              "\n\t\t\t);",
              sources_pos
          )

          if end_pos < 0:
              raise SystemExit(
                  "ERROR: Sources file list not found"
              )

          source_entries = f"""
                  {swift_build} /* {swift_name} in Sources */,
                  {objc_build} /* {objc_name} in Sources */,
          """

          s = (
              s[:end_pos]
              + source_entries
              + s[end_pos:]
          )

          project.write_text(s)

          print("Native iOS plugin files added to Xcode project.")
          PY


      # =====================================================
      # 13. CONFIGURE IOS GPS PERMISSIONS
      # =====================================================
      - name: Configure iOS GPS permissions
        run: |
          set -e

          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước theo GPS." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để tính cước theo GPS." \
            "$PLIST"

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến." \
            "$PLIST"

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes array" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes:0 string location" \
            "$PLIST" 2>/dev/null || true

          echo "iOS background location configured."


      # =====================================================
      # 14. INSTALL EV PRO ICON
      # =====================================================
      - name: Install EV Pro iOS icon
        run: |
          set -e

          test -f assets/app-icon/icon-512.png

          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"

          rm -rf "$APPICON"
          mkdir -p "$APPICON"

          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          source = Path("assets/app-icon/icon-512.png")
          target = Path(
              "ios/App/App/Assets.xcassets/AppIcon.appiconset"
          )

          if not source.exists():
              raise SystemExit("icon-512.png not found")

          img = Image.open(source).convert("RGBA")

          sizes = {
              "icon-20@2x.png": 40,
              "icon-20@3x.png": 60,

              "icon-29@2x.png": 58,
              "icon-29@3x.png": 87,

              "icon-40@2x.png": 80,
              "icon-40@3x.png": 120,

              "icon-60@2x.png": 120,
              "icon-60@3x.png": 180,

              "icon-76@2x.png": 152,

              "icon-83.5@2x.png": 167,

              "icon-1024.png": 1024
          }

          for filename, size in sizes.items():

              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  target / filename,
                  "PNG"
              )

          print("EV Pro iOS icons generated.")
          PY


      # =====================================================
      # 15. APP ICON CONTENTS.JSON
      # =====================================================
      - name: Configure AppIcon
        run: |
          set -e

          cat > \
          ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json \
          <<'EOF'
          {
            "images": [
              {
                "filename": "icon-20@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "20x20"
              },
              {
                "filename": "icon-20@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "20x20"
              },
              {
                "filename": "icon-29@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "29x29"
              },
              {
                "filename": "icon-29@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "29x29"
              },
              {
                "filename": "icon-40@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "40x40"
              },
              {
                "filename": "icon-40@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "40x40"
              },
              {
                "filename": "icon-60@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "60x60"
              },
              {
                "filename": "icon-60@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "60x60"
              },
              {
                "filename": "icon-76@2x.png",
                "idiom": "ipad",
                "scale": "2x",
                "size": "76x76"
              },
              {
                "filename": "icon-83.5@2x.png",
                "idiom": "ipad",
                "scale": "2x",
                "size": "83.5x83.5"
              },
              {
                "filename": "icon-1024.png",
                "idiom": "ios-marketing",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF

          echo "AppIcon Contents.json created."


      # =====================================================
      # 16. VERIFY IOS PROJECT
      # =====================================================
      - name: Verify iOS project
        run: |
          set -e

          echo "Checking Swift plugin..."

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          echo "Checking Objective-C registration..."

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

          echo "Checking AppIcon..."

          test -f \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png

          test -f \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json

          echo "Checking Info.plist..."

          grep -q \
            "NSLocationWhenInUseUsageDescription" \
            ios/App/App/Info.plist

          grep -q \
            "NSLocationAlwaysAndWhenInUseUsageDescription" \
            ios/App/App/Info.plist

          grep -q \
            "UIBackgroundModes" \
            ios/App/App/Info.plist

          grep -q \
            "location" \
            ios/App/App/Info.plist

          echo "======================================"
          echo "iOS project verification OK"
          echo "======================================"


      # =====================================================
      # 17. BUILD UNSIGNED APP
      # =====================================================
      - name: Build unsigned iOS app
        run: |
          set -e

          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


      # =====================================================
      # 18. FIND APP
      # =====================================================
      - name: Locate built App
        run: |
          set -e

          APP_PATH="$(find ios/App/build \
            -name 'App.app' \
            -type d \
            | head -n 1)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            exit 1
          fi

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app directory missing"
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

          echo "======================================"
          echo "APP FOUND"
          echo "$APP_PATH"
          echo "======================================"


      # =====================================================
      # 19. PACKAGE IPA
      # =====================================================
      - name: Package unsigned IPA
        run: |
          set -e

          rm -rf artifacts

          mkdir -p artifacts/Payload

          cp -R \
            "$APP_PATH" \
            "artifacts/Payload/TAXIMET PRO.app"

          cd artifacts

          zip -qry \
            ../TAXIMET_PRO_v14_unsigned.ipa \
            Payload

          cd ..

          test -f \
            TAXIMET_PRO_v14_unsigned.ipa

          echo "======================================"
          echo "IPA CREATED"
          echo "======================================"

          ls -lh TAXIMET_PRO_v14_unsigned.ipa


      # =====================================================
      # 20. UPLOAD APP + IPA
      # =====================================================
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v14-iOS
          path: |
            TAXIMET_PRO_v14_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
          if-no-files-found: error
          retention-days: 7
