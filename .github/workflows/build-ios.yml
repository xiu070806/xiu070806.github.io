name: TAXIMET PRO iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Prepare web directory
        run: |
          rm -rf www
          mkdir -p www

          cp index.html www/index.html

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest www/manifest.webmanifest
          fi

          if [ -f sw.js ]; then
            cp sw.js www/sw.js
          fi

          if [ -d icons ]; then
            cp -R icons www/icons
          fi

          if [ -d assets ]; then
            cp -R assets www/assets
          fi

      - name: Add Capacitor iOS
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Configure iOS background location
        run: |
          PLIST="ios/App/App/Info.plist"

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes array" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes:0 string location" \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính tiền theo GPS." \
            "$PLIST" 2>/dev/null || true

          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tiếp tục nhận GPS khi chạy nền." \
            "$PLIST" 2>/dev/null || true

      - name: Build unsigned iOS app
        run: |
          cd ios/App

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA
        run: |
          cd ios/App

          mkdir -p Payload

          cp -R \
            build/Build/Products/Release-iphoneos/App.app \
            Payload/TAXIMET_PRO.app

          zip -r \
            ../../TAXIMET_PRO_unsigned.ipa \
            Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_unsigned
          path: TAXIMET_PRO_unsigned.ipa
