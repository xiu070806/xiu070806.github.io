name: TAXIMET PRO v14 - Build iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    name: Build TAXIMET PRO iOS v14
    runs-on: macos-15

    steps:

      # =====================================================
      # 1. CHECKOUT
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # 2. SELECT XCODE
      # =====================================================
      - name: Select Xcode
        run: |
          set -e

          sudo xcode-select -s /Applications/Xcode.app

          xcodebuild -version


      # =====================================================
      # 3. NODE.JS
      #
      # IMPORTANT:
      # Không dùng cache: npm vì repository hiện không có
      # package-lock.json.
      # =====================================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22


      # =====================================================
      # 4. PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"


      # =====================================================
      # 5. INSTALL PILLOW
      # =====================================================
      - name: Install Pillow
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install Pillow


      # =====================================================
      # 6. INSTALL NPM DEPENDENCIES
      # =====================================================
      - name: Install dependencies
        run: |
          set -e

          npm install

          npm install @capacitor/core@^7.4.0
          npm install @capacitor/ios@^7.4.0


      # =====================================================
      # 7. CREATE IOS PROJECT
      # =====================================================
      - name: Create Capacitor iOS project
        run: |
          set -e

          npx cap add ios


      # =====================================================
      # 8. INSTALL SHARED NATIVE WEB
      #
      # native-web/index.html
      #
      # Dùng chung cho:
      # Android + iOS
      #
      # ROOT index.html KHÔNG bị thay đổi.
      # =====================================================
      - name: Install shared native web
        run: |
          set -e

          test -f native-web/index.html

          rm -rf www
          mkdir -p www

          cp native-web/index.html www/index.html

          echo "======================================"
          echo "Shared native-web installed"
          echo "======================================"


      # =====================================================
      # 9. VERIFY NATIVE WEB
      # =====================================================
      - name: Verify TAXIMET PRO native web
        run: |
          set -e

          test -f www/index.html

          echo "Checking TaximetLocation..."

          grep -q "TaximetLocation" www/index.html

          echo "Checking startGps..."

          grep -q "function startGps" www/index.html

          echo "Checking stopGps..."

          grep -q "function stopGps" www/index.html

          echo "Checking taxi trip functions..."

          grep -q "startTrip" www/index.html
          grep -q "pauseTrip" www/index.html
          grep -q "resumeTrip" www/index.html
          grep -q "finishTrip" www/index.html

          echo "Checking GPS compensation..."

          grep -q "resolveGap" www/index.html
          grep -q "drAccrueUntil" www/index.html

          echo "Checking revenue..."

          grep -q "renderRevenue" www/index.html

          echo "Checking debt..."

          grep -q "renderDebt" www/index.html

          echo "======================================"
          echo "Native web verification OK"
          echo "======================================"


      # =====================================================
      # 10. CAPACITOR SYNC
      # =====================================================
      - name: Capacitor sync iOS
        run: |
          set -e

          npx cap sync ios


      # =====================================================
      # 11. INSTALL IOS GPS PLUGIN
      # =====================================================
      - name: Install TaximetLocationPlugin.swift
        run: |
          set -e

          test -f ios-native/TaximetLocationPlugin.swift

          mkdir -p \
            ios/App/App/Plugins/TaximetLocation

          cp \
            ios-native/TaximetLocationPlugin.swift \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift

          echo "======================================"
          echo "Swift GPS plugin copied"
          echo "======================================"


      # =====================================================
      # 12. CREATE OBJECTIVE-C CAPACITOR REGISTRATION
      # =====================================================
      - name: Create TaximetLocation plugin registration
        run: |
          set -e

          cat > \
          ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m \
          <<'EOF'
          #import <Foundation/Foundation.h>
          #import <Capacitor/Capacitor.h>

          CAP_PLUGIN(TaximetLocationPlugin, "TaximetLocation",
            CAP_PLUGIN_METHOD(start, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(stop, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(getLastLocation, CAPPluginReturnPromise);
            CAP_PLUGIN_METHOD(status, CAPPluginReturnPromise);
          )
          EOF

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m

          echo "======================================"
          echo "Objective-C plugin registration created"
          echo "======================================"


      # =====================================================
      # 13. INSTALL XCODEPROJ GEM
      # =====================================================
      - name: Install xcodeproj
        run: |
          set -e

          sudo gem install xcodeproj --no-document


      # =====================================================
      # 14. ADD GPS PLUGIN TO XCODE PROJECT
      #
      # FIX:
      # Không dùng đường dẫn:
      #
      # ios/App/App/...
      #
      # làm path bên trong Xcode project.
      #
      # Xcode project có group App tương ứng:
      #
      # ios/App/App/
      #
      # Plugin sẽ được thêm vào:
      #
      # App
      #  └── Plugins
      #      └── TaximetLocation
      #
      # và file path là:
      #
      # Plugins/TaximetLocation/...
      # =====================================================
      - name: Add GPS plugin to Xcode project
        run: |
          set -e

          ruby <<'RUBY'
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'

          project = Xcodeproj::Project.open(project_path)

          target =
            project.targets.find { |t| t.name == 'App' } ||
            project.targets.first

          abort 'ERROR: App target not found' unless target

          puts "Target: #{target.name}"


          # =================================================
          # Find the existing App group
          # =================================================

          app_group =
            project.main_group.children.find do |child|
              child.respond_to?(:path) &&
              child.path.to_s == 'App'
            end

          unless app_group
            app_group =
              project.main_group.groups.find do |group|
                group.path.to_s == 'App'
              end
          end

          abort 'ERROR: App group not found in Xcode project' unless app_group


          puts "App group found: #{app_group.path}"


          # =================================================
          # Create/find Plugins group
          # =================================================

          plugins_group =
            app_group.children.find do |child|
              child.isa == 'PBXGroup' &&
              child.path.to_s == 'Plugins'
            end

          unless plugins_group
            plugins_group =
              app_group.new_group(
                'Plugins',
                'Plugins'
              )
          end


          # =================================================
          # Create/find TaximetLocation group
          # =================================================

          taximet_group =
            plugins_group.children.find do |child|
              child.isa == 'PBXGroup' &&
              child.path.to_s == 'TaximetLocation'
            end

          unless taximet_group
            taximet_group =
              plugins_group.new_group(
                'TaximetLocation',
                'TaximetLocation'
              )
          end


          # =================================================
          # Swift plugin
          #
          # IMPORTANT:
          # Path is relative to ios/App/App/
          # =================================================

          swift_path =
            'Plugins/TaximetLocation/TaximetLocationPlugin.swift'


          swift_ref =
            project.files.find do |file|
              file.path.to_s == swift_path
            end


          unless swift_ref
            swift_ref =
              taximet_group.new_file(
                'TaximetLocationPlugin.swift'
              )
          end


          unless target.source_build_phase.files.any? do |build_file|
            build_file.file_ref == swift_ref
          end

            target.source_build_phase.add_file_reference(
              swift_ref
            )

          end


          # =================================================
          # Objective-C registration
          # =================================================

          objc_path =
            'Plugins/TaximetLocation/TaximetLocationPlugin.m'


          objc_ref =
            project.files.find do |file|
              file.path.to_s == objc_path
            end


          unless objc_ref
            objc_ref =
              taximet_group.new_file(
                'TaximetLocationPlugin.m'
              )
          end


          unless target.source_build_phase.files.any? do |build_file|
            build_file.file_ref == objc_ref
          end

            target.source_build_phase.add_file_reference(
              objc_ref
            )

          end


          # =================================================
          # Save
          # =================================================

          project.save


          puts "======================================"
          puts "GPS plugin added to Xcode correctly"
          puts "======================================"

          puts "Swift:"
          puts swift_ref.path

          puts "Objective-C:"
          puts objc_ref.path
          RUBY


      # =====================================================
      # 15. VERIFY XCODE PLUGIN PATH
      # =====================================================
      - name: Verify Xcode plugin paths
        run: |
          set -e

          PROJECT="ios/App/App.xcodeproj/project.pbxproj"

          echo "Checking for incorrect duplicated paths..."

          if grep -q "ios/App/App/ios/App/App" "$PROJECT"; then
            echo "ERROR: duplicated iOS project path detected"
            exit 1
          fi


          echo "Checking Swift plugin..."

          grep -q \
            "TaximetLocationPlugin.swift" \
            "$PROJECT"


          echo "Checking Objective-C plugin..."

          grep -q \
            "TaximetLocationPlugin.m" \
            "$PROJECT"


          echo "======================================"
          echo "Xcode plugin path verification OK"
          echo "======================================"


      # =====================================================
      # 16. CONFIGURE IOS GPS PERMISSIONS
      # =====================================================
      - name: Configure iOS GPS permissions
        run: |
          set -e

          PLIST="ios/App/App/Info.plist"


          # -------------------------------------------------
          # When In Use
          # -------------------------------------------------
          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để tính cước theo GPS." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để tính cước theo GPS." \
            "$PLIST"


          # -------------------------------------------------
          # Always + When In Use
          # -------------------------------------------------
          /usr/libexec/PlistBuddy -c \
            "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến." \
            "$PLIST" 2>/dev/null || \
          /usr/libexec/PlistBuddy -c \
            "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần vị trí khi ứng dụng chạy nền để tiếp tục ghi nhận chuyến." \
            "$PLIST"


          # -------------------------------------------------
          # Background location
          # -------------------------------------------------

          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes array" \
            "$PLIST" 2>/dev/null || true


          /usr/libexec/PlistBuddy -c \
            "Add :UIBackgroundModes:0 string location" \
            "$PLIST" 2>/dev/null || true


          echo "======================================"
          echo "iOS GPS permissions configured"
          echo "======================================"


      # =====================================================
      # 17. INSTALL TAXIMET PRO ICON
      # =====================================================
      - name: Install TAXIMET PRO iOS icon
        run: |
          set -e

          test -f assets/app-icon/icon-512.png


          APPICON="ios/App/App/Assets.xcassets/AppIcon.appiconset"


          rm -rf "$APPICON"

          mkdir -p "$APPICON"


          python3 <<'PY'
          from PIL import Image
          from pathlib import Path


          source = Path(
              "assets/app-icon/icon-512.png"
          )


          target = Path(
              "ios/App/App/Assets.xcassets/AppIcon.appiconset"
          )


          if not source.exists():
              raise SystemExit(
                  "ERROR: icon-512.png not found"
              )


          img = Image.open(source).convert("RGBA")


          sizes = {

              "icon-20@2x.png": 40,
              "icon-20@3x.png": 60,

              "icon-29@2x.png": 58,
              "icon-29@3x.png": 87,

              "icon-40@2x.png": 80,
              "icon-40@3x.png": 120,

              "icon-60@2x.png": 120,
              "icon-60@3x.png": 180,

              "icon-76@2x.png": 152,

              "icon-83.5@2x.png": 167,

              "icon-1024.png": 1024
          }


          for filename, size in sizes.items():

              icon = img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              )

              icon.save(
                  target / filename,
                  "PNG"
              )


          print(
              "======================================"
          )

          print(
              "TAXIMET PRO icons generated"
          )

          print(
              "======================================"
          )
          PY


      # =====================================================
      # 18. CONFIGURE APP ICON CONTENTS
      # =====================================================
      - name: Configure AppIcon Contents
        run: |
          set -e


          cat > \
          ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json \
          <<'EOF'
          {
            "images": [
              {
                "filename": "icon-20@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "20x20"
              },
              {
                "filename": "icon-20@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "20x20"
              },
              {
                "filename": "icon-29@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "29x29"
              },
              {
                "filename": "icon-29@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "29x29"
              },
              {
                "filename": "icon-40@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "40x40"
              },
              {
                "filename": "icon-40@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "40x40"
              },
              {
                "filename": "icon-60@2x.png",
                "idiom": "iphone",
                "scale": "2x",
                "size": "60x60"
              },
              {
                "filename": "icon-60@3x.png",
                "idiom": "iphone",
                "scale": "3x",
                "size": "60x60"
              },
              {
                "filename": "icon-76@2x.png",
                "idiom": "ipad",
                "scale": "2x",
                "size": "76x76"
              },
              {
                "filename": "icon-83.5@2x.png",
                "idiom": "ipad",
                "scale": "2x",
                "size": "83.5x83.5"
              },
              {
                "filename": "icon-1024.png",
                "idiom": "ios-marketing",
                "scale": "1x",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          EOF


          echo "AppIcon configured."


      # =====================================================
      # 19. VERIFY IOS PROJECT
      # =====================================================
      - name: Verify iOS project
        run: |
          set -e


          echo "======================================"
          echo "VERIFY IOS PROJECT"
          echo "======================================"


          # -------------------------------------------------
          # Swift plugin
          # -------------------------------------------------

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift


          # -------------------------------------------------
          # Objective-C registration
          # -------------------------------------------------

          test -f \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.m


          # -------------------------------------------------
          # Icon
          # -------------------------------------------------

          test -f \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png


          test -f \
            ios/App/App/Assets.xcassets/AppIcon.appiconset/Contents.json


          # -------------------------------------------------
          # GPS permissions
          # -------------------------------------------------

          grep -q \
            "NSLocationWhenInUseUsageDescription" \
            ios/App/App/Info.plist


          grep -q \
            "NSLocationAlwaysAndWhenInUseUsageDescription" \
            ios/App/App/Info.plist


          grep -q \
            "UIBackgroundModes" \
            ios/App/App/Info.plist


          grep -q \
            "location" \
            ios/App/App/Info.plist


          # -------------------------------------------------
          # Swift methods
          # -------------------------------------------------

          grep -q \
            "func start" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift


          grep -q \
            "func stop" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift


          grep -q \
            "getLastLocation" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift


          grep -q \
            "status" \
            ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift


          echo "======================================"
          echo "ALL IOS CHECKS PASSED"
          echo "======================================"


      # =====================================================
      # 20. BUILD UNSIGNED IOS APP
      # =====================================================
      - name: Build unsigned iOS app
        run: |
          set -e


          cd ios/App


          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build


      # =====================================================
      # 21. LOCATE BUILT APP
      # =====================================================
      - name: Locate built App
        run: |
          set -e


          APP_PATH="$(
            find ios/App/build \
              -name 'App.app' \
              -type d \
              | head -n 1
          )"


          if [ -z "$APP_PATH" ]; then
            echo "ERROR: App.app not found"
            exit 1
          fi


          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app directory missing"
            exit 1
          fi


          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"


          echo "======================================"
          echo "APP FOUND"
          echo "$APP_PATH"
          echo "======================================"


      # =====================================================
      # 22. PACKAGE UNSIGNED IPA
      # =====================================================
      - name: Package unsigned IPA
        run: |
          set -e


          rm -rf artifacts


          mkdir -p \
            "artifacts/Payload"


          cp -R \
            "$APP_PATH" \
            "artifacts/Payload/TAXIMET PRO.app"


          cd artifacts


          zip -qry \
            ../TAXIMET_PRO_v14_unsigned.ipa \
            Payload


          cd ..


          test -f \
            TAXIMET_PRO_v14_unsigned.ipa


          echo "======================================"
          echo "UNSIGNED IPA CREATED"
          echo "======================================"


          ls -lh \
            TAXIMET_PRO_v14_unsigned.ipa


      # =====================================================
      # 23. UPLOAD IOS ARTIFACTS
      # =====================================================
      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v14-iOS
          path: |
            TAXIMET_PRO_v14_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app
          if-no-files-found: error
          retention-days: 7
