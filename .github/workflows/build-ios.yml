name: Build TAXIMET PRO Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        shell: bash
        run: |
          set -e
          echo "Available Xcode installations:"
          ls -1 /Applications | grep '^Xcode' || true

          if [ -d "/Applications/Xcode_16.4.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.4.app/Contents/Developer"
          elif [ -d "/Applications/Xcode_16.3.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_16.3.app/Contents/Developer"
          else
            sudo xcode-select -s "/Applications/Xcode.app/Contents/Developer"
          fi

          xcodebuild -version

      - name: Verify iOS project
        shell: bash
        run: |
          set -e
          test -f "TAXIMET PRO/TAXIMET PRO.xcodeproj/project.pbxproj"
          test -f "TAXIMET PRO/Info.plist"
          test -f "TAXIMET PRO/AppDelegate.swift"
          test -f "TAXIMET PRO/ViewController.swift"
          test -f "TAXIMET PRO/NativeLocationService.swift"
          test -f "TAXIMET PRO/Resources/index.html"

      - name: Build unsigned .app
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build

          xcodebuild             -project "TAXIMET PRO/TAXIMET PRO.xcodeproj"             -scheme "TAXIMET PRO"             -sdk iphoneos             -configuration Release             -derivedDataPath "$PWD/build/DerivedData"             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             clean build

      - name: Locate built app
        shell: bash
        run: |
          set -e

          APP_PATH="$(find "$PWD/build/DerivedData/Build/Products/Release-iphoneos"             -maxdepth 1 -type d -name "*.app" -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app was produced."
            find "$PWD/build/DerivedData" -maxdepth 5 -print || true
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app: $APP_PATH"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -e

          rm -rf ipa
          mkdir -p "ipa/Payload"

          cp -R "$APP_PATH" "ipa/Payload/"

          cd ipa
          zip -r "../TAXIMET_PRO_unsigned.ipa" Payload

          cd ..
          ls -lh "TAXIMET_PRO_unsigned.ipa"
          unzip -l "TAXIMET_PRO_unsigned.ipa" | head -30

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_unsigned_ipa
          path: TAXIMET_PRO_unsigned.ipa
          if-no-files-found: error
          retention-days: 30
