name: Build TAXIMET PRO v24 - IndexedDB + Core Location Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          set -e
          npm install
          npm install --save-exact @capacitor/core@7.4.0 @capacitor/cli@7.4.0 @capacitor/ios@7.4.0
          sudo gem install xcodeproj --no-document

      - name: VERIFY EXACT SOURCE + ARCHITECTURE
        run: |
          set -euo pipefail
          test -s native-web/index.html
          test -s ios-native/TaximetLocationPlugin.swift

          EXPECTED_HTML_SHA='7935bf62920884bb5d73e61e65f754775ac8fdea64dfe4052638d26291de7024'
          EXPECTED_SWIFT_SHA='fbe6d95d6f85cab3f4c0f46d7339d4965fd763f3d5e02593bd6fd667cd0d53d4'

          ACTUAL_HTML_SHA="$(shasum -a 256 native-web/index.html | awk '{print $1}')"
          ACTUAL_SWIFT_SHA="$(shasum -a 256 ios-native/TaximetLocationPlugin.swift | awk '{print $1}')"
          echo "HTML expected:  $EXPECTED_HTML_SHA"
          echo "HTML actual:    $ACTUAL_HTML_SHA"
          echo "Swift expected: $EXPECTED_SWIFT_SHA"
          echo "Swift actual:   $ACTUAL_SWIFT_SHA"
          test "$ACTUAL_HTML_SHA" = "$EXPECTED_HTML_SHA"
          test "$ACTUAL_SWIFT_SHA" = "$EXPECTED_SWIFT_SHA"

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('native-web/index.html').read_text(encoding='utf-8')
          swift=Path('ios-native/TaximetLocationPlugin.swift').read_text(encoding='utf-8')
          required=[
            'TAXIMET_PRO_DB','flushPersistentStorage','hydratePersistentData',
            'function bootCoreLocationStatusMonitor','native.addListener("gpsStatus"',
            'function renderCoreLocationStatus','function ensureCoreLocationStatusMonitor',
            'function startCoreLocationStatusMonitorPoll','ONE physical GPS source: native Core Location',
            'TaximetLocation','CLLocationManager','startAtLaunch()'
          ]
          missing=[x for x in required if x not in html and x not in swift]
          if missing:
            print('MISSING MARKERS:',missing); raise SystemExit(1)
          forbidden=['routes.googleapis.com','computeRoutes','resolveGap','drAccrueUntil','gapLedger','drFactor']
          bad=[x for x in forbidden if x.lower() in html.lower()]
          if bad:
            print('FORBIDDEN HTML MARKERS:',bad); raise SystemExit(1)
          funcs=re.findall(r'\bfunction\s+([A-Za-z_$][\w$]*)\s*\(',html)
          dup=sorted({x for x in funcs if funcs.count(x)>1})
          if dup:
            print('DUPLICATE JS FUNCTIONS:',dup); raise SystemExit(1)
          assert len(re.findall(r'func\s+locationManagerDidChangeAuthorization\s*\(',swift))==1
          assert len(re.findall(r'public\s+func\s+requestAlwaysAuthorization\s*\(',swift))==1
          assert 'CAP_PLUGIN(' not in swift
          print('SOURCE VERIFY: PASS')
          print('HTML bytes:',len(html.encode()))
          print('Swift bytes:',len(swift.encode()))
          print('Unique JS functions:',len(set(funcs)))
          PY

      - name: Prepare Capacitor web assets
        run: |
          set -e
          rm -rf www
          mkdir -p www
          cp native-web/index.html www/index.html
          cmp -s native-web/index.html www/index.html

      - name: Create Capacitor iOS project
        run: |
          set -e
          npx cap add ios

      - name: Sync Capacitor iOS project
        run: |
          set -e
          npx cap sync ios

      - name: Install native GPS plugin AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/Plugins/TaximetLocation
          cp ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          ruby <<'RUBY'
          require 'xcodeproj'
          project_path='ios/App/App.xcodeproj'
          project=Xcodeproj::Project.open(project_path)
          target=project.targets.find{|t|t.name=='App'} || project.targets.first
          raise 'App target not found' unless target
          app_group=project.main_group.children.find{|c|c.respond_to?(:path) && c.path.to_s=='App'}
          raise 'App group not found' unless app_group
          plugins_group=app_group.children.find{|c|c.isa=='PBXGroup' && c.path.to_s=='Plugins'}
          plugins_group ||= app_group.new_group('Plugins','Plugins')
          taximet_group=plugins_group.children.find{|c|c.isa=='PBXGroup' && c.path.to_s=='TaximetLocation'}
          taximet_group ||= plugins_group.new_group('TaximetLocation','TaximetLocation')
          swift_name='TaximetLocationPlugin.swift'
          swift_ref=taximet_group.files.find{|f|File.basename(f.path.to_s)==swift_name}
          swift_ref ||= taximet_group.new_file(swift_name)
          target.source_build_phase.add_file_reference(swift_ref) unless target.source_build_phase.files.any?{|bf|bf.file_ref==swift_ref}
          project.save
          RUBY

      - name: Install web asset AFTER sync
        run: |
          set -e
          mkdir -p ios/App/App/public
          cp native-web/index.html ios/App/App/public/index.html

      - name: Configure iOS location permissions and background mode
        run: |
          set -e
          PLIST='ios/App/App/Info.plist'
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí để nhận GPS." "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription TAXIMET PRO cần quyền vị trí khi ứng dụng chạy nền." "$PLIST"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"

      - name: Inject native GPS engine into AppDelegate
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ios/App/App/AppDelegate.swift')
          s=p.read_text()
          if 'TaximetLocationEngine.shared.startAtLaunch()' not in s:
              needles=[
                'override func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]? = nil) -> Bool {',
                'func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {',
                'func application(_ app: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {'
              ]
              needle=next((n for n in needles if n in s),None)
              if needle is None: raise SystemExit('AppDelegate didFinishLaunching not found')
              s=s.replace(needle,needle+'\n        TaximetLocationEngine.shared.startAtLaunch()',1)
              p.write_text(s)
          PY

      - name: VERIFY COPIED SOURCES
        run: |
          set -e
          cmp -s native-web/index.html ios/App/App/public/index.html
          cmp -s ios-native/TaximetLocationPlugin.swift ios/App/App/Plugins/TaximetLocation/TaximetLocationPlugin.swift
          grep -F 'TaximetLocationEngine.shared.startAtLaunch()' ios/App/App/AppDelegate.swift >/dev/null
          echo 'FINAL SOURCE COPY VERIFY: PASS'

      - name: Build unsigned iOS app
        run: |
          set -e
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Verify native GPS is actually packaged
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)"
          test -n "$APP_PATH"
          test -s "$APP_PATH/public/index.html"
          test -s "$APP_PATH/App.debug.dylib"
          strings "$APP_PATH/App.debug.dylib" | grep -q 'TaximetLocation'
          echo "Packaged App.app:"
          du -sh "$APP_PATH"
          ls -lh "$APP_PATH/App.debug.dylib" "$APP_PATH/public/index.html"
          echo 'NATIVE GPS PACKAGE VERIFY: PASS'

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find "$GITHUB_WORKSPACE/ios/App/build" -type d -name 'App.app' -print -quit)"
          test -n "$APP_PATH"
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/artifacts/Payload/TAXIMET PRO.app"
          cd "$GITHUB_WORKSPACE/artifacts"
          zip -qry "$GITHUB_WORKSPACE/TAXIMET_PRO_v24_INDEXEDDB_CORE_LOCATION_MONITOR_unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          test -s TAXIMET_PRO_v24_INDEXEDDB_CORE_LOCATION_MONITOR_unsigned.ipa
          ls -lh TAXIMET_PRO_v24_INDEXEDDB_CORE_LOCATION_MONITOR_unsigned.ipa
          echo 'IPA PACKAGE: PASS'

      - name: Upload iOS artifacts
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET-PRO-v24-INDEXEDDB-CORE-LOCATION-MONITOR-Unsigned
          path: |
            TAXIMET_PRO_v24_INDEXEDDB_CORE_LOCATION_MONITOR_unsigned.ipa
            artifacts/Payload/TAXIMET PRO.app/**
          if-no-files-found: error
          retention-days: 7
