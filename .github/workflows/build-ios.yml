name: Build iOS V50

on:
  workflow_dispatch:
  push:
    paths:
      - 'index(1)_v50.html'
      - 'TaximetLocationPlugin_v39.swift'
      - 'build-ios_v50.yml'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Capacitor dependencies
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "TAXIMET PRO" "com.taximet.pro" --web-dir=www || true

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp 'index(1)_v50.html' www/index.html

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS
        run: |
          xcodebuild             -workspace ios/App/App.xcworkspace             -scheme App             -sdk iphoneos             -configuration Release             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO

      - name: Package build
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent             build/DerivedData/Build/Products/Release-iphoneos/App.app             artifacts/TAXIMET_PRO_V50_App.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TAXIMET_PRO_V50
          path: artifacts/TAXIMET_PRO_V50_App.zip
